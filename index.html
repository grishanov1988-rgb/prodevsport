  font-size: 13px; font-weight: var(--fw-bold);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 2px;
}
.sbox-meta { font-size: 10px; color: var(--hint); margin-bottom: 2px; }
.sbox-price {
  font-size: 12px; font-weight: var(--fw-black);
  background: var(--gold-grad);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.sbox-btn {
  width: 37px; height: 37px; border-radius: 50%;
  background: var(--gold-grad); color: var(--on-accent);
  border: none; font-size: 18px; font-weight: var(--fw-black);
  cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: .15s; padding: 0; line-height: 1;
  box-shadow: var(--gold-glow);
}
.sbox-btn:disabled { background: var(--bg3); color: var(--hint); cursor: not-allowed; box-shadow: none; }
.sbox-btn:active:not(:disabled) { transform: scale(.9); }
.shop-box-compact.free { border-color: rgba(230,196,108,.6); background: var(--accent2); box-shadow: var(--gold-glow); }
.sbox-desc {
  font-size: 9px; color: var(--hint); margin-bottom: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sbox-price-free {
  background: var(--gold-grad);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: var(--fw-black);
}

/* Модалка открытия бокса */
.box-modal {
  display: flex; flex-direction: column; align-items: center;
  padding: 34px 17px 22px;
  background: linear-gradient(180deg, #0d0d13 0%, #14141c 100%);
  border-top: 1px solid rgba(230,196,108,.4);
  max-width: 100% !important;
}
.box-stage { position: relative; width: 145px; height: 145px; display: flex; align-items: center; justify-content: center; margin-bottom: 22px; }
.box-sprite {
  font-size: 100px; line-height: 1;
  filter: drop-shadow(0 0 22px rgba(230,196,108,.55));
}
.box-sprite.shake { animation: boxShake .6s infinite; }
.box-sprite.pop { animation: boxPop .4s forwards; }
.box-shine { position: absolute; inset: 0; border-radius: 50%; opacity: 0; pointer-events: none; }
.box-shine.flash { animation: boxFlash .5s; }
@keyframes boxShake {
  0%,100% { transform: rotate(0) translate(0,0); }
  20% { transform: rotate(-6deg) translate(-3px,2px); }
  40% { transform: rotate(6deg) translate(3px,-2px); }
  60% { transform: rotate(-4deg) translate(-2px,1px); }
  80% { transform: rotate(4deg) translate(2px,-1px); }
}
@keyframes boxPop { 0% { transform: scale(1); } 50% { transform: scale(1.4); } 100% { transform: scale(0); opacity: 0; } }
@keyframes boxFlash {
  0% { opacity: 0; box-shadow: 0 0 0 0 rgba(230,196,108,0); }
  40% { opacity: 1; box-shadow: 0 0 100px 40px rgba(230,196,108,.9); }
  100% { opacity: 0; box-shadow: 0 0 200px 80px rgba(230,196,108,0); }
}

/* 3D-FLIP карточки */
.box-cards {
  display: flex; gap: 11px; justify-content: center;
  width: 100%; flex-wrap: wrap; margin-bottom: 22px;
  perspective: 1200px;
}
.card-slot {
  width: 104px; height: 160px;
  opacity: 0;
  transform: translateY(30px) scale(.85);
  transition: opacity .4s, transform .5s cubic-bezier(.34,1.4,.64,1);
}
.card-slot.revealed { opacity: 1; transform: translateY(0) scale(1); }
.card-flip-inner {
  position: relative; width: 100%; height: 100%;
  transform-style: preserve-3d;
  transition: transform .8s cubic-bezier(.4,0,.2,1);
}
.card-slot.flipped .card-flip-inner { transform: rotateY(180deg); }
.card-face {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 13px; overflow: hidden;
}
.card-back {
  background: linear-gradient(135deg, #221e12, #171408);
  border: 2px solid rgba(230,196,108,.35);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
  color: var(--accent);
}
.card-back-pattern {
  font-size: 44px;
  filter: drop-shadow(0 0 12px rgba(230,196,108,.65));
  animation: backPulse 1.5s ease-in-out infinite;
}
.card-back-label {
  font-size: 9px; letter-spacing: 3px; margin-top: 9px;
  color: rgba(230,196,108,.6);
  text-transform: uppercase;
}
@keyframes backPulse {
  50% { transform: scale(1.08); filter: drop-shadow(0 0 20px rgba(230,196,108,.9)); }
}
.card-front {
  transform: rotateY(180deg);
  padding: 0; color: #2b1d08;
  box-shadow: 0 6px 18px rgba(0,0,0,.55);
}

/* ===== FC26-стиль карточки: солнечные лучи, щитовидный низ ===== */
.fc26 {
  position: absolute; inset: 0; z-index: 1;
  clip-path: polygon(0 3.2%, 3.5% 0, 96.5% 0, 100% 3.2%, 100% 86%, 50% 100%, 0 86%);
  overflow: hidden;
}
.fc26::before {
  content: ""; position: absolute; inset: 0;
  background:
    repeating-conic-gradient(from -90deg at 50% 33%, rgba(255,255,255,.28) 0deg 4.5deg, rgba(255,255,255,0) 4.5deg 9.5deg),
    radial-gradient(125% 95% at 50% 0%, #f2d480 0%, #e3ba5b 45%, #c99935 100%);
}
.card-front[data-tier="silver"] .fc26::before {
  background:
    repeating-conic-gradient(from -90deg at 50% 33%, rgba(255,255,255,.38) 0deg 4.5deg, rgba(255,255,255,0) 4.5deg 9.5deg),
    radial-gradient(125% 95% at 50% 0%, #edf0f4 0%, #c8cfd7 45%, #9aa3ad 100%);
}
.card-front[data-tier="bronze"] .fc26::before {
  background:
    repeating-conic-gradient(from -90deg at 50% 33%, rgba(255,255,255,.22) 0deg 4.5deg, rgba(255,255,255,0) 4.5deg 9.5deg),
    radial-gradient(125% 95% at 50% 0%, #dda76b 0%, #bd7f45 45%, #96602f 100%);
}
.fc26-top { position: absolute; top: 7px; left: 9px; z-index: 2; text-align: center; }
.fc26-ovr { font-size: 20px; font-weight: var(--fw-black); line-height: 1; color: #2b1d08; }
.fc26-pos { font-size: 8.5px; font-weight: var(--fw-bold); color: #503a12; letter-spacing: .4px; margin-top: 1px; }
.fc26-photo {
  position: absolute; top: 28px; left: 50%; transform: translateX(-50%);
  width: 54px; height: 54px; border-radius: 50%; z-index: 2;
  background: radial-gradient(circle at 35% 28%, #f7e3a6, #d3ab55 68%, #ab8136);
  border: 2px solid rgba(43,29,8,.5);
  box-shadow: inset 0 -7px 10px rgba(0,0,0,.28), 0 2px 6px rgba(0,0,0,.3);
  display: flex; align-items: center; justify-content: center;
}
.fc26-photo span { font-size: 17px; font-weight: var(--fw-black); color: #2b1d08; }
.fc26-info {
  position: absolute; left: 0; right: 0; bottom: 0; top: 52%; z-index: 2;
  padding: 9px 5px 0;
  background: linear-gradient(180deg, rgba(146,105,32,.22), rgba(112,78,20,.5));
  border-top: 1px solid rgba(43,29,8,.22);
  display: flex; flex-direction: column; align-items: center;
}
.fc26-name {
  font-size: 10.5px; font-weight: var(--fw-black); text-transform: uppercase;
  letter-spacing: .2px; color: #241806; line-height: 1.1;
  max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.fc26-stats { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; margin-top: 4px; }
.fc26-stat { display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
.fc26-stat span { font-size: 5.5px; font-weight: var(--fw-bold); letter-spacing: .5px; color: #5c431a; }
.fc26-stat b { font-size: 9.5px; font-weight: var(--fw-black); color: #241806; font-variant-numeric: tabular-nums; }
.fc26-badges { display: flex; align-items: center; gap: 4px; margin-top: auto; margin-bottom: 13px; }
.fc26-flag { font-size: 10px; line-height: 1; }
.fc26-clubbadge {
  min-width: 13px; height: 13px; padding: 0 2px; border-radius: 50%;
  background: #8c1f28; border: 1px solid rgba(0,0,0,.35);
  color: #fff; font-size: 6px; font-weight: var(--fw-black);
  display: flex; align-items: center; justify-content: center;
}
.fc26-clubline { font-size: 8px; font-weight: var(--fw-bold); color: #5c431a; margin-top: 5px; }

/* Свечение редкости (эпик и выше) */
.card-front[data-rarity="epic"]      { filter: drop-shadow(0 0 7px rgba(168,85,247,.8)); }
.card-front[data-rarity="legendary"] { filter: drop-shadow(0 0 9px rgba(245,158,11,.9)); animation: fcLegendaryPulse 2s infinite; }
.card-front[data-rarity="mythic"]    { filter: drop-shadow(0 0 9px rgba(255,110,199,.9)); animation: fcMythicGlow 2.5s infinite; }
@keyframes fcLegendaryPulse { 50% { filter: drop-shadow(0 0 14px rgba(245,158,11,1)); } }
@keyframes fcMythicGlow {
  0%   { filter: drop-shadow(0 0 9px rgba(255,110,199,.9)); }
  33%  { filter: drop-shadow(0 0 12px rgba(230,196,108,.95)); }
  66%  { filter: drop-shadow(0 0 12px rgba(74,144,226,.95)); }
  100% { filter: drop-shadow(0 0 9px rgba(255,110,199,.9)); }
}
.card-slot.epic-plus.flipped .card-front::before,
.card-slot.epic-plus.flipped .card-front::after {
  content: "";
  position: absolute; top: 0; bottom: 0; z-index: 3;
  width: 30px;
  background: linear-gradient(105deg, transparent, rgba(255,255,255,.6), transparent);
  transform: skewX(-20deg);
  animation: cardShine 1.2s ease-out .9s;
  pointer-events: none;
}
@keyframes cardShine { 0% { left: -50px; opacity: 0; } 30% { opacity: 1; } 100% { left: 110%; opacity: 0; } }

.box-footer { width: 100%; text-align: center; }
.box-new-balance { font-size: 12px; color: var(--hint); margin-bottom: 11px; }
.box-collect-btn {
  width: 100%; padding: 15px;
  background: var(--gold-grad); color: var(--on-accent);
  border: none; border-radius: 14px;
  font-size: 15px; font-weight: var(--fw-black);
  cursor: pointer;
  box-shadow: var(--gold-glow);
  text-transform: uppercase; letter-spacing: .8px;
}
.box-collect-btn:active { transform: scale(.97); }

/* Коллекция */
.coll-head { display: flex; align-items: center; gap: 11px; margin-bottom: 15px; }
.coll-back {
  padding: 9px 16px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 22px; color: var(--text);
  font-size: 13px; font-weight: var(--fw-bold);
  cursor: pointer;
}
.coll-title { font-size: 17px; font-weight: var(--fw-bold); font-family: var(--font-display); }
.coll-stats { display: flex; gap: 9px; margin-bottom: 17px; }
.coll-stat { flex: 1; text-align: center; border-radius: var(--r-md); padding: 11px 4px; }
.coll-stat .num {
  font-size: 20px; font-weight: var(--fw-black);
  background: var(--gold-grad);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.coll-stat .lbl { font-size: 10px; color: var(--hint); margin-top: 3px; text-transform: uppercase; letter-spacing: .6px; }

.coll-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
/* Карточки коллекции — как в боксах (FC26) */
.coll-grid-cards { gap: 14px 10px; }
.coll-card-cell {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.coll-card-cell .card-slot {
  width: 100%; max-width: 158px; height: auto;
  aspect-ratio: 108 / 164;
  opacity: 1; transform: none;
}
.coll-card-cell .card-slot .card-flip-inner { transform: rotateY(180deg); }
.coll-card-cell .card-face { border-radius: 10px; }
.coll-card-cell .cm-qty {
  position: static;
  font-size: 10px; font-weight: var(--fw-black); color: var(--accent);
  background: var(--accent2); border: 1px solid rgba(230,196,108,.4);
  border-radius: 10px; padding: 2px 10px;
}
/* Чипы редкости в шапке коллекции */
.rarity-stats { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; }
.rarity-chip {
  display: inline-flex; align-items: center; gap: 5px;
  border: 1px solid; border-radius: 20px; padding: 3px 10px;
  background: rgba(255,255,255,.04); font-size: 10px; font-weight: var(--fw-black);
}
.rarity-chip .rc-dot { width: 7px; height: 7px; border-radius: 50%; }
.rarity-chip .rc-label { letter-spacing: .5px; color: var(--hint); }
.rarity-chip .rc-count { color: #fff; }
.coll-card-cell .coll-sell-btn { width: 100%; max-width: 158px; }
.card-mini {
  border: 2px solid;
  border-radius: 13px; padding: 11px 9px;
  text-align: center; position: relative; overflow: hidden;
}
.cm-ovr { position: absolute; top: 7px; right: 9px; font-size: 14px; font-weight: var(--fw-black); }
.cm-avatar {
  width: 46px; height: 46px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 5px auto 7px; position: relative;
  font-size: 14px; font-weight: var(--fw-black); color: #fff;
}
.cm-flag { position: absolute; bottom: -4px; right: -4px; font-size: 13px; }
.cm-name { font-size: 12px; font-weight: var(--fw-bold); line-height: 1.15; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cm-meta { font-size: 9px; color: var(--hint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cm-qty {
  position: absolute; bottom: 7px; right: 9px;
  background: var(--gold-grad); color: var(--on-accent);
  font-size: 10px; font-weight: var(--fw-black);
  padding: 2px 7px; border-radius: 9px;
  box-shadow: var(--gold-glow);
}

/* GIF Highlights */
.gif-btn {
  margin-top: 9px; width: 100%;
  padding: 10px 13px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-sm); color: var(--text);
  font-size: 13px; font-weight: var(--fw-bold);
  cursor: pointer;
}
.gif-btn:active { transform: scale(.98); border-color: rgba(230,196,108,.5); color: var(--accent); }
.gif-grid { display: grid; grid-template-columns: 1fr; gap: 11px; margin-bottom: 13px; }
.gif-item { width: 100%; max-height: 240px; border-radius: 12px; background: #000; object-fit: cover; display: block; }
.gif-credit { text-align: center; font-size: 10px; color: var(--hint); margin-top: 9px; letter-spacing: .6px; text-transform: uppercase; }

/* Джокер */
.joker-box { border-color: rgba(168,85,247,.6) !important; }
.joker-box .shop-box-emoji { filter: drop-shadow(0 0 12px rgba(168,85,247,.8)); }
.joker-toggle-row { margin-bottom: 9px; }
.joker-toggle-btn {
  width: 100%; padding: 9px;
  background: rgba(0,0,0,.22);
  border: 1px dashed rgba(168,85,247,.6);
  border-radius: 9px; color: #c084fc;
  font-size: 12px; font-weight: var(--fw-bold);
  cursor: pointer; transition: .15s;
}
body.light .joker-toggle-btn { background: rgba(29,26,18,.03); }
.joker-toggle-btn.active {
  background: linear-gradient(135deg, #b96df5, #8b3fd9);
  color: #fff; border-style: solid;
  box-shadow: 0 4px 16px rgba(168,85,247,.45);
}

/* ============================================================================
   TEAM BUILDER
   ============================================================================ */
.team-builder-modal { max-height: 92vh !important; }
.tb-field {
  background:
    radial-gradient(90% 60% at 50% 0%, rgba(230,196,108,.07), transparent 70%),
    linear-gradient(180deg, #14231a 0%, #10131a 100%);
  border-radius: var(--r-lg);
  padding: 18px 9px; margin-bottom: 13px;
}
.tb-row { display: flex; justify-content: center; gap: 7px; margin-bottom: 11px; }
.tb-row:last-child { margin-bottom: 0; }
.tb-slot {
  width: 57px; height: 70px;
  background: rgba(0,0,0,.3);
  border: 2px solid var(--line);
  border-radius: 12px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  cursor: pointer; position: relative;
  transition: .16s;
  backdrop-filter: blur(2px);
}
.tb-slot:active { transform: scale(.93); }
.tb-slot-empty { border-style: dashed; }
.tb-slot-plus { font-size: 23px; color: var(--hint); }
.tb-slot-label {
  font-size: 8px; font-weight: var(--fw-bold); color: var(--hint);
  letter-spacing: .6px; margin-top: 3px;
}
.tb-slot-ovr { font-size: 15px; font-weight: var(--fw-black); line-height: 1; }
.tb-slot-name {
  font-size: 9px; font-weight: var(--fw-bold); color: var(--text);
  margin-top: 2px; max-width: 53px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
.tb-slot-filled {
  border-color: rgba(230,196,108,.55);
  background: rgba(230,196,108,.08);
  box-shadow: 0 0 14px rgba(230,196,108,.18);
}
.tb-slot-filled .tb-slot-label { color: var(--text); opacity: .7; }

.tb-coach-block { margin-bottom: 13px; }
.tb-coach-label {
  font-size: 10px; text-transform: uppercase;
  letter-spacing: 1.2px; color: var(--hint);
  font-weight: var(--fw-bold); margin-bottom: 7px;
}
.tb-coach {
  display: flex; align-items: center; justify-content: center;
  padding: 13px;
  border: 2px solid var(--line);
  border-radius: var(--r-md); cursor: pointer; gap: 13px;
  transition: .16s;
}
.tb-coach:active { transform: scale(.97); }
.tb-coach-empty { border-style: dashed; flex-direction: column; }
.tb-coach-plus { font-size: 27px; color: var(--hint); }
.tb-coach-lbl { font-size: 11px; color: var(--hint); margin-top: 5px; }
.tb-coach-ovr { font-size: 20px; font-weight: var(--fw-black); }
.tb-coach-name { font-size: 14px; font-weight: var(--fw-bold); }
.tb-info { display: flex; gap: 9px; margin-bottom: 13px; }
.tb-info-box { flex: 1; text-align: center; border-radius: var(--r-md); padding: 11px 4px; }
.tb-info-box .num {
  font-size: 18px; font-weight: var(--fw-black);
  background: var(--gold-grad);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.tb-info-box .lbl {
  font-size: 10px; color: var(--hint); margin-top: 3px;
  text-transform: uppercase; letter-spacing: .6px;
}

/* Card Picker */
.cp-list { display: flex; flex-direction: column; gap: 7px; max-height: 50vh; overflow-y: auto; margin-bottom: 13px; }
.cp-item {
  display: flex; align-items: center; gap: 11px;
  padding: 11px 13px;
  border: 2px solid var(--line);
  border-radius: var(--r-md); cursor: pointer;
  transition: .14s;
}
.cp-item:active { transform: scale(.98); border-color: rgba(230,196,108,.55); }
.cp-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: var(--fw-black); color: #fff;
  position: relative; flex-shrink: 0;
}
.cp-flag { position: absolute; bottom: -2px; right: -2px; font-size: 12px; }
.cp-body { flex: 1; min-width: 0; }
.cp-name { font-size: 14px; font-weight: var(--fw-bold); }
.cp-meta { font-size: 11px; color: var(--hint); margin-top: 3px; }
.cp-ovr { font-size: 18px; font-weight: var(--fw-black); flex-shrink: 0; }
.cp-remove-btn {
  width: 100%; padding: 11px;
  background: rgba(229,96,90,.12);
  border: 1px solid rgba(229,96,90,.45);
  color: var(--lose);
  border-radius: var(--r-sm);
  font-size: 13px; font-weight: var(--fw-bold);
  cursor: pointer;
}
.cp-remove-btn:active { transform: scale(.98); }

/* ============================================================================
   BATTLE ARENA
   ============================================================================ */
.battle-arena { padding: 9px 0 5px; }

.battle-result {
  padding: 19px 15px;
  border-radius: var(--r-md);
  text-align: center;
  margin-bottom: 13px;
}
.battle-result.win {
  background: linear-gradient(135deg, rgba(230,196,108,.20), rgba(230,196,108,.05));
  border: 1px solid rgba(230,196,108,.55);
  box-shadow: var(--gold-glow);
}
.battle-result.lose {
  background: linear-gradient(135deg, rgba(229,96,90,.18), rgba(229,96,90,.05));
  border: 1px solid rgba(229,96,90,.5);
}
.battle-result.draw {
  background: linear-gradient(135deg, rgba(217,169,78,.18), rgba(217,169,78,.05));
  border: 1px solid rgba(217,169,78,.5);
}
.battle-outcome { font-size: 20px; font-weight: var(--fw-black); margin-bottom: 15px; font-family: var(--font-display); }
.battle-vs { display: flex; align-items: center; justify-content: space-between; gap: 9px; }
.battle-side { flex: 1; min-width: 0; }
.battle-side-label {
  font-size: 11px; color: var(--hint); text-transform: uppercase;
  letter-spacing: .8px; margin-bottom: 5px;
}
.battle-side-team {
  font-size: 13px; font-weight: var(--fw-bold);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 5px;
}
.battle-side-power { font-size: 22px; font-weight: var(--fw-black); }
.battle-vs-badge { font-size: 14px; font-weight: var(--fw-black); color: var(--hint); flex-shrink: 0; }
.battle-xp { margin-top: 13px; font-size: 18px; font-weight: var(--fw-black); color: var(--accent); }

.battle-scoreboard {
  display: flex; justify-content: center; align-items: center;
  gap: 13px; margin-bottom: 13px;
}
.battle-scoreboard .bs-num {
  font-size: 30px; font-weight: var(--fw-black);
  min-width: 32px; text-align: center;
  transition: transform .3s;
  font-family: var(--font-display);
  background: var(--gold-grad);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.battle-scoreboard .bs-num.pop { transform: scale(1.5); -webkit-text-fill-color: #fff; filter: drop-shadow(0 0 18px var(--accent)); }
.battle-scoreboard .bs-sep { font-size: 22px; color: var(--hint); font-weight: var(--fw-bold); }
.battle-scoreboard .bs-label {
  font-size: 10px; color: var(--hint); text-transform: uppercase;
  letter-spacing: .8px; position: absolute; top: 100%; left: 50%;
  transform: translateX(-50%);
}

.battle-pitch {
  position: relative; width: 100%;
  aspect-ratio: 16 / 10;
  background: linear-gradient(180deg, #173d26 0%, #0e2e1a 50%, #173d26 100%);
  border: 1px solid rgba(230,196,108,.3);
  border-radius: 14px; overflow: hidden;
  margin-bottom: 13px;
  box-shadow: inset 0 0 44px rgba(0,0,0,.55), 0 10px 30px rgba(0,0,0,.35);
}
.battle-pitch::before {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(90deg, transparent 0 10%, rgba(255,255,255,.03) 10% 20%);
  pointer-events: none;
}
.pitch-center-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,.35); transform: translateX(-50%); }
.pitch-center-circle {
  position: absolute; left: 50%; top: 50%; width: 22%; aspect-ratio: 1;
  border: 2px solid rgba(255,255,255,.35); border-radius: 50%;
  transform: translate(-50%, -50%);
}
.pitch-goal {
  position: absolute; top: 50%; width: 8%; height: 30%;
  transform: translateY(-50%);
  border: 2px solid rgba(255,255,255,.55);
  background: rgba(0,0,0,.3);
}
.pitch-goal.left  { left: 0;  border-left: none;  border-radius: 0 5px 5px 0; }
.pitch-goal.right { right: 0; border-right: none; border-radius: 5px 0 0 5px; }
.pitch-box {
  position: absolute; top: 50%; height: 55%; width: 18%;
  transform: translateY(-50%);
  border: 2px solid rgba(255,255,255,.35);
}
.pitch-box.left  { left: 0;  border-left: none; }
.pitch-box.right { right: 0; border-right: none; }
.pitch-ball {
  position: absolute; width: 25px; height: 25px;
  font-size: 23px; line-height: 25px; text-align: center;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  transition: left .4s cubic-bezier(.4,0,.2,1), top .4s cubic-bezier(.4,0,.2,1), transform .4s;
  z-index: 5;
  filter: drop-shadow(0 2px 5px rgba(0,0,0,.6));
}
.pitch-ball.kick { animation: ballSpin .4s linear; }
@keyframes ballSpin { from { transform: translate(-50%,-50%) rotate(0); } to { transform: translate(-50%,-50%) rotate(720deg); } }
.pitch-flash { position: absolute; inset: 0; background: radial-gradient(circle, rgba(230,196,108,.85) 0%, transparent 70%); opacity: 0; pointer-events: none; z-index: 4; }
.pitch-flash.goal { animation: goalFlash .6s; }
@keyframes goalFlash { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
.pitch-flash.miss { background: radial-gradient(circle, rgba(229,96,90,.6) 0%, transparent 70%); animation: goalFlash .4s; }
.pitch-goal-text {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(0);
  font-size: 42px; font-weight: var(--fw-black); color: #fff;
  text-shadow: 0 0 20px var(--accent), 0 0 44px var(--accent), 0 4px 9px rgba(0,0,0,.85);
  z-index: 10; opacity: 0; pointer-events: none;
  letter-spacing: 2px; text-align: center; line-height: 1;
  font-family: var(--font-display);
}
.pitch-goal-text.show { animation: goalTextPop .9s cubic-bezier(.34,1.56,.64,1); }
.pitch-goal-text.miss { color: #f0b429; text-shadow: 0 0 20px #f0b429, 0 4px 9px rgba(0,0,0,.85); font-size: 36px; }
@keyframes goalTextPop {
  0%   { transform: translate(-50%,-50%) scale(0) rotate(-15deg); opacity: 0; }
  40%  { transform: translate(-50%,-50%) scale(1.3) rotate(3deg); opacity: 1; }
  70%  { transform: translate(-50%,-50%) scale(1) rotate(0); opacity: 1; }
  100% { transform: translate(-50%,-80%) scale(.9); opacity: 0; }
}
.battle-teams-row { display: flex; align-items: stretch; gap: 9px; margin-bottom: 13px; }
.bt-team {
  flex: 1;
  border: 2px solid var(--line);
  border-radius: var(--r-md); padding: 11px;
  text-align: center; position: relative; min-width: 0;
}
.bt-team.me  { border-color: rgba(230,196,108,.6); box-shadow: var(--gold-glow); }
.bt-team.opp { border-color: rgba(229,96,90,.55); }
.bt-team-label {
  font-size: 9px; color: var(--hint); text-transform: uppercase;
  letter-spacing: .8px; margin-bottom: 4px;
}
.bt-team-name {
  font-size: 13px; font-weight: var(--fw-bold);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 5px;
}
.bt-team-power { font-size: 18px; font-weight: var(--fw-black); }
.bt-team.opp .bt-team-power {
  background: none;
  -webkit-text-fill-color: var(--lose);
  color: var(--lose);
}
.bt-vs { display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: var(--fw-black); color: var(--hint); flex-shrink: 0; width: 30px; }
.pitch-team-icons { position: absolute; display: flex; gap: 5px; z-index: 3; }
.pitch-team-icons.me  { left: 6%; bottom: 12%; }
.pitch-team-icons.opp { right: 6%; top: 12%; }
.pitch-team-dot {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 8px var(--accent);
}
.pitch-team-dot.opp { background: var(--lose); box-shadow: 0 0 8px var(--lose); }

/* === Битва v2: живые футболисты на поле === */
.bp-player {
  position: absolute; transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center;
  z-index: 3; transition: left .55s ease, top .55s ease;
  pointer-events: none;
}
.bp-player .bpp-ava {
  width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 8.5px; font-weight: var(--fw-black); color: #fff;
  background: linear-gradient(160deg, #2a2f38, #14171d);
  border: 2px solid #888;
  box-shadow: 0 1px 4px rgba(0,0,0,.6);
  transition: box-shadow .25s, transform .25s;
}
.bp-player.opp .bpp-ava { background: linear-gradient(160deg, #3a2426, #1d1214); }
.bp-player .bpp-name {
  font-size: 7.5px; font-weight: var(--fw-bold); color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,.9); margin-top: 1px;
  max-width: 46px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.bp-player.has-ball .bpp-ava {
  transform: scale(1.18);
  box-shadow: 0 0 0 2px #fff, 0 0 12px rgba(255,255,255,.85);
}
.bp-player.shooting .bpp-ava {
  transform: scale(1.22);
  box-shadow: 0 0 0 2px var(--accent), 0 0 14px var(--accent);
}
@media (max-width: 380px) {
  .bp-player .bpp-ava { width: 21px; height: 21px; font-size: 7.5px; }
  .bp-player .bpp-name { font-size: 6.5px; max-width: 38px; }
}
.battle-timeline {
  background: rgba(0,0,0,.22);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 11px 13px; font-size: 12px; color: var(--hint);
  text-align: center; min-height: 38px; transition: .3s;
}
body.light .battle-timeline { background: rgba(29,26,18,.04); }
.battle-timeline .tl-minute { color: var(--accent); font-weight: var(--fw-black); margin-right: 7px; }
.battle-timeline.goal {
  background: var(--accent2); color: var(--win);
  font-weight: var(--fw-bold);
  border-color: rgba(230,196,108,.45);
}
.battle-timeline.miss { background: rgba(240,180,41,.08); color: #f0b429; }
.battle-final { text-align: center; padding: 17px; border-radius: var(--r-md); margin-top: 13px; }
.battle-final.win  { background: var(--accent2); border: 1px solid rgba(230,196,108,.55); box-shadow: var(--gold-glow); }
.battle-final.lose { background: rgba(229,96,90,.10); border: 1px solid rgba(229,96,90,.5); }
.battle-final.draw { background: rgba(217,169,78,.10); border: 1px solid rgba(217,169,78,.5); }
.battle-final-title { font-size: 22px; font-weight: var(--fw-black); margin-bottom: 9px; font-family: var(--font-display); }
.battle-final-xp { font-size: 16px; font-weight: var(--fw-black); color: var(--accent); margin-bottom: 11px; }

.confetti-piece {
  position: fixed; width: 8px; height: 14px; z-index: 999; top: -20px;
  pointer-events: none; border-radius: 2px;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  0%   { transform: translateY(0) rotate(0); opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}
.battle-skip-btn {
  display: block; width: 100%;
  padding: 9px; margin-bottom: 9px;
  background: transparent;
  border: 1px dashed var(--line);
  border-radius: var(--r-sm);
  color: var(--hint); font-size: 12px; font-weight: var(--fw-bold);
  cursor: pointer;
}
.battle-skip-btn:active { transform: scale(.98); color: var(--accent); border-color: rgba(230,196,108,.5); }

/* ============================================================================
   ВКЛАДКИ ЛИГ + ФИЛЬТРЫ МАТЧЕЙ
   ============================================================================ */
.league-tabs, .match-filters {
  display: flex; gap: 7px; overflow-x: auto;
  padding: 10px 14px;
  position: sticky; top: 0;
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  z-index: 9;
  border-bottom: 1px solid var(--line-soft);
  scrollbar-width: none;
}
.league-tabs { top: 71px; }
.league-tabs::-webkit-scrollbar, .match-filters::-webkit-scrollbar { display: none; }
.league-tab, .filter-chip {
  padding: 8px 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 22px;
  white-space: nowrap;
  font-size: 13px; font-weight: var(--fw-med);
  cursor: pointer; color: var(--hint);
  transition: .16s;
  box-shadow: var(--inset-top);
}
.league-tab.active, .filter-chip.active {
  background: var(--gold-grad); color: var(--on-accent);
  border-color: transparent;
  font-weight: var(--fw-black);
  box-shadow: var(--gold-glow);
}
.league-tab:active, .filter-chip:active { transform: scale(.95); }

/* ============================================================================
   МЕЛКИЙ ЭКРАН / ДОСТУПНОСТЬ
   ============================================================================ */

/* ============================================================================
   ОБНОВЛЕНИЕ v2 — подиум, колесо фортуны, компактность, новые фичи
   ============================================================================ */

/* --- Компактный список матчей (адаптив) --- */
.match-side { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.pred-done-mini { width: 30px; height: 30px; font-size: 12px; }

/* --- Телефон: карточка матча в одну строку --- */
@media (max-width: 620px) {
  .match-card { padding: 6px 7px; gap: 5px; min-height: 38px; }
  .match-time {
    min-width: 38px; flex-shrink: 0; text-align: center;
    font-size: 7.5px; padding: 3px 3px; letter-spacing: 0;
  }
  .match-teams-row .match-when { font-size: 8.5px; padding-left: 5px; }
  .match-final { font-size: 11.5px; }
  .match-final small { font-size: 7.5px; }
  .hl-btn { height: 26px; padding: 0 7px; font-size: 10px; }
  .match-head { gap: 6px; }
  .match-teams-row { gap: 4px; font-size: 11.5px; }
  .match-teams-row .team-crest,
  .match-teams-row .team-crest-fallback { width: 15px; height: 15px; }
  .match-side { gap: 4px; }
  .odds-row { gap: 4px; }
  .odds-btn { height: 30px; padding: 0 5px; min-width: 34px; border-radius: 8px; }
  .odds-btn .odds-sub { display: none; }
  .score-inline { gap: 4px; }
  .score-inline input { width: 30px; height: 30px; font-size: 14px; border-radius: 8px; }
  .score-inline .score-colon { font-size: 13px; }
  .score-inline .score-save { width: 34px; height: 30px; margin-left: 2px; border-radius: 8px; font-size: 14px; }
  .joker-toggle { width: 30px; height: 30px; font-size: 14px; border-radius: 8px; }
  .match-locked { font-size: 9px; padding: 4px 7px; }
  .my-pick { padding: 4px 8px; gap: 4px; border-radius: 8px; }
  .my-pick .mp-outcome, .my-pick .mp-score { font-size: 11px; }
  .my-pick .mp-check { width: 16px; height: 16px; font-size: 10px; }
}

/* --- Чип ближайшего матча (таймер) --- */
.next-match-chip {
  display: flex; align-items: center; gap: 8px;
  margin: 0 14px 10px; padding: 8px 13px;
  background: var(--accent2);
  border: 1px solid rgba(230,196,108,.4);
  border-radius: 12px; font-size: 12px; font-weight: var(--fw-med);
}
.next-match-chip .nmc-timer {
  font-family: var(--font-display); font-weight: var(--fw-black);
  font-size: 13px; color: var(--accent); letter-spacing: .5px;
  font-variant-numeric: tabular-nums;
}
.next-match-chip .nmc-lbl { color: var(--hint); font-size: 10px; text-transform: uppercase; letter-spacing: .8px; }

/* --- Подиум топ-3 --- */
.podium { display: flex; align-items: flex-end; gap: 8px; padding: 6px 14px 14px; }
.podium-card { flex: 1; min-width: 0; text-align: center; }
.podium-ava {
  width: 44px; height: 44px; border-radius: 50%;
  margin: 0 auto 6px; display: flex; align-items: center; justify-content: center;
  font-weight: var(--fw-black); font-size: 17px;
  font-family: var(--font-display);
  background: var(--surface); border: 2px solid var(--line); color: var(--text);
  position: relative;
}
.podium-ava .podium-medal { position: absolute; top: -11px; right: -9px; font-size: 16px; }
.podium-item-1 .podium-ava {
  width: 56px; height: 56px; font-size: 22px;
  border-color: rgba(230,196,108,.65); box-shadow: var(--gold-glow);
}
.podium-name {
  font-size: 12px; font-weight: var(--fw-bold);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px;
}
.podium-pts {
  font-size: 13px; font-weight: var(--fw-black);
  background: var(--gold-grad);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.podium-base {
  margin-top: 7px; border-radius: 10px 10px 0 0; padding-top: 7px;
  font-family: var(--font-display); font-weight: var(--fw-black); font-size: 17px;
  display: flex; flex-direction: column; align-items: center; line-height: 1;
}
.podium-base .pb-lbl {
  font-size: 8px; letter-spacing: 1.2px; font-weight: var(--fw-bold);
  opacity: .75; margin-top: 3px; text-transform: uppercase;
}
.podium-item-1 .podium-base {
  height: 72px; color: var(--accent-hi);
  background: linear-gradient(180deg, rgba(230,196,108,.35), rgba(230,196,108,.07));
  border: 1px solid rgba(230,196,108,.55); border-bottom: none;
  box-shadow: var(--gold-glow);
}
.podium-item-2 .podium-base {
  height: 52px; color: #cfd4dd;
  background: linear-gradient(180deg, rgba(200,205,215,.22), rgba(200,205,215,.05));
  border: 1px solid rgba(200,205,215,.35); border-bottom: none;
}
.podium-item-3 .podium-base {
  height: 40px; color: #d9a06a;
  background: linear-gradient(180deg, rgba(205,140,80,.22), rgba(205,140,80,.05));
  border: 1px solid rgba(205,140,80,.38); border-bottom: none;
}

/* --- Поиск и шеринг в рейтинге --- */
.rating-tools { display: flex; gap: 7px; padding: 0 14px 12px; }
.rating-search { position: relative; flex: 1; }
.rating-search::before {
  content: "🔍"; position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%); font-size: 12px; opacity: .7;
}
.rating-search input {
  width: 100%; padding: 9px 12px 9px 33px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; color: var(--text); font-size: 13px;
  font-family: inherit; box-shadow: var(--inset-top);
}
.rating-search input:focus { outline: none; border-color: rgba(230,196,108,.55); }
.rating-share-btn {
  width: 40px; height: 38px; flex-shrink: 0;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; font-size: 16px; cursor: pointer;
  box-shadow: var(--inset-top);
}
.rating-share-btn:active { transform: scale(.93); border-color: rgba(230,196,108,.6); }
.rating-row.hidden-by-search { display: none; }

/* --- Закреплённая лига --- */
.league-card { position: relative; }
.lc-pin {
  position: absolute; top: 6px; right: 8px;
  background: transparent; border: none; font-size: 15px;
  cursor: pointer; opacity: .45; padding: 4px; line-height: 1;
}
.lc-pin.pinned { opacity: 1; filter: drop-shadow(0 0 6px rgba(230,196,108,.8)); }
.league-card.pinned-league { border-color: rgba(230,196,108,.45); }

/* --- Бейдж на вкладке Магазин --- */
.nav-item .nav-badge {
  position: absolute; top: 2px; right: 16%;
  min-width: 16px; height: 16px; padding: 0 4px;
  background: #e5605a; color: #fff;
  border-radius: 9px; font-size: 9px; font-weight: var(--fw-black);
  display: none; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(229,96,90,.6);
}
.nav-item .nav-badge.show { display: flex; }

/* --- Колесо фортуны --- */
.wheel-card {
  background: linear-gradient(160deg, #191922 0%, #101018 100%);
  border: 1px solid rgba(230,196,108,.35);
  border-radius: var(--r-lg); padding: 15px 14px 14px;
  margin-bottom: 15px; position: relative; overflow: hidden;
  box-shadow: var(--shadow-card), var(--inset-top);
}
.wheel-card::before {
  content: ""; position: absolute; top: -40%; left: 50%;
  width: 260px; height: 260px;
  background: radial-gradient(circle, rgba(230,196,108,.14), transparent 68%);
  border-radius: 50%; pointer-events: none;
}
/* Полосы футбольного газона под колесом */
.wheel-card::after {
  content: ""; position: absolute; inset: 0; z-index: 0;
  background: repeating-linear-gradient(90deg,
    rgba(46,125,60,.10) 0 26px,
    rgba(24,60,32,.10) 26px 52px);
  pointer-events: none;
}
.wheel-stage { z-index: 1; }
.wheel-title-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; position: relative; z-index: 1;
}
.wheel-title { font-size: 15px; font-weight: var(--fw-bold); font-family: var(--font-display); }
.wheel-spins-left {
  font-size: 10px; font-weight: var(--fw-bold); color: var(--accent);
  background: var(--accent2); border: 1px solid rgba(230,196,108,.35);
  padding: 4px 10px; border-radius: 12px; text-transform: uppercase; letter-spacing: .5px;
}
.wheel-stage { position: relative; width: 236px; height: 236px; margin: 0 auto 6px; }
.wheel-canvas-wrap {
  position: absolute; inset: 0; border-radius: 50%;
  border: 5px solid rgba(240,240,240,.85);
  box-shadow: 0 10px 34px rgba(0,0,0,.55), 0 0 0 3px rgba(46,125,60,.55), inset 0 0 0 2px rgba(0,0,0,.4);
  transition: transform 4.6s cubic-bezier(.12,.8,.18,1);
  will-change: transform;
}
.wheel-canvas-wrap canvas { display: block; width: 100%; height: 100%; border-radius: 50%; }
.wheel-pointer {
  position: absolute; top: -7px; left: 50%; transform: translateX(-50%);
  width: 0; height: 0; z-index: 3;
  border-left: 11px solid transparent; border-right: 11px solid transparent;
  border-top: 19px solid var(--accent);
  filter: drop-shadow(0 2px 4px rgba(0,0,0,.6));
}
.wheel-hub {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
  width: 58px; height: 58px; border-radius: 50%;
  background: var(--gold-grad); color: var(--on-accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; z-index: 2;
  box-shadow: 0 0 0 4px rgba(13,13,19,.9), var(--gold-glow);
  font-family: var(--font-display);
}
/* Мяч крутится пока крутится колесо */
@keyframes hub-roll {
  from { transform: translate(-50%,-50%) rotate(0deg); }
  to   { transform: translate(-50%,-50%) rotate(2160deg); }
}
.wheel-hub.rolling { animation: hub-roll 4.6s cubic-bezier(.12,.8,.18,1); }
/* Пульс свечения во время вращения */
@keyframes wheel-glow {
  0%, 100% { box-shadow: 0 10px 34px rgba(0,0,0,.55), 0 0 0 3px rgba(46,125,60,.55), inset 0 0 0 2px rgba(0,0,0,.4); }
  50% { box-shadow: 0 10px 40px rgba(0,0,0,.6), 0 0 26px rgba(230,196,108,.55), 0 0 0 3px rgba(230,196,108,.6), inset 0 0 0 2px rgba(0,0,0,.4); }
}
.wheel-canvas-wrap.rolling-glow { animation: wheel-glow 1.15s ease-in-out infinite; }
.wheel-spin-btn {
  width: 100%; padding: 13px;
  background: var(--gold-grad); color: var(--on-accent);
  border: none; border-radius: 13px;
  font-size: 14px; font-weight: var(--fw-black);
  cursor: pointer; text-transform: uppercase; letter-spacing: .7px;
  box-shadow: var(--gold-glow); position: relative; z-index: 1;
}
.wheel-spin-btn:active:not(:disabled) { transform: scale(.97); }
.wheel-spin-btn:disabled { opacity: .55; box-shadow: none; cursor: not-allowed; }
.wheel-note {
  text-align: center; font-size: 10px; color: var(--hint);
  margin: 8px 0 0; position: relative; z-index: 1; letter-spacing: .4px;
}

/* --- Блок рекламы --- */
.ad-slot {
  border: 1.5px dashed rgba(230,196,108,.4);
  border-radius: 12px; padding: 11px 13px;
  display: flex; align-items: center; gap: 10px;
  background: rgba(230,196,108,.04); margin-bottom: 15px;
}
.ad-slot .ad-tag {
  font-size: 8px; font-weight: var(--fw-black); letter-spacing: 1px;

<script>
/* ============================================================
   ХЕЛПЕРЫ ФЛАГОВ
   ============================================================ */
function leagueFlagHtml(league) {
  if (!league) return "";
  if (league.flagClass) {
    return '<span class="flag-icon ' + league.flagClass + '"></span>';
  }
  return league.emoji ? escapeHtml(league.emoji) + ' ' : '';
}

function leagueFlagHtmlSmall(league) {
  if (!league) return "";
  if (league.flagClass) {
    return '<span class="flag-icon ' + league.flagClass + '" style="margin-right:4px"></span>';
  }
  return league.emoji ? escapeHtml(league.emoji) : '';
}

/* ============================================================
   ИКОНКИ КОМАНД (кресты)
   ============================================================ */
function teamCrestHtml(team) {
  if (!team) return "";
  var letter = String(team.shortName || team.name || "?").trim().charAt(0).toUpperCase() || "?";
  // 🔧 FIX: фильтр алфавита — если буква спецсимвол (', ", \, &), заменяем на '?'
  // (иначе ломается JS-строка внутри onerror)
  if (!/[A-ZА-ЯЁ0-9]/i.test(letter)) letter = "?";
  if (team.crestUrl) {
    return '<img class="team-crest" src="' + escapeHtml(team.crestUrl) + '" ' +
           'alt="" loading="lazy" ' +
           'onerror="this.outerHTML=\'<span class=&quot;team-crest-fallback&quot;>' +
           letter + '</span>\'">';
  }
  return '<span class="team-crest-fallback">' + letter + '</span>';
}

function matchTeamsHtml(match, when) {
  if (!match) return "";

  var h = match.homeTeam;
  var a = match.awayTeam;

  if (!h || !a) {
    var parts = String(match.matchName || "").split(/\s+[-–—]\s+/);
    h = { name: (parts[0] || "").trim() };
    a = { name: (parts[1] || "").trim() };
  }

  var hName = h.shortName || h.name || "";
  var aName = a.shortName || a.name || "";

  return '' +
    '<div class="match-teams-row">' +
      '<span class="team team-home"><span class="team-name">' + escapeHtml(hName) + '</span></span>' +
      teamCrestHtml(h) +
      '<span class="vs">—</span>' +
      teamCrestHtml(a) +
      '<span class="team team-away"><span class="team-name">' + escapeHtml(aName) + '</span></span>' +
      (when ? '<span class="match-when">' + escapeHtml(when) + '</span>' : '') +
    '</div>';
}

/* ============================================================
   ТЕМА: dark (по умолчанию) / light
   ============================================================ */
var THEME_KEY = 'app_theme';

function getStoredTheme() {
  try {
    var t = localStorage.getItem(THEME_KEY);
    return (t === 'light') ? 'light' : 'dark';
  } catch (e) { return 'dark'; }
}

function applyTheme(mode) {
  var isLight = (mode === 'light');
  document.body.classList.toggle('light', isLight);

  var tgApp = window.Telegram ? window.Telegram.WebApp : null;
  if (tgApp) {
    try {
      if (tgApp.setHeaderColor)     tgApp.setHeaderColor(isLight ? '#ffffff' : '#0f1115');
      if (tgApp.setBackgroundColor) tgApp.setBackgroundColor(isLight ? '#ffffff' : '#0f1115');
    } catch (e) {}
  }
}

function updateThemeIcon() {
  var el = document.getElementById('themeToggleBtn');
  if (!el) return;
  var isLight = document.body.classList.contains('light');
  el.textContent = isLight ? '☀️' : '🌙';
  el.title = isLight ? 'Светлая тема' : 'Тёмная тема';
}

function toggleTheme() {
  var isLightNow = document.body.classList.contains('light');
  var next = isLightNow ? 'dark' : 'light';
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  applyTheme(next);
  updateThemeIcon();
  if (typeof drawWheel_ === 'function') drawWheel_(); // перекраска колеса под тему
}

applyTheme(getStoredTheme());

function renderShop(app) {
  app.innerHTML =

  Promise.all([
    callServer('miniApp_getShop', CHAT_ID, USER_NAME),
    callServer('miniApp_getJokerStatus', CHAT_ID, USER_NAME)
  ]).then(function (results) {
    var res = results[0];
    var joker = results[1];
    if (!res || !res.ok) {
      document.getElementById('shopContent').innerHTML =
        '<div class="empty">Ошибка: ' + escapeHtml((res && res.error) || '') + '</div>';
      return;

    SHOP_STATE.data = res;

      '<div class="shop-special-icon">🃏</div>' +

/* 📢 Статус рекламы (лимит на день) + показ rewarded-видео AdsGram */
function bindAdWatch_() {
  var adBtn = document.getElementById('adWatchBtn');
  if (!adBtn) return;

  // Статус: сколько просмотров осталось сегодня
  callServer('miniApp_getAdStatus', CHAT_ID, USER_NAME).then(function (st) {
    if (!st || !st.ok) {
      var el0 = document.getElementById('adLeft');
      if (el0) el0.textContent = 'Бонус за просмотр · до ' + 10 + ' раз в день';
      return;
    }
    var el = document.getElementById('adLeft');
    if (el) el.textContent = 'Осталось сегодня: ' + st.remainingToday + ' из ' + st.dailyLimit;
    if (st.remainingToday <= 0) {
      adBtn.disabled = true;
      adBtn.textContent = 'Лимит';
    }
  });

  adBtn.addEventListener('click', function () {
    haptic('light');
    var ctrl = adsgramCtrl_();
    if (!ctrl) {
      showToast('📢 Реклама скоро появится', 'error');
      return;
    }
    adBtn.disabled = true;
    adBtn.textContent = '...';
    var settled = false;
    var finish = function () {
      adBtn.disabled = false;
      adBtn.textContent = 'Смотреть';
    };
    ctrl.show().then(function (res) {
      if (settled) return;
      settled = true;
      if (res && res.done) {
        // Просмотр до конца — награду выдаёт только сервер (анти-чит)
        callServer('miniApp_adReward', CHAT_ID, USER_NAME).then(function (r) {
          finish();
          if (r && r.ok) {
            showToast('✨ +' + r.xp + ' XP за просмотр рекламы!', 'success');
            haptic('medium');
            if (SHOP_STATE.data && SHOP_STATE.data.stats) SHOP_STATE.data.stats.balance = r.newBalance;
            var bal = document.getElementById('shopBalance');
            if (bal && r.newBalance != null) bal.textContent = 'Баланс: ' + r.newBalance.toLocaleString('ru-RU') + ' XP';
            var leftEl = document.getElementById('adLeft');
            if (leftEl) leftEl.textContent = 'Осталось сегодня: ' + r.remainingToday + ' из ' + (r.watchedToday + r.remainingToday);
            if (r.remainingToday <= 0) {
              adBtn.disabled = true;
              adBtn.textContent = 'Лимит';
            }
          } else {
            showToast((r && r.error) || 'Ошибка начисления XP', 'error');
          }
        });
      } else {
        finish();
        showToast('Реклама не досмотрена до конца', 'error');
      }
    }).catch(function () {
      if (settled) return;
      settled = true;
      finish();
      showToast('Реклама недоступна. Попробуйте позже', 'error');
    });
  });
}

    { kind: 'xp', icon: '⭐', label: '750 XP' }
  ],
  rotation: 0,

  status: null

function wheelColors_() {
  // «Газон»: чередование полос футбольного поля
  return document.body.classList.contains('light')
    ? ['#bfe0b8', '#a9d69e', '#bfe0b8', '#a9d69e', '#bfe0b8', '#a9d69e', '#bfe0b8', '#a9d69e', '#bfe0b8']
    : ['#17301e', '#1d3a25', '#17301e', '#1d3a25', '#17301e', '#1d3a25', '#17301e', '#1d3a25', '#17301e'];
}

function drawWheel_() {
  var canvas = document.getElementById('wheelCanvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var prizes = WHEEL.prizes;
  var n = prizes.length;
  var seg = (Math.PI * 2) / n;
  var cx = 240, cy = 240, r = 236;
  var colors = wheelColors_();
  var light = document.body.classList.contains('light');
  ctx.clearRect(0, 0, 480, 480);
  for (var i = 0; i < n; i++) {
    var a0 = i * seg - Math.PI / 2;
    var a1 = a0 + seg;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, a0, a1);
    ctx.closePath();
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();
    ctx.strokeStyle = 'rgba(230,196,108,.45)';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // Разметка поля на внутреннем круге
    if (i === 0) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.42, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,.14)';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();
    }

    // Иконка приза + подпись (радиально)
    var mid = a0 + seg / 2;
    ctx.save();
    ctx.translate(cx + Math.cos(mid) * r * 0.48, cy + Math.sin(mid) * r * 0.48);
    ctx.rotate(mid + Math.PI / 2);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '46px sans-serif';
    ctx.fillText(prizes[i].icon, 0, 0);
    ctx.restore();

    ctx.save();
    ctx.translate(cx + Math.cos(mid) * r * 0.76, cy + Math.sin(mid) * r * 0.76);
    ctx.rotate(mid + Math.PI / 2);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = light ? '#17301e' : '#f7e3a6';
    ctx.font = '800 22px Manrope, sans-serif';
    ctx.fillText(prizes[i].label, 0, 0);
    ctx.restore();
  }
}

function spinWheel_() {
  if (WHEEL.spinning) return;
  var btn = document.getElementById('wheelSpinBtn');
  WHEEL.spinning = true;
  if (btn) { btn.disabled = true; btn.textContent = '🎯 Крутим...'; }
  haptic('medium');

  callServer('miniApp_spinWheel', CHAT_ID, USER_NAME).then(function (res) {
    if (!res || !res.ok) {
      WHEEL.spinning = false;
      showToast((res && res.error) || 'Ошибка', 'error');
      updateWheelStatusUI_();
      return;
    }
    animateWheelTo_(res.prizeIndex, function () {
      WHEEL.spinning = false;
      var prize = res.prize || { kind: 'xp', xp: 0 };
      if (prize.kind === 'box' && prize.cards && prize.cards.length) {
        showToast(prize.icon + ' Выигран «' + (prize.label || 'бокс') + '»!', 'success');
        setTimeout(function () { openPrizeCardsModal_(prize.cards, prize.label); }, 700);
      } else if (prize.kind === 'joker') {
        showToast('🃏 Джокер ×2 у вас! Всего: ' + (prize.jokersCount || 1), 'success');
      } else {
        showXPToast('+' + (prize.xp || 0) + ' XP');
      }
      haptic('heavy');
      if (res.xp && res.xp.leveledUp) {
        setTimeout(function () { showLevelUp(res.xp.level); }, 600);
      }
      if (SHOP_STATE.data && res.newBalance != null) {
        SHOP_STATE.data.stats.balance = res.newBalance;
        var bal = document.getElementById('shopBalance');
        if (bal) bal.textContent = 'Баланс: ' + res.newBalance.toLocaleString('ru-RU') + ' XP';
      }
      // Обновляем статус (бесплатный спин израсходован → дальше платно)
      WHEEL.status = WHEEL.status || {};
      WHEEL.status.freeAvailable = false;
      if (res.newBalance != null) {
        WHEEL.status.canPaid = res.newBalance >= 100;
        WHEEL.status.balance = res.newBalance;
      }
      updateWheelStatusUI_();
      updateShopBadge_(false);
      callServer('miniApp_getWheelStatus', CHAT_ID, USER_NAME).then(function (s) {
        if (s && s.ok) { WHEEL.status = s; updateWheelStatusUI_(); updateShopBadge_(s.freeAvailable); }
      }).catch(function () {});
    });
  }).catch(function (err) {
    WHEEL.spinning = false;
    showToast('Ошибка: ' + (err.message || err), 'error');
    updateWheelStatusUI_();
  });
}

function animateWheelTo_(prizeIndex, done) {
  var wrap = document.getElementById('wheelWrap');
  if (!wrap) { done(); return; }
  var hub = document.querySelector('.wheel-hub');
  if (hub) hub.classList.add('rolling');
  wrap.classList.add('rolling-glow');
  var n = WHEEL.prizes.length;
  var seg = 360 / n;
  // указатель сверху (-90°); сектор i рисуется от i*seg-90 до (i+1)*seg-90
  var targetMod = (360 - (prizeIndex * seg + seg / 2)) % 360;
  var curMod = ((WHEEL.rotation % 360) + 360) % 360;
  var delta = ((targetMod - curMod) + 360) % 360;
  WHEEL.rotation += 5 * 360 + delta;
  wrap.style.transform = 'rotate(' + WHEEL.rotation + 'deg)';
  setTimeout(function () {
    if (hub) hub.classList.remove('rolling');
    wrap.classList.remove('rolling-glow');
    done();
  }, 4750);
}

function playBoxAnimation(cards, newBalance) {
  var sprite = document.getElementById('boxSprite');

  setTimeout(function () {
    if (shine) shine.classList.add('flash');

    setTimeout(function () {
      var cardsBox = document.getElementById('boxCards');

  }, 1200);

// Тир карточки по рейтингу — как в FC26: золото 75+, серебро 65+, бронза ниже
function fcTier_(ovr) {
  var o = Number(ovr) || 0;
  if (o >= 75) return 'gold';
  if (o >= 65) return 'silver';
  return 'bronze';
}

function renderCardHtml(c, idx) {
  var flag = COUNTRY_EMOJI[c.countryCode] || '🌍';
  var initials = (c.name || '?').trim().split(/\s+/).map(function (s) { return s[0]; }).slice(0, 2).join('');
  var isEpicPlus = ['epic','legendary','mythic'].indexOf(c.rarity) !== -1 ? ' epic-plus' : '';
  var lastName = escapeHtml((c.name || '').trim().split(/\s+/).slice(-1)[0] || c.name);
  var tier = fcTier_(c.ovr);

  // Шесть характеристик FC26; у вратарей — DIV/HAN/KIC/REF/SPD/POS
  var statsHtml = '';
  if (c.pac != null) {
    var L = c.isGk ? ['DIV','HAN','KIC','REF','SPD','POS'] : ['PAC','SHO','PAS','DRI','DEF','PHY'];
    var V = [c.pac, c.sho, c.pas, c.dri, c.def, c.phy];
    statsHtml = '<div class="fc26-stats">' + L.map(function (lbl, i) {
      return '<div class="fc26-stat"><span>' + lbl + '</span><b>' + (V[i] != null ? V[i] : '—') + '</b></div>';
    }).join('') + '</div>';
  } else {
    statsHtml = '<div class="fc26-clubline">' + escapeHtml(c.club || '') + '</div>';
  }
  var clubBadge = escapeHtml(((c.club || '?').trim().slice(0, 3) || '?').toUpperCase());

  return '' +
    '<div class="card-slot' + isEpicPlus + '" data-rarity="' + c.rarity + '">' +
      '<div class="card-flip-inner">' +

        // ЗАДНЯЯ (рубашка)
        '<div class="card-face card-back">' +
          '<div class="card-back-pattern">⚽</div>' +
          '<div class="card-back-label">PACK</div>' +
        '</div>' +

function sellPriceLocal_(c) {

  return (Number(c.ovr) || 50) * (mult[c.rarity] || 1) * 3;
}

// Обмен с сервером: fetch к деплою Google Apps Script (вместо google.script.run).
// Идентификация — initData Telegram, сервер проверяет HMAC-подпись.
function callServer(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function(resolve, reject) {
    if (!fn) { reject(new Error('Имя функции не задано')); return; }
    if (!window.API_URL || window.API_URL.indexOf('http') !== 0) {
      reject(new Error('API_URL не настроен в config.js'));
      return;
    }
    fetch(window.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        fn: fn,
        args: args,
        initData: (tg && tg.initData) ? tg.initData : ''
      })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data && data.error === 'auth') {
          reject(new Error(data.message || 'Ошибка авторизации. Переоткройте приложение.'));
          return;
        }
        resolve(data);
      })
      .catch(function (e) { reject(e); });
  });
}

        '<div class="rank">' + medal + '</div>' +

          '</div>' +
          (leaguesLine ? '<div class="leagues">' + leaguesLine + '</div>' : '') +

function shareMyRating_() {
  var rating = (STATE.bootstrap && STATE.bootstrap.rating) || [];
  var me = null, place = 0;
  for (var i = 0; i < rating.length; i++) {
    if (rating[i].name === USER_NAME) { me = rating[i]; place = i + 1; break; }
  }
  var text = me
    ? '⚽ Я на ' + place + ' месте в рейтинге прогнозов с ' + me.points + ' очками! Сможешь лучше? 🏆'
    : '⚽ Соревнуюсь в прогнозах на футбол! Заходи и проверь свою интуицию 🏆';
  try {
    if (tg && tg.openTelegramLink) {
      tg.openTelegramLink('https://t.me/share/url?text=' + encodeURIComponent(text));
      return;
    }
  } catch (e) {}
  try {
    navigator.clipboard.writeText(text);
    showToast('Текст скопирован — отправьте друзьям', 'success');
  } catch (e) {
    showToast(text);
  }
  haptic('light');
}

function renderTourRatingBody(leagues) {
  var codes = Object.keys(leagues);
  if (!codes.length) return '<div class="content"><div class="empty">Нет лиг.</div></div>';

  if (!leagues[STATE.tourLeague]) STATE.tourLeague = codes[0];

  var html = '<div class="tour-selectors">';
  html += '<div class="tour-select-wrap"><select id="tourLeagueSelect">';
  codes.forEach(function (c) {
    var lg = leagues[c];
    html += '<option value="' + c + '"' + (c === STATE.tourLeague ? ' selected' : '') + '>' +
      escapeHtml(lg.name) +
    '</option>';
  });
  html += '</select></div>';

  var tours = STATE.tours[STATE.tourLeague] || [];
  html += '<div class="tour-select-wrap"><select id="tourNumberSelect"' +
    (tours.length === 0 ? ' disabled' : '') + '>';
  if (tours.length === 0) {
    html += '<option>—</option>';
  } else {
    tours.forEach(function (t) {
      var label = t.label;
      if (!t.finished) label += ' (' + t.played + '/' + t.total + ')';
      html += '<option value="' + t.number + '"' +
        (t.number === STATE.tourNumber ? ' selected' : '') + '>' +
        escapeHtml(label) +
      '</option>';
    });
  }
  html += '</select></div></div>';

  html += '<div class="content" id="tourRatingBody">';

  if (tours.length === 0) {
    html += '<div class="tour-empty">Загружаем туры...</div>';
  } else if (!STATE.tourRating) {
    html += '<div class="loader"><div class="spinner"></div></div>';
  }

  html += '</div>';
  return html;
}

function bindTourRating(app) {
  var leagueSel = $('#tourLeagueSelect');
  var tourSel = $('#tourNumberSelect');

  if (leagueSel) {
    leagueSel.addEventListener('change', function () {
      STATE.tourLeague = leagueSel.value;
      STATE.tourNumber = null;
      STATE.tourRating = null;
      loadTours(STATE.tourLeague, true);
    });
  }

  if (tourSel) {
    tourSel.addEventListener('change', function () {
      STATE.tourNumber = parseInt(tourSel.value, 10);
      STATE.tourRating = null;
      loadTourRating(STATE.tourLeague, STATE.tourNumber);
    });
  }

  if (!STATE.tours[STATE.tourLeague]) {
    loadTours(STATE.tourLeague, true);
  } else if (STATE.tourNumber) {
    if (!STATE.tourRating) {
      loadTourRating(STATE.tourLeague, STATE.tourNumber);
    } else {
      renderTourRatingList();
    }
  } else {
    var tours = STATE.tours[STATE.tourLeague];
    if (tours && tours.length) {
      STATE.tourNumber = tours[tours.length - 1].number;
      var ts = $('#tourNumberSelect');
      if (ts) ts.value = String(STATE.tourNumber);
      loadTourRating(STATE.tourLeague, STATE.tourNumber);
    }
  }
}

function loadTours(leagueCode, autoSelectLast) {
  var body = $('#tourRatingBody');
  if (body) body.innerHTML = '<div class="loader"><div class="spinner"></div></div>';

  callServer('miniApp_getAvailableTours', leagueCode)
    .then(function (res) {
      if (!res || !res.ok) {
        if (body) body.innerHTML = '<div class="tour-empty">Ошибка: ' +
          escapeHtml((res && res.error) || 'не удалось загрузить туры') + '</div>';
        return;
      }
      STATE.tours[leagueCode] = res.tours || [];
      updateTourSelect(leagueCode);

      if (autoSelectLast && STATE.tours[leagueCode].length) {
        STATE.tourNumber = STATE.tours[leagueCode][STATE.tours[leagueCode].length - 1].number;
        var ts = $('#tourNumberSelect');
        if (ts) ts.value = String(STATE.tourNumber);
        loadTourRating(leagueCode, STATE.tourNumber);
      } else if (STATE.tours[leagueCode].length === 0) {
        if (body) body.innerHTML = '<div class="tour-empty">В этой лиге пока нет туров</div>';
      }
    })
    .catch(function (err) {
      if (body) body.innerHTML = '<div class="tour-empty">Ошибка: ' +
        escapeHtml(err.message || err) + '</div>';
    });
}

function updateTourSelect(leagueCode) {
  var tourSel = $('#tourNumberSelect');
  if (!tourSel) return;
  var tours = STATE.tours[leagueCode] || [];
  tourSel.innerHTML = '';

  if (!tours.length) {
    tourSel.disabled = true;
    tourSel.innerHTML = '<option>—</option>';
    return;
  }
  tourSel.disabled = false;
  tours.forEach(function (t) {
    var label = t.label;
    if (!t.finished) label += ' (' + t.played + '/' + t.total + ')';
    var opt = document.createElement('option');
    opt.value = String(t.number);
    opt.textContent = label;
    if (t.number === STATE.tourNumber) opt.selected = true;
    tourSel.appendChild(opt);
  });
}

function loadTourRating(leagueCode, tourNumber) {
  var body = $('#tourRatingBody');
  if (body) body.innerHTML = '<div class="loader"><div class="spinner"></div></div>';

  callServer('miniApp_getTourRating', leagueCode, tourNumber)
    .then(function (res) {
      if (!res || !res.ok) {
        if (body) body.innerHTML = '<div class="tour-empty">Ошибка: ' +
          escapeHtml((res && res.error) || 'не удалось загрузить') + '</div>';
        return;
      }
      STATE.tourRating = res;
      renderTourRatingList();
    })
    .catch(function (err) {
      if (body) body.innerHTML = '<div class="tour-empty">Ошибка: ' +
        escapeHtml(err.message || err) + '</div>';
    });
}

function renderTourRatingList() {
  var body = $('#tourRatingBody');
  if (!body) return;
  var data = STATE.tourRating;
  if (!data) return;

  var rating = data.rating || [];

  var html = '';

  html +=
    '<div class="tour-info">' +
      '<div class="tour-info-box"><div class="num">' + data.totalMatches + '</div><div class="lbl">Матчей</div></div>' +
      '<div class="tour-info-box"><div class="num">' + data.playedMatches + '</div><div class="lbl">Сыграно</div></div>' +
      '<div class="tour-info-box"><div class="num">' + rating.length + '</div><div class="lbl">Участников</div></div>' +
    '</div>';

  if (!rating.length) {
    if (data.playedMatches === 0) {
      html += '<div class="tour-empty">Тур ещё не начался.<br>Рейтинг появится после первых матчей.</div>';
    } else {
      html += '<div class="tour-empty">Никто не сделал прогнозы на этот тур</div>';
    }
    body.innerHTML = html;
    return;
  }

  rating.forEach(function (r) {
    var isMe = (r.userName === USER_NAME);
    var cls = '';
    if (isMe) cls += ' me';
    if (r.place === 1) cls += ' top1';
    else if (r.place === 2) cls += ' top2';
    else if (r.place === 3) cls += ' top3';

    var medal = r.place === 1 ? '🥇' : r.place === 2 ? '🥈' : r.place === 3 ? '🥉' : r.place;

    var sub = r.count + ' прогноз.';
    if (r.resolved > 0) {
      sub += ' · ✅ ' + r.exactCount + ' 🎯 ' + r.diffCount + ' ⚖️ ' + r.outcomeCount;
    }

    html +=
      '<div class="tour-rating-row um-user-link' + cls + '" data-user="' + escapeHtml(r.userName) + '">' +
        '<div class="tr-place">' + medal + '</div>' +
        '<div class="tr-body">' +
          '<div class="tr-name">' + escapeHtml(r.userName) +
            (isMe ? ' <span style="font-size:11px;color:var(--accent)">(вы)</span>' : '') +
          '</div>' +
          '<div class="tr-sub">' + escapeHtml(sub) + '</div>' +
        '</div>' +
        '<div class="tr-points">' + r.points + '</div>' +
      '</div>';
  });

  body.innerHTML = html;

  $$('.tour-rating-row.um-user-link', body).forEach(function (el) {
    el.addEventListener('click', function () {
      openUserStatsModal(el.dataset.user);
    });
  });
}

function loadLeagueMatchesList(leagueId) {
  var box = document.getElementById('leagueMatchesList');
  if (!box) return;

  callServer('miniApp_getLeagueMatchesList', leagueId, CHAT_ID, USER_NAME)
    .then(function(res) {
      if (!res || !res.ok || !res.matches.length) {
        box.innerHTML = '<div class="empty" style="padding:10px">Нет добавленных матчей.</div>';
        return;
      }

      var html = '';
      res.matches.forEach(function(m, idx) {
        var isStarted = false;
        if (m.matchDateStr) {
          if (new Date().getTime() >= new Date(m.matchDateStr).getTime()) isStarted = true;
        }

        var scoreStr = m.realScore ? '<b style="color:var(--win)">' + escapeHtml(m.realScore) + '</b>' : '';

        html += '<div class="league-match-item" data-index="' + idx + '">' +
          '<div class="info">' +
            '<div class="name">' + escapeHtml(m.matchName) + '</div>' +
            '<div class="time">' + escapeHtml(m.timeStr) + ' · ' + escapeHtml(m.leagueCode) + '</div>' +
          '</div>';
          
        if (scoreStr) {
          html += '<div style="font-size:16px;margin-left:10px">' + scoreStr + '</div>';
        }
        html += '</div>';

        // Блок прогноза
        if (!m.realScore) {
          html += '<div class="league-match-pred" id="leaguePredBox-' + idx + '">';
          
          if (isStarted) {
            html += '<div style="text-align:center;font-size:12px;color:var(--hint)">⏳ Матч начался, прогнозы закрыты</div>';
          } else if (m.userPrediction) {
            html += '<div class="pred-done" style="padding:6px">' +
              '<div class="pred-done-left">' +
                '<div class="pred-done-label">Ваш прогноз</div>' +
                '<div class="pred-done-value">' + escapeHtml(m.userPrediction.outcome) + ' — ' + escapeHtml(m.userPrediction.score) + '</div>' +
              '</div>' +
              '<div class="pred-done-check">✓</div>' +
            '</div>';
          } else {
            // Рисуем кнопки
            html += '<div class="league-odds-row">' +
              '<div class="league-odds-btn" data-outcome="П1">П1</div>' +
              '<div class="league-odds-btn" data-outcome="Ничья">X</div>' +
              '<div class="league-odds-btn" data-outcome="П2">П2</div>' +
            '</div>' +
            '<div class="league-score-row" id="leagueScoreRow-' + idx + '">' +
              '<input type="tel" inputmode="numeric" maxlength="2" placeholder="0" id="leagueScoreHome-' + idx + '">' +
              '<span>:</span>' +
              '<input type="tel" inputmode="numeric" maxlength="2" placeholder="0" id="leagueScoreAway-' + idx + '">' +
              '<button data-league-save="' + idx + '">ОК</button>' +
            '</div>';
          }
          html += '</div>';
        }
      });
      
      box.innerHTML = html;

      // Обработчики событий
      res.matches.forEach(function(m, idx) {
        var predBox = document.getElementById('leaguePredBox-' + idx);
        if (!predBox || predBox.querySelector('.pred-done') || predBox.querySelector('div[style*="закрыты"]')) return;

        var selectedOutcome = null;
        var btns = predBox.querySelectorAll('.league-odds-btn');
        
        btns.forEach(function(btn) {
          btn.addEventListener('click', function() {
            btns.forEach(function(b) { b.classList.remove('selected'); });
            btn.classList.add('selected');
            selectedOutcome = btn.dataset.outcome;
            
            var scoreRow = document.getElementById('leagueScoreRow-' + idx);
            if (scoreRow) scoreRow.classList.add('visible');
          });
        });

        var saveBtn = predBox.querySelector('[data-league-save]');
        if (saveBtn) {
          saveBtn.addEventListener('click', function() {
            if (!selectedOutcome) { showToast('Выберите исход', 'error'); return; }
            var h = document.getElementById('leagueScoreHome-' + idx).value.trim();
            var a = document.getElementById('leagueScoreAway-' + idx).value.trim();
            if (!/^\d+$/.test(h) || !/^\d+$/.test(a)) { showToast('Введите счет', 'error'); return; }
            
            saveLeaguePrediction(m.matchName, m.leagueCode, selectedOutcome, h + '-' + a, leagueId);
          });
        }
      });
    })
    .catch(function() {
      box.innerHTML = '<div class="empty">Ошибка загрузки матчей</div>';
    });
}

function copyInviteCode() {
  var el = document.getElementById('invCode');
  if (!el) return;
  var code = el.textContent.trim();
  try {
    navigator.clipboard.writeText(code);
    showToast('Код скопирован: ' + code, 'success');
    haptic('light');
  } catch (e) {
    showToast('Не удалось скопировать', 'error');
  }
}

function shareInvite(code, leagueName) {
  // Username бота — из config.js
  var rawBot = window.BOT_USERNAME || '';
  var botUser = String(rawBot || '').replace(/^@/, '').trim();
  if (!botUser || botUser === 'YourBotUsername') botUser = '';

  var deepLink = botUser ? 'https://t.me/' + botUser + '?start=league_' + code : '';
  var shareText = '🏆 Присоединяйся к моей лиге «' + leagueName + '»!\n\nКод: ' + code;
  if (deepLink) shareText += '\n\nИли перейди по ссылке: ' + deepLink;

  var urlParam = deepLink || 'https://t.me/share/url';
  var shareUrl = 'https://t.me/share/url?url=' + encodeURIComponent(urlParam) + '&text=' + encodeURIComponent(shareText);

  try {
    if (tg && typeof tg.openTelegramLink === 'function') {
      tg.openTelegramLink(shareUrl);
      return;
    }
    if (tg && typeof tg.openLink === 'function') {
      tg.openLink(shareUrl);
      return;
    }
  } catch (e) { console.warn(e); }

  copyInviteCode();
  showToast('Ссылка не открылась — код скопирован', 'success');
}

        listBox.innerHTML = '<div class="empty">Нет доступных матчей для добавления.</div>';
        return;
      }

      var html = '';
      res.matches.forEach(function(m) {

            '<div class="name">' + escapeHtml(m.matchName) + '</div>' +

function saveLeaguePrediction(matchName, leagueCode, outcome, score, leagueId) {
  showToast('Сохранение...');
  callServer('miniApp_savePrediction', {
    chatId: CHAT_ID,
    userName: USER_NAME,
    matchName: matchName,
    leagueCode: leagueCode,
    outcome: outcome,
    score: score
  })
  .then(function(res) {
    if (res.ok) {
      showToast('Прогноз сохранен', 'success');
      haptic('light');
      
      if (res.xp) {
        showXPToast('+' + res.xp.xpGained + ' XP');
        if (res.xp.leveledUp) setTimeout(function(){ showLevelUp(res.xp.level); }, 600);
      }
      
      // Перезагружаем список матчей лиги
      loadLeagueMatchesList(leagueId);
      
      // 👇 ВАЖНО: Заново запрашиваем бутстрап, чтобы обновить глобальные очки, не ломая приложение
      callServer('miniApp_getBootstrap', CHAT_ID, USER_NAME).then(function(data) {
        if (data && data.ok) STATE.bootstrap = data;
      });
      
    } else {
      showToast(res.error || 'Ошибка', 'error');
    }
  })
  .catch(function(err) { showToast('Ошибка: ' + (err.message || err), 'error'); });
}

function renderMatches(app) {
  var data = STATE.bootstrap || {};
  var leagues = data.leagues || {};
  var codes = Object.keys(leagues);

  if (!codes.length) {
    app.innerHTML = '<div class="content"><div class="empty">Нет данных о лигах. Обновите страницу.</div></div>';
    return;
  }

  if (!STATE.currentLeague) {
    renderLeaguesList(app, leagues, codes);
  } else {
    renderLeagueMatchesView(app, leagues, STATE.currentLeague);
  }
}

function getPinnedLeague_() {
  try { return localStorage.getItem('pinned_league'); } catch (e) { return null; }
}

function togglePinLeague_(code) {
  var cur = getPinnedLeague_();
  try {
    if (cur === code) localStorage.removeItem('pinned_league');
    else localStorage.setItem('pinned_league', code);
  } catch (e) {}
  showToast(cur === code ? 'Лига откреплена' : '⭐ Лига закреплена наверху', 'success');
  haptic('light');
  render();
}

function renderLeaguesList(app, leagues, codes) {
  var pinned = getPinnedLeague_();
  var sorted = codes.slice().sort(function (a, b) {
    if (a === pinned) return -1;
    if (b === pinned) return 1;
    return 0;
  });

  var html = '<div class="header"><h1>Матчи</h1><div class="sub">Выберите лигу</div></div>';
  html += '<div class="leagues-list">';

  sorted.forEach(function (c) {
    var lg = leagues[c];
    var flagHtml = lg.flagClass
      ? '<span class="flag-icon ' + lg.flagClass + '" style="width:28px;height:20px;border-radius:3px"></span>'
      : '<span style="font-size:28px;line-height:1">' + escapeHtml(lg.emoji || '') + '</span>';
    html +=
      '<div class="league-card' + (c === pinned ? ' pinned-league' : '') + '" data-league="' + c + '">' +
        '<button class="lc-pin' + (c === pinned ? ' pinned' : '') + '" data-pin="' + c + '" title="Закрепить лигу">' +
          (c === pinned ? '⭐' : '☆') +
        '</button>' +
        '<div class="lc-emoji">' + flagHtml + '</div>' +
        '<div class="lc-body">' +
          '<div class="lc-name">' + escapeHtml(lg.name) + '</div>' +
          '<div class="lc-sub">' + (c === pinned ? '⭐ Закреплена' : 'Открыть матчи') + '</div>' +
        '</div>' +
        '<div class="lc-arrow">›</div>' +
      '</div>';
  });

  html += '</div>';
  app.innerHTML = html;

  $$('.lc-pin', app).forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      togglePinLeague_(btn.dataset.pin);
    });
  });

  $$('.league-card', app).forEach(function (el) {
    el.addEventListener('click', function () {
      STATE.currentLeague = el.dataset.league;
      STATE.selectedMatch = null;
      render();
    });
  });
}

  }

  var flagHtml = lg.flagClass

    : '';

    '<div class="matches-back">' +
      '<button class="matches-back-btn" id="backToLeagues">← Назад к лигам</button>' +
    '</div>';

  html +=
    '<div class="next-match-chip" id="nextMatchChip" style="display:none">' +
