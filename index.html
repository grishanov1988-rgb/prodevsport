/* ⏳ Таймер обратного отсчёта до ближайшего матча */
var _nextMatchTimerId = null;
function startNextMatchTimer_(matches) {
  if (_nextMatchTimerId) { clearInterval(_nextMatchTimerId); _nextMatchTimerId = null; }
  var chip = document.getElementById('nextMatchChip');
  if (!chip) return;
  var now = Date.now();
  var upcoming = (matches || [])
    .filter(function (m) {
      return m.matchDateStr && !m.realScore &&
        new Date(m.matchDateStr).getTime() > now;
    })
    .map(function (m) { return new Date(m.matchDateStr).getTime(); })
    .sort(function (a, b) { return a - b; });
  if (!upcoming.length) { chip.style.display = 'none'; return; }
  chip.style.display = 'flex';
  function tick() {
    var t = upcoming[0] - Date.now();
    if (t <= 0) {
      t = 0;
      if (_nextMatchTimerId) { clearInterval(_nextMatchTimerId); _nextMatchTimerId = null; }
    }
    var mm = Math.floor(t / 60000);
    var ss = Math.floor((t % 60000) / 1000);
    var txt = mm >= 60
      ? Math.floor(mm / 60) + ' ч ' + (mm % 60) + ' мин'
      : mm + ' мин ' + (ss < 10 ? '0' : '') + ss + ' с';
    var el = document.getElementById('nmcTimer');
    if (el) el.textContent = txt;
  }
  tick();
  _nextMatchTimerId = setInterval(tick, 1000);
}

function loadMatches(leagueCode) {
  var list = $('#matchList');
  if (!list) return;
  list.innerHTML = skelMatchCards(4);

  Promise.all([
    callServer('miniApp_getLeagueMatches', leagueCode, CHAT_ID, USER_NAME),
    callServer('miniApp_getJokerStatus', CHAT_ID, USER_NAME)
  ])
    .then(function(results) {
      var res = results[0];
      var jk = results[1];
      if (!res || !res.ok) throw new Error((res && res.error) || 'Ошибка');
      STATE.jokerStatus = (jk && jk.ok) ? jk : null;
      if (!STATE.matches) STATE.matches = {};
      STATE.matches[leagueCode] = res.matches || [];
      renderMatchesList(leagueCode);
    })
    .catch(function(err) {
      list.innerHTML = '<div class="empty">Ошибка: ' + escapeHtml(err.message || err) + '</div>';
    });
}

function renderMatchesList(leagueCode) {
  var list = $('#matchList');
  if (!list) return;
  startNextMatchTimer_(STATE.matches[leagueCode] || []);

  // Фильтр «Все / Без прогноза / С прогнозом»
  var filter = STATE.matchFilter || 'all';
  var matches = (STATE.matches[leagueCode] || []).filter(function(m) {
    var has = !!(m.userPrediction && m.userPrediction.outcome);
    if (filter === 'done') return has;
    if (filter === 'todo') return !has;
    return true;
  });

  if (!matches.length) {
    list.innerHTML = '<div class="empty">' +
      (filter === 'all' ? 'Нет доступных матчей' : 'Нет матчей с этим фильтром') +
    '</div>';
    return;
  }

  var html = '';
  matches.forEach(function(m, i) {
    var already = m.userPrediction && m.userPrediction.outcome;
    var sel = (!already && STATE.selectedMatch && STATE.selectedMatch.matchName === m.matchName) ? STATE.selectedMatch : null;

    var isStarted = false;
    if (m.matchDateStr) {
      var matchTs = new Date(m.matchDateStr).getTime();
      if (new Date().getTime() >= matchTs) isStarted = true;
    }

    var parts = String(m.matchName).split(/\s+[-–—]\s+/);
    var team1 = m.homeTeam ? (m.homeTeam.shortName || m.homeTeam.name) : (parts[0] || '');
    var team2 = m.awayTeam ? (m.awayTeam.shortName || m.awayTeam.name) : (parts[1] || '');

    var cardClass = 'match-card';
    if (sel) cardClass += ' expanded';
    if (already) cardClass += ' done';

    var myPickHtml = already
      ? '<div class="my-pick">' +
          '<span class="mp-outcome">' + escapeHtml(m.userPrediction.outcome) + '</span>' +
          '<span class="mp-score">' + escapeHtml(m.userPrediction.score) + '</span>' +
          (m.userPrediction.isJoker ? '<span class="mp-joker" title="Прогноз с джокером">🃏</span>' : '') +
          '<span class="mp-check">✓</span>' +
        '</div>'
      : '';

    html += '<div class="' + cardClass + '" data-match-index="' + i + '">';

    // Левая часть: команды + дата/время в одной строке
    html += '<div class="match-head">';
    html += matchTeamsHtml(m, m.time || '');
    if (m.realScore && already) html += myPickHtml; // мой прогноз — строкой под названием
    html += '</div>';

    // Правая часть
    html += '<div class="match-side">';
    if (m.realScore) {
      // Сыгранный матч: итоговый счёт + кнопка видео голов
      html += '<div class="match-final">' + escapeHtml(String(m.realScore).replace('-', ':')) +
        '<small>финал</small></div>' +
        '<button class="hl-btn" data-hl="' + i + '">▶ Голы</button>';
    } else if (already) {
      html += myPickHtml;
    } else if (isStarted) {
      html += '<div class="match-locked">начался</div>';
    } else {
      html +=
        '<div class="odds-row">' +
          '<div class="odds-btn' + (sel && sel.outcome === 'П1' ? ' selected' : '') + '" data-outcome="П1">' +
            '<span class="odds-label">П1</span>' +
            '<span class="odds-sub">' + escapeHtml(team1) + '</span>' +
          '</div>' +
          '<div class="odds-btn' + (sel && sel.outcome === 'Ничья' ? ' selected' : '') + '" data-outcome="Ничья">' +
            '<span class="odds-label">X</span>' +
            '<span class="odds-sub">ничья</span>' +
          '</div>' +
          '<div class="odds-btn' + (sel && sel.outcome === 'П2' ? ' selected' : '') + '" data-outcome="П2">' +
            '<span class="odds-label">П2</span>' +
            '<span class="odds-sub">' + escapeHtml(team2) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="score-inline" id="scoreRow-' + i + '" style="display:' + (sel ? 'flex' : 'none') + '">' +
          '<input type="tel" inputmode="numeric" maxlength="2" placeholder="0" id="scoreHome-' + i + '">' +
          '<span class="score-colon">:</span>' +
          '<input type="tel" inputmode="numeric" maxlength="2" placeholder="0" id="scoreAway-' + i + '">' +
          '<button class="score-save" data-save="1">✓</button>' +
          (STATE.jokerStatus && STATE.jokerStatus.canUseNow
            ? '<button class="joker-toggle" id="jokerTgl-' + i + '" title="Джокер: удвоит XP за угаданный исход/счёт">🃏</button>'
            : '') +
        '</div>';
    }
    html += '</div>';

    html += '</div>';
  });

  list.innerHTML = html;

  // ▶ Видео голов для сыгранных матчей
  $$('.match-card .hl-btn').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var mm = matches[parseInt(btn.dataset.hl, 10)];
      if (mm) openHighlights(mm.matchName, mm.realScore, mm.leagueCode || leagueCode);
    });
  });

  $$('.match-card').forEach(function(card) {
    var idx = parseInt(card.dataset.matchIndex, 10);
    var m = matches[idx];
    if (m.userPrediction && m.userPrediction.outcome) return;
    var matchStarted = false;
    if (m.matchDateStr) {
      if (new Date().getTime() >= new Date(m.matchDateStr).getTime()) matchStarted = true;
    }
    if (matchStarted) return;

    $$('.odds-btn', card).forEach(function(btn) {
      btn.addEventListener('click', function() {
        $$('.odds-btn', card).forEach(function(b) { b.classList.remove('selected'); });
        btn.classList.add('selected');

        STATE.selectedMatch = {
          matchName: m.matchName,
          leagueCode: leagueCode,
          outcome: btn.dataset.outcome
        };

        var row = document.getElementById('scoreRow-' + idx);
        if (row) {
          row.style.display = 'flex';
          var odds = card.querySelector('.odds-row');
          if (odds) odds.style.display = 'none';
          var h = document.getElementById('scoreHome-' + idx);
          if (h) h.focus();
        }
        card.classList.add('expanded');
      });
    });

    var saveBtn = card.querySelector('[data-save]');
    if (saveBtn) {
      saveBtn.addEventListener('click', function() {
        var s = STATE.selectedMatch;
        if (!s || s.matchName !== m.matchName) {
          showToast('Выберите исход', 'error');
          return;
        }
        var h = document.getElementById('scoreHome-' + idx).value.trim();
        var a = document.getElementById('scoreAway-' + idx).value.trim();
        if (!/^\d+$/.test(h) || !/^\d+$/.test(a)) {
          showToast('Введите счёт', 'error');
          return;
        }
        var jkTgl = document.getElementById('jokerTgl-' + idx);
        var useJoker = !!(jkTgl && jkTgl.classList.contains('active'));
        if (useJoker) {
          if (!confirm('🃏 Использовать Джокер на матч «' + m.matchName + '»?\n\nУгаданный исход/счёт принесёт ВДВОЕ больше XP (рейтинговые очки 5/3/1 не меняются).')) {
            return;
          }
        }
        savePrediction(m.matchName, leagueCode, s.outcome, h + '-' + a, useJoker);
      });
    }

    // 🃏 Переключатель джокера в строке счёта
    var jkBtn = card.querySelector('.joker-toggle');
    if (jkBtn) {
      jkBtn.addEventListener('click', function(ev) {
        ev.stopPropagation();
        jkBtn.classList.toggle('active');
        haptic('medium');
      });
    }
  });
}

function savePrediction(matchName, leagueCode, outcome, score, useJoker) {
  showToast('Сохранение...');
  callServer('miniApp_savePrediction', {
    chatId: CHAT_ID,
    userName: USER_NAME,
    matchName: matchName,
    leagueCode: leagueCode,
    outcome: outcome,
    score: score,
    useJoker: !!useJoker // 🔥
  })
  .then(function(res) {
    if (res.ok) {
      showToast('Прогноз сохранен', 'success');
      haptic('light'); // 🔧 NEW
      STATE.selectedMatch = null;

      if (res.xp) {
        showXPToast('+' + res.xp.xpGained + ' XP');
        if (res.xp.leveledUp) {
          setTimeout(function(){ showLevelUp(res.xp.level); }, 600);
        }
      }

      var arr = STATE.matches[leagueCode] || [];
      for (var i = 0; i < arr.length; i++) {
        if (arr[i].matchName === matchName) {
          arr[i].userPrediction = {
            outcome: outcome,
            score: score.replace(/\s/g, '').replace(/:/g, '-'),
            isJoker: !!useJoker
          };
          break;
        }
      }
      renderMatchesList(leagueCode);
    } else {
      if (res.alreadyExists) {
        showToast(res.error || 'Прогноз уже сделан', 'error');
        STATE.selectedMatch = null;
        loadMatches(leagueCode);
      } else {
        showToast(res.error || 'Ошибка', 'error');
      }
    }
  })
  .catch(function(err) { showToast('Ошибка: ' + (err.message || err), 'error'); });
}

function renderMyPredictions(app) {
  app.innerHTML =
    '<div class="header">' +
      '<h1>Мои прогнозы</h1>' +
      '<div class="sub">Последние 25 матчей</div>' +
    '</div>' +
    '<div class="content" id="predList">' + skelPredRows(5) + '</div>';

  callServer('miniApp_getUserPredictions', CHAT_ID, USER_NAME)
    .then(function(res) {
      var list = $('#predList');
      if (!list) return;

      if (!res || !res.ok) {
        list.innerHTML = '<div class="empty">Ошибка: ' +
          escapeHtml((res && res.error) || 'не удалось загрузить') + '</div>';
        return;
      }

        var preds = (res.predictions || []).filter(function(p) { return p.leagueCode !== 'UNL'; }).slice();
      
      // ✅ СОРТИРУЕМ ПО ID (кто последний сохранился, у того id больше)
      preds.sort(function(a, b) {
        return (Number(b.id) || 0) - (Number(a.id) || 0);
      });

      preds = preds.slice(0, 25);
      if (!preds.length) {
        list.innerHTML = '<div class="empty">Нет прогнозов</div>';
        return;
      }

      var html = '';
      preds.forEach(function(p, idx) {
        var isLatest = idx === 0;

        var isPlayed = p.realScore !== null &&
                       p.realScore !== undefined &&
                       p.realScore !== '';

        var pts = (p.points === null || p.points === undefined) ? 0 : Number(p.points);
        var verdictCls = !isPlayed ? 'pending' : (pts >= 5 ? 'win' : (pts > 0 ? 'mid' : 'lose'));

        var dtParts = String(p.dateStr || '').split(' ');
        var dParts = (dtParts[0] || '').split('.');
        var shortDate = (dParts.length === 3 ? dParts[0] + '.' + dParts[1] : (dtParts[0] || '')) +
          (dtParts[1] ? ' · ' + dtParts[1] : '');

        var flagHtml = p.leagueFlagClass
          ? '<span class="flag-icon ' + escapeHtml(p.leagueFlagClass) + '"></span>'
          : (p.leagueEmoji ? escapeHtml(p.leagueEmoji) + ' ' : '');

        var verdictHtml =
          '<div class="pred-verdict ' + verdictCls + '">' +
            '<span class="pv-label">Мой прогноз</span>' +
            '<span class="pv-pick">' + escapeHtml(p.outcome) + ' · ' + escapeHtml(p.score) + '</span>' +
            (isPlayed
              ? '<span class="pv-real">Счёт ' + escapeHtml(p.realScore) + '</span>' +
                '<span class="pv-pts">+' + pts + '</span>'
              : '<span class="pv-note">ожидает матча</span>') +
          '</div>';

        html += '<div class="pred-card' + (isLatest ? ' pred-card-latest' : '') + '">' +
          (isLatest ? '<div class="pred-latest-badge">Последний прогноз</div>' : '') +
          '<div class="pred-card-top">' +
            '<span class="pred-card-league">' + flagHtml + escapeHtml(p.leagueName) + '</span>' +
            '<span class="pred-card-date">' + escapeHtml(shortDate) + '</span>' +
          '</div>' +
          '<div class="pred-card-body">' +
            '<div class="pred-card-teams">' + matchTeamsHtml(p) + '</div>' +
            verdictHtml +
          '</div>' +
          '<div class="pred-card-actions">' +
            (isPlayed && p.hasVideo
              ? '<button class="pca-btn" ' +
                  'onclick="openHighlights(\'' + escapeHtml(p.matchName).replace(/'/g, "\\'") + '\', \'' +
                  escapeHtml(p.realScore) + '\', \'' + escapeHtml(p.leagueCode || '') + '\')">▶ Видеообзор</button>'
              : '') +
            '<button class="pca-btn primary compare-btn" ' +
              'data-match="' + escapeHtml(p.matchName) + '" ' +
              'data-league="' + escapeHtml(p.leagueCode || '') + '">⇄ Сравнить</button>' +
          '</div>' +
        '</div>';
      });

      list.innerHTML = html;

      $$('.compare-btn', list).forEach(function(btn) {
        btn.addEventListener('click', function() {
          openCompareModal(btn.dataset.match, btn.dataset.league);
        });
      });
    })
    .catch(function(err) {
      var list = $('#predList');
      if (list) {
        list.innerHTML = '<div class="empty">Ошибка: ' +
          escapeHtml(err.message || err) + '</div>';
      }
    });
}

function openCompareModal(matchName, leagueCode) {

    backdrop = document.createElement('div');
    backdrop.id = 'compareModal';
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = '<div class="modal" id="compareModalBody"></div>';
    backdrop.addEventListener('click', function(e) {
      if (e.target === backdrop) closeCompareModal();
    });
    document.body.appendChild(backdrop);
  }

  var body = document.getElementById('compareModalBody');
  body.innerHTML =
    '<div class="modal-head">' +
      '<h3>' + escapeHtml(matchName) + '</h3>' +
      '<button class="modal-close" onclick="closeCompareModal()">×</button>' +
    '</div>' +

    '<div id="compareStats"></div>' +

                '</div>' +
                '<div class="stat-cmp-item it-p2">' +
                  '<div class="stat-cmp-label">П2</div>' +
                  '<div class="stat-cmp-val">' + s.pctP2 + '%</div>' +
                  '<div class="stat-cmp-cnt">' + s.P2 + '</div>' +

                (s.P1 ? '<div class="bar-seg bar-p1" style="width:' + s.pctP1 + '%"></div>' : '') +
                (s.Draw ? '<div class="bar-seg bar-draw" style="width:' + s.pctDraw + '%"></div>' : '') +
                (s.P2 ? '<div class="bar-seg bar-p2" style="width:' + s.pctP2 + '%"></div>' : '') +
              '</div>' +
            '</div>';
        }
      }
      var preds = res.predictions || [];
      if (!preds.length) {
        el.innerHTML = '<div class="cmp-empty">Пока никто не сделал прогноз</div>';
        return;
      }
      var html = '';
      preds.forEach(function(p) {
        var isMe = (p.userName === USER_NAME);
        var chipCls = p.outcome === 'П1' ? 'chip-p1' : (p.outcome === 'П2' ? 'chip-p2' : 'chip-x');
        var initial = escapeHtml(String(p.userName || '?').trim().charAt(0).toUpperCase());
        html += '<div class="cmp-row' + (isMe ? ' me' : '') + '">' +
          '<div class="cmp-avatar">' + initial + '</div>' +
          '<div class="cmp-info">' +
            '<div class="cmp-name">' + escapeHtml(p.userName) +
              (isMe ? ' <span class="cmp-me-tag">вы</span>' : '') +
            '</div>' +
          '</div>' +
          '<span class="cmp-chip ' + chipCls + '">' + escapeHtml(p.outcome) + '</span>' +
          '<div class="cmp-score">' + escapeHtml(p.score) + '</div>' +
        '</div>';
      });
      el.innerHTML = html;
    })
    .catch(function(err) {
      var el = document.getElementById('compareBody');
      if (el) el.innerHTML = '<div class="cmp-empty">Ошибка: ' +
        escapeHtml(err.message || err) + '</div>';
    });
}

            flagHtml +
            '<span class="notify-name">' + escapeHtml(l.name) + '</span>' +
          '</label>';
      }
      html += '</div>';
      html +=
        '<button class="notify-save-btn" onclick="saveNotifyModal()">Сохранить</button>';

      el.innerHTML = html;
    })

function saveNotifyModal() {
  var box = document.getElementById('notifyBody');
  if (!box) return;

  var codes = [];
  $$('.notify-item', box).forEach(function(item) {
    var cb = item.querySelector('input[type="checkbox"]');
    if (cb && cb.checked) codes.push(item.dataset.code);
  });

  var btn = box.querySelector('.notify-save-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Сохранение...'; }

  callServer('miniApp_saveNotifySettings', CHAT_ID, USER_NAME, codes)
    .then(function(res) {
      if (res && res.ok) {
        showToast('Настройки сохранены', 'success');
        closeNotifyModal();
      } else {
        showToast((res && res.error) || 'Ошибка', 'error');
        if (btn) { btn.disabled = false; btn.textContent = 'Сохранить'; }
      }
    })
    .catch(function(err) {
      showToast('Ошибка: ' + (err.message || err), 'error');
      if (btn) { btn.disabled = false; btn.textContent = 'Сохранить'; }
    });
}

function renderXPCard_(xp, compact) {
  if (!xp) return '';

  var streakHtml = '';
  if (xp.streak > 0) {
    streakHtml = '<span class="xp-streak">🔥 ' + xp.streak + ' дн. подряд</span>';
  }

  return '' +
    '<div class="xp-card' + (compact ? ' xp-compact' : '') + '">' +
      '<div class="xp-head">' +
        '<div class="xp-level-badge">' +
          escapeHtml(xp.levelIcon) +
          '<span class="xp-lvl-num">LVL ' + xp.level + '</span>' +
        '</div>' +
        '<div class="xp-info">' +
          '<div class="xp-title">' + escapeHtml(xp.levelTitle) + '</div>' +
          '<div class="xp-sub">' + streakHtml + '</div>' +
        '</div>' +
        '<div class="xp-total">' +
          '<div class="xp-total-num">' + (xp.totalXP || 0).toLocaleString('ru-RU') + '</div>' +
          '<div class="xp-total-lbl">XP всего</div>' +
        '</div>' +
      '</div>' +
      '<div class="xp-bar-track">' +
        '<div class="xp-bar-fill" style="width:' + xp.pct + '%">' +
          '<span class="xp-bar-pct">' + xp.pct + '%</span>' +
        '</div>' +
      '</div>' +
      '<div class="xp-bar-label">' +
        '<span>' + xp.xpInLevel.toLocaleString('ru-RU') +
          ' / ' + xp.xpLevelSpan.toLocaleString('ru-RU') + ' XP</span>' +
        '<span>до LVL ' + (xp.level + 1) + ': ' +
          xp.xpToNext.toLocaleString('ru-RU') + ' XP</span>' +
      '</div>' +
      '<div class="xp-stats">' +
        '<div class="xp-stat-box">' +
          '<div class="num">' + xp.xpToday + '</div>' +
          '<div class="lbl">Сегодня</div>' +
        '</div>' +
        '<div class="xp-stat-box">' +
          '<div class="num">' + xp.xpWeek + '</div>' +
          '<div class="lbl">За неделю</div>' +
        '</div>' +
        '<div class="xp-stat-box">' +
          '<div class="num">' + xp.exactScores + '</div>' +
          '<div class="lbl">Точных</div>' +
        '</div>' +
      '</div>' +
    '</div>';
}

function showXPToast(text) {
  var el = document.getElementById('xpToast');
  if (!el) {

    el.id = 'xpToast';
    el.className = 'xp-toast';

  var backdrop = document.createElement('div');
  backdrop.className = 'levelup-backdrop';

function renderQuestsContent(box, res) {
  var p = res.profile;
  var tasks = res.tasks;

  var html = '';

  html += renderXPCard_(p);

  if (tasks.daily && tasks.daily.length) {
    html += '<div class="tasks-section">' +
      '<div class="tasks-section-title">📅 Ежедневные</div>';
    tasks.daily.forEach(function(t) { html += renderTaskCard(t); });
    html += '</div>';
  }

  if (tasks.weekly && tasks.weekly.length) {
    html += '<div class="tasks-section">' +
      '<div class="tasks-section-title">📆 Еженедельные</div>';
    tasks.weekly.forEach(function(t) { html += renderTaskCard(t); });
    html += '</div>';
  }

  if (tasks.monthly && tasks.monthly.length) {
    html += '<div class="tasks-section">' +
      '<div class="tasks-section-title">🗓 Ежемесячные</div>';
    tasks.monthly.forEach(function(t) { html += renderTaskCard(t); });
    html += '</div>';
  }

  box.innerHTML = html;

  $$('.task-claim-btn', box).forEach(function(btn) {
    btn.addEventListener('click', function() {
      var taskId = btn.dataset.task;
      btn.disabled = true;
      btn.textContent = '...';
      callServer('miniApp_claimTask', CHAT_ID, USER_NAME, taskId)
        .then(function(r) {
          if (r && r.ok) {
            showXPToast('+' + r.xpReward + ' XP');
            if (r.xp && r.xp.leveledUp) {
              setTimeout(function(){ showLevelUp(r.xp.level); }, 600);
            }
            reloadQuestsContent_(box);
          } else {
            showToast((r && r.error) || 'Ошибка', 'error');
            btn.disabled = false;
            btn.textContent = 'Забрать';
          }
        })
        .catch(function(err) {
          showToast('Ошибка: ' + (err.message || err), 'error');
          btn.disabled = false;
          btn.textContent = 'Забрать';
        });
    });
  });
}

function renderTaskCard(t) {
  var cls = '';
  if (t.claimed) cls = ' claimed';
  else if (t.completed) cls = ' done';

  var actionHtml = '';
  if (t.completed && !t.claimed) {
    actionHtml = '<button class="task-claim-btn" data-task="' + t.id + '">Забрать</button>';
  } else if (t.claimed) {
    actionHtml = '<div class="task-claimed-mark">✓ Получено</div>';
  } else {
    actionHtml = '<div class="task-xp">+' + t.xpReward + ' XP</div>';
  }

  return '' +
    '<div class="task-card' + cls + '">' +
      '<div class="task-icon">' + escapeHtml(t.icon) + '</div>' +
      '<div class="task-body">' +
        '<div class="task-title">' + escapeHtml(t.title) + '</div>' +
        '<div class="task-desc">' + escapeHtml(t.description) + '</div>' +
        '<div class="task-progress">' +
          '<div class="task-progress-fill" style="width:' + t.pct + '%"></div>' +
        '</div>' +
        '<div class="task-progress-text">' +
          '<span>' + t.progress + ' / ' + t.target + '</span>' +
          '<span>' + t.pct + '%</span>' +
        '</div>' +
      '</div>' +
      '<div class="task-reward">' + actionHtml + '</div>' +
    '</div>';
}

var XP_REASON_LABELS = {
  prediction: { icon: '🔮', label: 'Прогноз' },
  exactScore: { icon: '🎯', label: 'Точный счёт' },
  taskClaim: { icon: '📋', label: 'Задание' },
  wheelPrize: { icon: '🎡', label: 'Колесо фортуны' },
  sellCard: { icon: '💰', label: 'Продажа карточки' }
};

function loadXPHistory_() {
  var box = document.getElementById('pfXPHistory');
  if (!box) return;
  callServer('miniApp_getXPHistory', CHAT_ID, USER_NAME)
    .then(function (res) {
      if (!box) return;
      if (!res || !res.ok) {
        box.innerHTML = '<div class="pf-empty">Не удалось загрузить</div>';
        return;
      }
      renderXPHistory_(box, res.items || []);
    })
    .catch(function () {
      if (box) box.innerHTML = '<div class="pf-empty">Не удалось загрузить</div>';
    });
}

function renderXPHistory_(box, items) {
  if (!items.length) {
    box.innerHTML = '<div class="pf-empty">Пока нет начислений</div>';
    return;
  }
  var html = '<div class="xh-list">';
  items.slice(0, 12).forEach(function (it) {
    var meta = XP_REASON_LABELS[it.reason] || { icon: '✨', label: it.reason };
    var isSpend = it.xp < 0 || String(it.reason).indexOf('spend') === 0;
    var label = isSpend ? 'Покупка в магазине' : meta.label;
    var icon = isSpend ? '🛒' : meta.icon;
    html +=
      '<div class="xh-item">' +
        '<span class="xh-ico">' + icon + '</span>' +
        '<div class="xh-body">' + escapeHtml(label) +
          (it.matchKey && !isSpend ? '<div class="xh-sub">' + escapeHtml(String(it.matchKey).replace(/^wheel_/, 'Колесо · ')) + '</div>' : '') +
        '</div>' +
        '<span class="xh-xp ' + (it.xp >= 0 ? 'plus' : 'minus') + '">' +
          (it.xp >= 0 ? '+' : '') + it.xp + ' XP' +
        '</span>' +
      '</div>';
  });
  html += '</div>';
  box.innerHTML = html;
}

function lsBar_(label, pct, hit, total, mod) {
  var p = Math.max(0, Math.min(100, Number(pct) || 0));
  return '' +
    '<div class="ls-bar ls-bar-' + mod + '">' +
      '<div class="ls-bar-top">' +
        '<span class="ls-bar-lbl">' + escapeHtml(label) + '</span>' +
        '<span class="ls-bar-val">' + p + '% <span class="ls-bar-cnt">(' + hit + '/' + total + ')</span></span>' +
      '</div>' +
      '<div class="ls-bar-track"><div class="ls-bar-fill" style="width:' + p + '%"></div></div>' +
    '</div>';
}

/* ============================================================
   TEAM BUILDER — конструктор команды
   ============================================================ */
var TEAM_STATE = {
  data: null,          // ответ от miniApp_getTeamBuilder
  tempSlots: {},       // {slotIndex: cardObject}
  tempCoach: null,
  pickingSlot: null,   // индекс слота, для которого выбираем карточку
  pickingCoach: false
};

function openTeamBuilder() {
  var backdrop = document.getElementById('teamBuilderModal');
  if (!backdrop) {
    backdrop = document.createElement('div');
    backdrop.id = 'teamBuilderModal';
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = '<div class="modal team-builder-modal" id="teamBuilderModalBody"></div>';
    document.body.appendChild(backdrop);
  }
  var body = document.getElementById('teamBuilderModalBody');
  body.innerHTML =
    '<div class="modal-head">' +
      '<h3>⚽ Моя команда</h3>' +
      '<button class="modal-close" onclick="closeTeamBuilder()">×</button>' +
    '</div>' +
    '<div id="teamBuilderContent"><div class="loader"><div class="spinner"></div></div></div>';
  backdrop.classList.add('show');

  callServer('miniApp_getTeamBuilder', CHAT_ID, USER_NAME).then(function (res) {
    var content = document.getElementById('teamBuilderContent');
    if (!content) return;
    if (!res || !res.ok) {
      content.innerHTML = '<div class="empty">Ошибка: ' +
        escapeHtml((res && res.error) || '') + '</div>';
      return;
    }
    TEAM_STATE.data = res;
    TEAM_STATE.tempSlots = {};
    TEAM_STATE.tempCoach = res.coachCard;
    res.slots.forEach(function (s) {
      if (s.card) TEAM_STATE.tempSlots[s.index] = s.card;
    });
    renderTeamBuilder();
  });
}

function renderTeamBuilder() {
  var content = document.getElementById('teamBuilderContent');
  if (!content) return;
  var d = TEAM_STATE.data;
  if (!d) return;

  var slots = d.slots.map(function (def) {
    return {
      index: def.index,
      group: def.group,
      label: def.label,
      card: TEAM_STATE.tempSlots[def.index] || null
    };
  });

  var filled = slots.filter(function (s) { return s.card; }).length;
  var coach = TEAM_STATE.tempCoach;
  var isComplete = filled === 11 && !!coach;
  var power = isComplete ? calcTeamPowerLocal_(slots, coach) : null;

  var html = '';

  // Поле
  html += '<div class="tb-field">';
  html += '<div class="tb-row tb-row-fwd">';
  slots.filter(function (s) { return s.group === 'FWD'; }).forEach(function (s) {
    html += renderTeamSlotHtml_(s);
  });
  html += '</div>';
  html += '<div class="tb-row tb-row-mid">';
  slots.filter(function (s) { return s.group === 'MID'; }).forEach(function (s) {
    html += renderTeamSlotHtml_(s);
  });
  html += '</div>';
  html += '<div class="tb-row tb-row-def">';
  slots.filter(function (s) { return s.group === 'DEF'; }).forEach(function (s) {
    html += renderTeamSlotHtml_(s);
  });
  html += '</div>';
  html += '<div class="tb-row tb-row-gk">';
  slots.filter(function (s) { return s.group === 'GK'; }).forEach(function (s) {
    html += renderTeamSlotHtml_(s);
  });
  html += '</div>';
  html += '</div>';

  // Тренер
  html += '<div class="tb-coach-block">';
  html += '<div class="tb-coach-label">Тренер</div>';
  html += renderTeamCoachHtml_(coach);
  html += '</div>';

  // Инфо
  html += '<div class="tb-info">';
  html += '<div class="tb-info-box"><div class="num">' + filled + '/11</div><div class="lbl">Игроков</div></div>';
  html += '<div class="tb-info-box"><div class="num">' + (power || '—') + '</div><div class="lbl">Сила</div></div>';
  html += '<div class="tb-info-box"><div class="num">' + (coach ? '✓' : '—') + '</div><div class="lbl">Тренер</div></div>';
  html += '</div>';

  html += '<input type="text" id="teamNameInput" maxlength="40" ' +
    'placeholder="Название команды" value="' + escapeHtml(d.teamName || 'Моя команда') + '" ' +
    'style="width:100%;padding:12px;background:var(--bg2);border:1px solid var(--line);' +
    'border-radius:10px;color:var(--text);font-size:14px;margin-bottom:12px">';

  html += '<button id="saveTeamBtn" class="notify-save-btn" ' +
    (isComplete ? '' : 'disabled') + '>' +
    (isComplete ? '💾 Сохранить команду' : 'Заполните все позиции') +
    '</button>';

  content.innerHTML = html;

  // Bindings
  content.querySelectorAll('.tb-slot').forEach(function (el) {
    el.addEventListener('click', function () {
      var idx = parseInt(el.dataset.slot, 10);
      openCardPicker(idx);
    });
  });
  var coachEl = content.querySelector('.tb-coach');
  if (coachEl) coachEl.addEventListener('click', openCoachPicker);

  var saveBtn = document.getElementById('saveTeamBtn');
  if (saveBtn && isComplete) {
    saveBtn.addEventListener('click', submitTeam);
  }
}

function calcTeamPowerLocal_(slots, coach) {
  var sum = 0, count = 0;
  slots.forEach(function (s) {
    if (s.card) { sum += Number(s.card.ovr) || 0; count++; }
  });
  if (!count) return 0;
  var avg = sum / count;
  var bonus = coach ? (Number(coach.ovr) || 0) * 0.1 : 0;
  return Math.round((avg + bonus) * 100) / 100;
}

function renderTeamSlotHtml_(slot) {
  var card = slot.card;
  if (!card) {
    return '<div class="tb-slot tb-slot-empty" data-slot="' + slot.index + '">' +
      '<div class="tb-slot-plus">+</div>' +
      '<div class="tb-slot-label">' + escapeHtml(slot.label) + '</div>' +
    '</div>';
  }
  var r = RARITY[card.rarity] || RARITY.common;
  return '<div class="tb-slot tb-slot-filled" data-slot="' + slot.index + '" ' +
    'style="border-color:' + r.color + '">' +
      '<div class="tb-slot-ovr" style="color:' + r.color + '">' + card.ovr + '</div>' +
      '<div class="tb-slot-name">' + escapeHtml((card.name || '').split(' ').slice(-1)[0]) + '</div>' +
      '<div class="tb-slot-label">' + escapeHtml(slot.label) + '</div>' +
    '</div>';
}

function renderTeamCoachHtml_(coach) {
  if (!coach) {
    return '<div class="tb-coach tb-coach-empty">' +
      '<div class="tb-coach-plus">+</div>' +
      '<div class="tb-coach-lbl">Выбрать тренера</div>' +
    '</div>';
  }
  var r = RARITY[coach.rarity] || RARITY.common;
  return '<div class="tb-coach tb-coach-filled" style="border-color:' + r.color + '">' +
    '<div class="tb-coach-ovr" style="color:' + r.color + '">' + coach.ovr + '</div>' +
    '<div class="tb-coach-name">' + escapeHtml(coach.name) + '</div>' +
  '</div>';
}

function openCardPicker(slotIndex) {
  var d = TEAM_STATE.data;
  if (!d) return;
  var slotDef = d.slots.filter(function (s) { return s.index === slotIndex; })[0];
  if (!slotDef) return;

  TEAM_STATE.pickingSlot = slotIndex;
  TEAM_STATE.pickingCoach = false;

  var cards = (d.cardsByGroup[slotDef.group] || []).slice();

  // Убираем карточки, уже поставленные в другие слоты
  var used = {};
  for (var idx in TEAM_STATE.tempSlots) {
    if (parseInt(idx, 10) !== slotIndex) used[TEAM_STATE.tempSlots[idx].cardId] = true;
  }
  cards = cards.filter(function (c) { return !used[c.cardId]; });

  renderCardPicker(cards, slotDef.group, slotDef.label);
}

function openCoachPicker() {
  var d = TEAM_STATE.data;
  if (!d) return;
  TEAM_STATE.pickingSlot = null;
  TEAM_STATE.pickingCoach = true;
  renderCardPicker(d.cardsByGroup['COACH'] || [], 'COACH', 'Тренер');
}

function renderCardPicker(cards, group, label) {
  var backdrop = document.getElementById('cardPickerModal');
  if (!backdrop) {
    backdrop = document.createElement('div');
    backdrop.id = 'cardPickerModal';
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = '<div class="modal" id="cardPickerBody"></div>';
    backdrop.addEventListener('click', function (e) {
      if (e.target === backdrop) closeCardPicker();
    });
    document.body.appendChild(backdrop);
  }
  var body = document.getElementById('cardPickerBody');
  var html =
    '<div class="modal-head">' +
      '<h3>Выбор: ' + escapeHtml(label) + '</h3>' +
      '<button class="modal-close" onclick="closeCardPicker()">×</button>' +
    '</div>' +
    '<div class="modal-sub">Карточки из коллекции</div>';

  if (!cards.length) {
    html += '<div class="cmp-empty">Нет подходящих карточек.<br>' +
      'Откройте бокс в магазине, чтобы получить больше игроков.</div>';
  } else {
    html += '<div class="cp-list">';
    cards.forEach(function (c) {
      var r = RARITY[c.rarity] || RARITY.common;
      var initials = (c.name || '?').split(' ').map(function (x) { return x[0]; }).slice(0, 2).join('');
      var flag = COUNTRY_EMOJI[c.countryCode] || '🌍';
      html += '<div class="cp-item" data-card-id="' + c.cardId + '" ' +
        'style="border-color:' + r.color + '">' +
          '<div class="cp-avatar" style="background:linear-gradient(135deg,' +
            r.color + '44,' + r.color + '22)">' + escapeHtml(initials) +
            '<span class="cp-flag">' + flag + '</span></div>' +
          '<div class="cp-body">' +
            '<div class="cp-name">' + escapeHtml(c.name) + '</div>' +
            '<div class="cp-meta">' + escapeHtml(c.position) + ' · ' +
              escapeHtml(c.club || '') + '</div>' +
          '</div>' +
          '<div class="cp-ovr" style="color:' + r.color + '">' + c.ovr + '</div>' +
        '</div>';
    });
    html += '</div>';

    // Кнопка "убрать"
    if (TEAM_STATE.pickingSlot !== null && TEAM_STATE.tempSlots[TEAM_STATE.pickingSlot]) {
      html += '<button class="cp-remove-btn" onclick="removeSlotCard()">Убрать с позиции</button>';
    }
    if (TEAM_STATE.pickingCoach && TEAM_STATE.tempCoach) {
      html += '<button class="cp-remove-btn" onclick="removeCoach()">Убрать тренера</button>';
    }
  }

  body.innerHTML = html;
  backdrop.classList.add('show');

  body.querySelectorAll('.cp-item').forEach(function (el) {
    el.addEventListener('click', function () {
      var cardId = parseInt(el.dataset.cardId, 10);
      pickCard(cardId);
    });
  });
}

function pickCard(cardId) {
  var d = TEAM_STATE.data;
  if (!d) return;
  var allCards = [];
  for (var g in d.cardsByGroup) {
    allCards = allCards.concat(d.cardsByGroup[g]);
  }
  var card = allCards.filter(function (c) { return c.cardId === cardId; })[0];
  if (!card) return;

  if (TEAM_STATE.pickingCoach) {
    TEAM_STATE.tempCoach = card;
  } else if (TEAM_STATE.pickingSlot !== null) {
    TEAM_STATE.tempSlots[TEAM_STATE.pickingSlot] = card;
  }
  haptic('light');
  closeCardPicker();
  renderTeamBuilder();
}

function removeSlotCard() {
  if (TEAM_STATE.pickingSlot !== null) {
    delete TEAM_STATE.tempSlots[TEAM_STATE.pickingSlot];
  }
  closeCardPicker();
  renderTeamBuilder();
}

function removeCoach() {
  TEAM_STATE.tempCoach = null;
  closeCardPicker();
  renderTeamBuilder();
}

function closeCardPicker() {
  var m = document.getElementById('cardPickerModal');
  if (m) m.classList.remove('show');
}

function closeTeamBuilder() {
  var m = document.getElementById('teamBuilderModal');
  if (m) m.classList.remove('show');
}

function submitTeam() {
  var d = TEAM_STATE.data;
  if (!d) return;
  var teamName = (document.getElementById('teamNameInput').value || 'Моя команда').trim();
  var slots = [];
  for (var i = 0; i < 11; i++) {
    var c = TEAM_STATE.tempSlots[i];
    if (!c) { showToast('Заполните все позиции', 'error'); return; }
    slots.push({ index: i, cardId: c.cardId });
  }
  if (!TEAM_STATE.tempCoach) { showToast('Выберите тренера', 'error'); return; }

  var btn = document.getElementById('saveTeamBtn');
  btn.disabled = true; btn.textContent = 'Сохранение...';

  callServer('miniApp_saveTeam', CHAT_ID, USER_NAME, slots,
    TEAM_STATE.tempCoach.cardId, teamName)
    .then(function (res) {
      if (res && res.ok) {
        showToast('Команда сохранена!', 'success');
        haptic('medium');
        closeTeamBuilder();
      } else {
        showToast((res && res.error) || 'Ошибка', 'error');
        btn.disabled = false; btn.textContent = '💾 Сохранить команду';
      }
    });
}

/* Координаты базовых позиций 4-3-3 (left, top в %), моя команда — влево→атака вправо */
var BATTLE_POS = [[8,50],[22,14],[19,36],[19,64],[22,86],[40,26],[44,50],[40,74],[62,16],[70,50],[62,84]];

function bpPlayerToken_(slot, side, idx) {
  var pos = BATTLE_POS[idx] || [50, 50];
  var l = side === 'me' ? pos[0] : 100 - pos[0];
  var t = pos[1];
  var card = slot && slot.card;
  var initials = '?', name = (slot && slot.label) || '', ring = '#8a8f98';
  if (card) {
    initials = (card.name || '?').trim().split(/\s+/).map(function (s) { return s[0]; }).slice(0, 2).join('');
    name = (card.name || '').trim().split(/\s+/).slice(-1)[0] || card.name;
    if (RARITY[card.rarity]) ring = RARITY[card.rarity].color;
  }
  return '<div class="bp-player ' + side + '" data-side="' + side + '" data-idx="' + idx + '" style="left:' + l + '%;top:' + t + '%">' +
    '<span class="bpp-ava" style="border-color:' + ring + '">' + escapeHtml(initials) + '</span>' +
    '<span class="bpp-name">' + escapeHtml(name) + '</span>' +
  '</div>';
}

function renderBattleResult(result, xp) {
  var content = document.getElementById('battleContent');
  if (!content) return;

  var me = result.me;
  var opp = result.opponent;
  var score = result.score || { me: 0, opp: 0 };

  // === HTML поля ===
  var html = '';
  html += '<div class="battle-arena">';

  // Табло
  html += '<div class="battle-scoreboard">';
  html += '<div class="bs-num" id="bsMe">0</div>';
  html += '<div class="bs-sep">:</div>';
  html += '<div class="bs-num" id="bsOpp">0</div>';
  html += '</div>';

  // Поле
  html += '<div class="battle-pitch" id="battlePitch">';
  html += '<div class="pitch-center-line"></div>';
  html += '<div class="pitch-center-circle"></div>';
  html += '<div class="pitch-goal left"></div>';
  html += '<div class="pitch-goal right"></div>';
  html += '<div class="pitch-box left"></div>';
  html += '<div class="pitch-box right"></div>';

  // ⚽ Живые футболисты 11v11 (схема 4-3-3, твоя команда атакует вправо)
  // В 3D-режиме DOM-фишки не нужны — сразу WebGL-сцена
  var use3d = (function () {
    if (!window.THREE) return false;
    try { var c = document.createElement('canvas');
      return !!(c.getContext('webgl2') || c.getContext('webgl')); } catch (e) { return false; }
  })();
  if (!use3d) {
    var meSlots = (me.team && me.team.slots) || [];
    var oppSlots = (opp.team && opp.team.slots) || [];
    for (var pi = 0; pi < 11; pi++) {
      html += bpPlayerToken_(meSlots[pi], 'me', pi);
      html += bpPlayerToken_(oppSlots[pi], 'opp', pi);
    }
  }

  // Мяч
  html += '<div class="pitch-ball" id="pitchBall">⚽</div>';

  // Вспышка и текст
  html += '<div class="pitch-flash" id="pitchFlash"></div>';
  html += '<div class="pitch-goal-text" id="pitchGoalText"></div>';
  html += '</div>';

  // Команды
  html += '<div class="battle-teams-row">';
  html += '<div class="bt-team me">' +
    '<div class="bt-team-label">Ты</div>' +
    '<div class="bt-team-name">' + escapeHtml(me.team.teamName || 'Моя команда') + '</div>' +
    '<div class="bt-team-power">' + me.power.toFixed(1) + '</div>' +
  '</div>';
  html += '<div class="bt-vs">VS</div>';
  html += '<div class="bt-team opp">' +
    '<div class="bt-team-label">' +
      (opp.isBot ? '🤖 Бот' : 'Соперник') +
    '</div>' +
    '<div class="bt-team-name">' + escapeHtml(opp.team.teamName || opp.user) + '</div>' +
    '<div class="bt-team-power">' + opp.power.toFixed(1) + '</div>' +
  '</div>';
  html += '</div>';

  // Ход матча
  html += '<div class="battle-timeline" id="battleTimeline">' +
    'Матч начинается...' +
  '</div>';

  // Кнопка пропуска
  html += '<button class="battle-skip-btn" id="battleSkipBtn" onclick="skipBattleAnimation()">' +
    '⏩ Пропустить анимацию' +
  '</button>';

  html += '</div>'; // /.battle-arena

  content.innerHTML = html;

  // === Запуск анимации: 3D-хайлайты или 2D-фолбэк ===
  if (use3d) playBattle3D_(result, xp);
  else playBattleAnimation_(result, xp);
}

/* Флаг для пропуска */
var BATTLE_SKIP = false;

function skipBattleAnimation() {
  BATTLE_SKIP = true;
}

function playBattleAnimation_(result, xp) {
  var events = result.events || [];
  var meScore = 0, oppScore = 0;
  var bsMe = document.getElementById('bsMe');
  var bsOpp = document.getElementById('bsOpp');
  var ball = document.getElementById('pitchBall');
  var flash = document.getElementById('pitchFlash');
  var goalText = document.getElementById('pitchGoalText');
  var timeline = document.getElementById('battleTimeline');

  BATTLE_SKIP = false;

  var pitch = document.getElementById('battlePitch');
  var players = { me: [], opp: [] };
  if (pitch) {
    $$('.bp-player', pitch).forEach(function (el) {
      players[el.dataset.side].push(el);
    });
  }

  function delay(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  function basePos(side, idx) {
    var p = BATTLE_POS[idx] || [50, 50];
    return side === 'me' ? { l: p[0], t: p[1] } : { l: 100 - p[0], t: p[1] };
  }
  function setPos(el, l, t) {
    el.style.left = l + '%';
    el.style.top = t + '%';
  }

  // === Жизнь поля: футболисты постоянно перемещаются вокруг своих позиций ===
  var jogTimer = setInterval(function () {
    if (BATTLE_SKIP) return;
    ['me', 'opp'].forEach(function (side) {
      players[side].forEach(function (el, idx) {
        if (el.dataset.lock === '1') return;
        var b = basePos(side, idx);
        setPos(el,
          Math.min(95, Math.max(4, b.l + (Math.random() - 0.5) * 5)),
          Math.min(92, Math.max(7, b.t + (Math.random() - 0.5) * 8)));
      });
    });
  }, 1000);

  function updateScore(side) {
    if (side === 'me') {
      meScore++;
      if (bsMe) {
        bsMe.textContent = meScore;
        bsMe.classList.add('pop');
        setTimeout(function () { bsMe.classList.remove('pop'); }, 400);
      }
    } else {
      oppScore++;
      if (bsOpp) {
        bsOpp.textContent = oppScore;
        bsOpp.classList.add('pop');
        setTimeout(function () { bsOpp.classList.remove('pop'); }, 400);
      }
    }
  }

  function moveBallToEl(el) {
    if (!ball || !el) return;
    ball.style.left = el.style.left;
    ball.style.top = el.style.top;
  }
  function moveBallTo(l, t) {
    if (!ball) return;
    ball.style.left = l + '%';
    ball.style.top = t + '%';
  }
  function resetBall() {
    if (!ball) return;
    ball.style.opacity = '1';
    ball.style.left = '50%';
    ball.style.top = '50%';
  }
  function resetPlayers() {
    ['me', 'opp'].forEach(function (side) {
      players[side].forEach(function (el, idx) {
        el.dataset.lock = '';
        el.classList.remove('has-ball', 'shooting');
        var b = basePos(side, idx);
        setPos(el, b.l, b.t);
      });
    });
  }

  function showGoalText(text, isGoal) {
    if (!goalText) return;
    goalText.textContent = text;
    goalText.className = 'pitch-goal-text' + (isGoal ? '' : ' miss');
    void goalText.offsetWidth; // reflow
    goalText.classList.add('show');
    setTimeout(function () { goalText.classList.remove('show'); }, 950);
  }

  function flashScreen(isGoal) {
    if (!flash) return;
    flash.className = 'pitch-flash' + (isGoal ? ' goal' : ' miss');
    setTimeout(function () { flash.className = 'pitch-flash'; }, 650);
  }

  function updateTimeline(text, isGoal) {
    if (!timeline) return;
    timeline.className = 'battle-timeline' +
      (isGoal === true ? ' goal' : (isGoal === false ? ' miss' : ''));
    timeline.innerHTML = text;
  }

  /* Одна атака: пасовая цепочка MID → вингер → нападающий → удар */
  async function playAttack_(ev) {
    var isMine = ev.attacker === 'me';
    var attSide = isMine ? 'me' : 'opp';
    var defSide = isMine ? 'opp' : 'me';
    var dir = isMine ? 1 : -1; // направление продвижения к чужим воротам

    // Цепочка: трое самых дальних от своих ворот атакующих, идём от середины
    var chain = players[attSide].map(function (el, idx) {
      return { el: el, idx: idx, l: basePos(attSide, idx).l, t: basePos(attSide, idx).t };
    }).sort(function (a, b) { return dir > 0 ? a.l - b.l : b.l - a.l; })
      .slice(0, 3);

    // Защитники, которые встречают атаку
    var defs = players[defSide].map(function (el, idx) {
      return { el: el, idx: idx, t: basePos(defSide, idx).t };
    }).sort(function (a, b) {
      return Math.abs(a.t - 50) - Math.abs(b.t - 50);
    }).slice(0, 3);

    // 1. Розыгрыш: пасовая цепочка
    for (var c = 0; c < chain.length; c++) {
      var carrier = chain[c];
      carrier.el.dataset.lock = '1';
      carrier.el.classList.add('has-ball');
      if (c === chain.length - 1) carrier.el.classList.add('shooting');
      // игрок с мячом продвигается вперёд
      var adv = 3 + Math.random() * 4;
      setPos(carrier.el,
        Math.min(95, Math.max(4, carrier.l + dir * adv)),
        Math.min(90, Math.max(8, carrier.t + (Math.random() - 0.5) * 8)));
      await delay(120);
      moveBallToEl(carrier.el);

      // защитники сдвигаются к мячу
      defs.forEach(function (d, di) {
        d.el.dataset.lock = '1';
        setPos(d.el,
          Math.min(95, Math.max(4, carrier.l + dir * (2 + di))),
          Math.min(90, Math.max(8, carrier.t - 8 + di * 8)));
      });

      await delay(c === chain.length - 1 ? 620 : 520);
      carrier.el.classList.remove('has-ball');
      if (BATTLE_SKIP) break;
    }

    // 2. Удар: мяч летит в створ / мимо / в штангу
    var shooter = chain[chain.length - 1];
    var goalL = isMine ? 96.5 : 3.5;
    var shotT = 50 + (Math.random() - 0.5) * 14;
    moveBallTo(goalL, shotT);
    await delay(480);

    if (ev.isGoal) {
      flashScreen(true);
      showGoalText('ГОЛ!', true);
      updateScore(ev.attacker);
      updateTimeline(
        '<span class="tl-minute">' + ev.minute + '\'</span> ⚽ ГОЛ! Забивает ' +
        (isMine ? 'твоя команда' : 'соперник'), true);
      haptic('medium');
      // Мяч в сетке
      moveBallTo(isMine ? 99 : 1, 50);
      if (ball) ball.style.opacity = '0.35';
      await delay(950);
    } else {
      flashScreen(false);
      showGoalText(ev.hitPost ? 'ШТАНГА!' : 'МИМО!', false);
      updateTimeline(
        '<span class="tl-minute">' + ev.minute + '\'</span> ' +
        (ev.hitPost ? '🔩 Штанга! Не повезло' : '💨 Мимо ворот'), false);
      haptic('light');
      if (!ev.hitPost) moveBallTo(isMine ? 99 : 1, shotT > 50 ? 12 : 88);
      await delay(850);
    }
  }

  // === Основной цикл анимации ===
  (async function () {
    updateTimeline('<span class="tl-minute">0\'</span> Матч начался!');
    haptic('light');
    await delay(800);

    for (var i = 0; i < events.length; i++) {
      if (BATTLE_SKIP) break;

      var ev = events[i];
      var isMine = ev.attacker === 'me';
      updateTimeline(
        '<span class="tl-minute">' + ev.minute + '\'</span> Атака ' +
        (isMine ? 'твоей команды' : 'соперника') + '...');
      haptic('light');

      await playAttack_(ev);
      if (BATTLE_SKIP) break;

      // Возврат мяча в центр, игроки — на позиции
      resetBall();
      resetPlayers();
      await delay(550);
    }

    clearInterval(jogTimer);

    // === Пропуск или завершение ===
    if (BATTLE_SKIP) {
      resetPlayers();
      meScore = result.score ? result.score.me : 0;
      oppScore = result.score ? result.score.opp : 0;
      if (bsMe) bsMe.textContent = meScore;
      if (bsOpp) bsOpp.textContent = oppScore;
      updateTimeline('<span class="tl-minute">90\'</span> Матч завершён!');
    } else {
      updateTimeline('<span class="tl-minute">90\'</span> Финальный свисток!');
      await delay(600);
    }

    // === Показываем итог ===
    showBattleFinal_(result, xp);

    // Конфетти при победе
    if (result.outcome === 'win') {
      setTimeout(function () { showConfetti_(); }, 200);
    }

    if (xp && xp.leveledUp) {
      setTimeout(function () { showLevelUp(xp.level); }, 900);
    }
  })();
}

/* ============================================================
   ⚔️ БИТВА 3D — хайлайты опасных моментов (Three.js)
   Ночной стадион, человечки-футболисты с бегом и пасами,
   камера следит за мячом. Фолбэк — 2D-анимация.
   ============================================================ */
var B3D = null;

function battle3dDispose_() {
  if (!B3D) return;
  cancelAnimationFrame(B3D.raf);
  B3D.tweens.forEach(function (tw) { tw.res(); });
  B3D.tweens.length = 0;
  try { B3D.renderer.dispose(); } catch (e) {}
  if (B3D.mount && B3D.mount.parentNode) B3D.mount.parentNode.removeChild(B3D.mount);
  B3D = null;
}

/* Газон с разметкой — текстура из canvas */
function battle3dPitchTexture_() {
  var cv = document.createElement('canvas');
  cv.width = 1050; cv.height = 680;
  var g = cv.getContext('2d');
  var i;
  for (i = 0; i < 14; i++) {
    g.fillStyle = (i % 2) ? '#2f8c42' : '#277a38';
    g.fillRect(Math.floor(i * cv.width / 14), 0, Math.ceil(cv.width / 14) + 1, cv.height);
  }
  var sx = cv.width / 105, sy = cv.height / 68;
  g.strokeStyle = 'rgba(255,255,255,.9)';
  g.fillStyle = 'rgba(255,255,255,.9)';
  g.lineWidth = 3;
  g.strokeRect(4, 4, cv.width - 8, cv.height - 8);
  g.beginPath(); g.moveTo(cv.width / 2, 4); g.lineTo(cv.width / 2, cv.height - 4); g.stroke();
  g.beginPath(); g.arc(cv.width / 2, cv.height / 2, 9.15 * sy, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.arc(cv.width / 2, cv.height / 2, 5, 0, Math.PI * 2); g.fill();
  // штрафные и вратарские площадки
  [4, cv.width - 4 - 16.5 * sx].forEach(function (x0) {
    g.strokeRect(x0, (68 - 40.32) / 2 * sy, 16.5 * sx, 40.32 * sy);
  });
  [4, cv.width - 4 - 5.5 * sx].forEach(function (x0) {
    g.strokeRect(x0, (68 - 18.32) / 2 * sy, 5.5 * sx, 18.32 * sy);
  });
  return new THREE.CanvasTexture(cv);
}

/* Имя над игроком — спрайт из canvas */
function battle3dNameSprite_(text) {
  var cv = document.createElement('canvas');
  cv.width = 256; cv.height = 64;
  var g = cv.getContext('2d');
  g.font = 'bold 30px Arial, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  var w = Math.min(246, g.measureText(text).width + 28);
  g.fillStyle = 'rgba(0,0,0,.5)';
  g.beginPath();
  g.roundRect ? g.roundRect(128 - w / 2, 10, w, 44, 12) : g.rect(128 - w / 2, 10, w, 44);
  g.fill();
  g.fillStyle = '#ffffff';
  g.fillText(text, 128, 33);
  var sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(cv), transparent: true, depthTest: false
  }));
  sp.scale.set(4.4, 1.1, 1);
  return sp;
}

/* Футболист-человечек: ноги/руки с суставами, бег цикличный */
function battle3dPlayer_(kit, skinColor, hairColor, name) {
  function mat(c) { return new THREE.MeshLambertMaterial({ color: c }); }
  var shirt = mat(kit.shirt), shorts = mat(kit.shorts), skinM = mat(skinColor), hairM = mat(hairColor);
  var g = new THREE.Group();

  var torso = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.62, 0.3), shirt);
  torso.position.y = 1.12; g.add(torso);
  var pel = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.26, 0.28), shorts);
  pel.position.y = 0.72; g.add(pel);

  function leg(x) {
    var p = new THREE.Group(); p.position.set(x, 0.6, 0);
    var m = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.58, 0.17), skinM); m.position.y = -0.29; p.add(m);
    var sock = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.22, 0.18), shirt); sock.position.y = -0.47; p.add(sock);
    var boot = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.08, 0.28), mat(0x1c1c1c)); boot.position.set(0, -0.56, 0.04); p.add(boot);
    g.add(p); return p;
  }
  var legL = leg(-0.13), legR = leg(0.13);

  function arm(x) {
    var p = new THREE.Group(); p.position.set(x, 1.4, 0);
    var m = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.5, 0.14), shirt); m.position.y = -0.23; p.add(m);
    var hand = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.12, 0.13), skinM); hand.position.y = -0.49; p.add(hand);
    g.add(p); return p;
  }
  var armL = arm(-0.34), armR = arm(0.34);

  var head = new THREE.Mesh(new THREE.SphereGeometry(0.17, 12, 10), skinM);
  head.position.y = 1.66; g.add(head);
  var hair = new THREE.Mesh(new THREE.SphereGeometry(0.176, 12, 10, 0, Math.PI * 2, 0, Math.PI * 0.55), hairM);
  hair.position.y = 1.68; g.add(hair);

  // мягкая тень-пятно (контакт с газоном)
  var sh = new THREE.Mesh(
    new THREE.CircleGeometry(0.44, 16),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3, depthWrite: false })
  );
  sh.rotation.x = -Math.PI / 2; sh.position.y = 0.02; g.add(sh);

  if (name) { var sp = battle3dNameSprite_(name); sp.position.y = 2.25; g.add(sp); }

  g.userData = { legL: legL, legR: legR, armL: armL, armR: armR, phase: 0, sprint: 0, lock: 0, holdT: 0 };
  return g;
}

function playBattle3D_(result, xp) {
  if (!window.THREE) { playBattleAnimation_(result, xp); return; }
  var pitchEl = document.getElementById('battlePitch');
  if (!pitchEl) { playBattleAnimation_(result, xp); return; }
  battle3dDispose_();

  var events = result.events || [];
  var meScore = 0, oppScore = 0;
  var bsMe = document.getElementById('bsMe');
  var bsOpp = document.getElementById('bsOpp');
  var flash = document.getElementById('pitchFlash');
  var goalText = document.getElementById('pitchGoalText');
  var timeline = document.getElementById('battleTimeline');
  BATTLE_SKIP = false;

  var ball2d = document.getElementById('pitchBall');
  if (ball2d) ball2d.style.display = 'none';

  var mount = document.createElement('div');
  mount.id = 'battle3dMount';
  mount.style.cssText = 'position:absolute;inset:0;z-index:1;overflow:hidden;';
  pitchEl.insertBefore(mount, pitchEl.firstChild);

  var W = pitchEl.clientWidth || 320, H = pitchEl.clientHeight || 200;

  var renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
  catch (e) { mount.remove(); playBattleAnimation_(result, xp); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(W, H);
  mount.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0f1a);
  scene.fog = new THREE.Fog(0x0a0f1a, 110, 260);

  var camera = new THREE.PerspectiveCamera(40, W / H, 0.5, 600);
  camera.position.set(-16, 21, 30);

  // свет: ночной матч под прожекторами
  scene.add(new THREE.HemisphereLight(0xa8bedd, 0x24382a, 1.15));
  var fillLight = new THREE.DirectionalLight(0x88aaff, 0.35);
  fillLight.position.set(40, 50, -30);
  scene.add(fillLight);
  var keyLight = new THREE.DirectionalLight(0xfff0d0, 1.6);
  keyLight.position.set(-35, 70, 25);
  scene.add(keyLight);

  // газон
  var pitchMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(105, 68),
    new THREE.MeshLambertMaterial({ map: battle3dPitchTexture_() })
  );
  pitchMesh.rotation.x = -Math.PI / 2;
  scene.add(pitchMesh);

  // окружение: земля, трибуны, толпа (сеяный PRNG — стабильный вид)
  var rnd = (function (s) { return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; })(777);
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshLambertMaterial({ color: 0x0a0d12 }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.06; scene.add(ground);
  var standMat = new THREE.MeshLambertMaterial({ color: 0x151a24 });
  [[0, -56, 170, 13], [0, 56, 170, 13], [-74, 0, 13, 115], [74, 0, 13, 115]].forEach(function (s) {
    var b = new THREE.Mesh(new THREE.BoxGeometry(s[2], 11, s[3]), standMat);
    b.position.set(s[0], 5.5, s[1]); scene.add(b);
  });
  (function () {
    var N = 1800, pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
    var palette = [[0.9,0.85,0.7],[0.7,0.75,0.85],[0.85,0.5,0.45],[0.5,0.6,0.9],[0.95,0.95,0.95],[0.55,0.5,0.55]];
    for (var i = 0; i < N; i++) {
      var side = i % 4, x, z;
      if (side === 0) { x = rnd() * 160 - 80; z = -56 + rnd() * 6 - 3; }
      else if (side === 1) { x = rnd() * 160 - 80; z = 56 + rnd() * 6 - 3; }
      else if (side === 2) { x = -74 + rnd() * 6 - 3; z = rnd() * 105 - 52; }
      else { x = 74 + rnd() * 6 - 3; z = rnd() * 105 - 52; }
      pos[i * 3] = x; pos[i * 3 + 1] = 11.4 + rnd() * 1.8; pos[i * 3 + 2] = z;
      var c = palette[(rnd() * palette.length) | 0];
      col[i * 3] = c[0]; col[i * 3 + 1] = c[1]; col[i * 3 + 2] = c[2];
    }
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.55, vertexColors: true })));
  })();

  // ворота
  function makeGoal_(sign) {
    var grp = new THREE.Group();
    var postMat = new THREE.MeshLambertMaterial({ color: 0xf2f2f2 });
    [-3.66, 3.66].forEach(function (z) {
      var p = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 2.44, 8), postMat);
      p.position.set(0, 1.22, z); grp.add(p);
    });
    var bar = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 7.5, 8), postMat);
    bar.rotation.x = Math.PI / 2; bar.position.set(0, 2.44, 0); grp.add(bar);
    var net = new THREE.Mesh(new THREE.BoxGeometry(1.7, 2.3, 7.3),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.1, side: THREE.DoubleSide, depthWrite: false }));
    net.position.set(-sign * 0.85, 1.1, 0); grp.add(net);
    grp.position.set(sign * 52.5, 0, 0);
    return grp;
  }
  scene.add(makeGoal_(1)); scene.add(makeGoal_(-1));

  // === Команды ===
  var FORM = [[3,0],[14,-24],[12,-8],[12,8],[14,24],[32,-12],[36,0],[32,12],[52,-20],[58,0],[52,20]];
  var SKINS = [0xf2c89b, 0xe0ac7e, 0xc98d5f, 0x9c6b43, 0x6b4226];
  var HAIRS = [0x2b2b2b, 0x4a3120, 0x7a4a20, 0x141414, 0x666666];
  var KITS = { me: { shirt: 0xf4f4f4, shorts: 0xf4f4f4 }, opp: { shirt: 0x9c1c28, shorts: 0x232323 } };

  var squads = { me: [], opp: [] };
  ['me', 'opp'].forEach(function (side) {
    var team = side === 'me' ? result.me.team : result.opponent.team;
    var slots = (team && team.slots) || [];
    for (var i = 0; i < 11; i++) {
      var card = slots[i] && slots[i].card;
      var nm = card ? ((card.name || '').trim().split(/\s+/).slice(-1)[0] || card.name) : ('Игрок ' + (i + 1));
      var p = battle3dPlayer_(KITS[side], SKINS[(i * 3 + (side === 'opp' ? 2 : 0)) % SKINS.length], HAIRS[(i * 2 + 1) % HAIRS.length], nm);
      var bx = side === 'me' ? FORM[i][0] : 105 - FORM[i][0];
      var bz = FORM[i][1];
      p.position.set(bx, 0, bz);
      p.rotation.y = side === 'me' ? Math.PI / 2 : -Math.PI / 2;
      p.userData.base = { x: bx, z: bz };
      p.userData.driftX = bx; p.userData.driftZ = bz;
      p.userData.holdT = 0.3 + (i % 5) * 0.2;
      p.userData.side = side; p.userData.idx = i;
      p.userData.phase = (i * 1.618 + (side === 'opp' ? 0.7 : 0)) * 2;
      scene.add(p);
      squads[side].push(p);
    }
  });

  // мяч
  var ball3d = new THREE.Mesh(new THREE.SphereGeometry(0.34, 14, 12), new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0x2a2a2a }));
  ball3d.position.set(0, 0.34, 0);
  scene.add(ball3d);

  // === Твины и главный цикл ===
  var TWEENS = [];
  function tween(dur, fn) {
    return new Promise(function (res) { TWEENS.push({ t: 0, dur: dur, fn: fn, res: res }); });
  }
  function delay_(ms) { return tween(ms, function () {}); }
  function smooth(k) { return k * k * (3 - 2 * k); }

  function movePlayer(p, x, z, dur) {
    var sx = p.position.x, sz = p.position.z;
    p.userData.sprint = 1;
    p.rotation.y = Math.atan2(x - sx, z - sz);
    return tween(dur, function (k) {
      p.position.x = sx + (x - sx) * k;
      p.position.z = sz + (z - sz) * k;
    }).then(function () { p.userData.sprint = 0; });
  }
  function moveBallTo(x, z, dur, arc) {
    var sx = ball3d.position.x, sz = ball3d.position.z;
    return tween(dur, function (k) {
      ball3d.position.x = sx + (x - sx) * k;
      ball3d.position.z = sz + (z - sz) * k;
      ball3d.position.y = 0.34 + (arc ? Math.sin(k * Math.PI) * arc : 0);
    });
  }
  function setBallOpacity(o) {
    ball3d.material.transparent = true;
    ball3d.material.opacity = o;
  }

  var camFocus = null;
  var last = performance.now();
  function loop(now) {
    if (!B3D) return;
    if (!mount.isConnected) { battle3dDispose_(); return; }
    B3D.raf = requestAnimationFrame(loop);
    var dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;

    for (var i = TWEENS.length - 1; i >= 0; i--) {
      var tw = TWEENS[i];
      tw.t += dt * 1000;
      var k = Math.min(1, tw.t / tw.dur);
      tw.fn(BATTLE_SKIP ? 1 : smooth(k));
      if (k >= 1 || BATTLE_SKIP) { TWEENS.splice(i, 1); tw.res(); }
    }

    var all = squads.me.concat(squads.opp);
    for (var j = 0; j < all.length; j++) {
      var p = all[j], ud = p.userData;
      var speed = ud.sprint ? 11.5 : 6;
      ud.phase += dt * speed;
      var amp = ud.sprint ? 0.78 : 0.42;
      var s = Math.sin(ud.phase) * amp;
      ud.legL.rotation.x = s;
      ud.legR.rotation.x = -s;
      ud.armL.rotation.x = -s * 0.75;
      ud.armR.rotation.x = s * 0.75;
      p.position.y = Math.abs(Math.cos(ud.phase)) * (ud.sprint ? 0.09 : 0.045);
      // свободные игроки живут: слегка перемещаются вокруг позиции
      if (!ud.sprint && !ud.lock) {
        ud.holdT -= dt;
        if (ud.holdT <= 0) {
          ud.holdT = 1.1 + ((ud.idx * 37 + (ud.side === 'opp' ? 11 : 0)) % 10) / 8;
          var r1 = Math.abs(Math.sin(ud.phase * 0.7 + ud.idx * 12.9898));
          var r2 = Math.abs(Math.sin(ud.phase * 0.9 + ud.idx * 78.233));
          ud.driftX = ud.base.x + (r1 - 0.5) * 6;
          ud.driftZ = ud.base.z + (r2 - 0.5) * 8;
        }
        p.position.x += (ud.driftX - p.position.x) * Math.min(1, dt * 2.2);
        p.position.z += (ud.driftZ - p.position.z) * Math.min(1, dt * 2.2);
      }
    }

    ball3d.rotation.z -= dt * (ball3d.position.x !== 0 ? 7 : 2);

    // камера ТВ: сверху-сбоку, плавно за мячом
    var focusX = camFocus ? camFocus.x : ball3d.position.x;
    var focusZ = camFocus ? camFocus.z : ball3d.position.z;
    var desX = focusX - 13, desY = 21, desZ = 30;
    camera.position.x += (desX - camera.position.x) * Math.min(1, dt * 3.2);
    camera.position.y += (desY - camera.position.y) * Math.min(1, dt * 3.2);
    camera.position.z += (desZ - camera.position.z) * Math.min(1, dt * 3.2);
    camera.lookAt(focusX + 4, 0.8, focusZ * 0.5);

    renderer.render(scene, camera);
  }

  B3D = { raf: requestAnimationFrame(loop), renderer: renderer, mount: mount, tweens: TWEENS, scene: scene, camera: camera, squads: squads, ball: ball3d };

  // === DOM-хелперы (табло/таймлайн общие с 2D) ===
  function updateScore(side) {
    if (side === 'me') {
      meScore++;
      if (bsMe) { bsMe.textContent = meScore; bsMe.classList.add('pop'); setTimeout(function () { bsMe.classList.remove('pop'); }, 400); }
    } else {
      oppScore++;
      if (bsOpp) { bsOpp.textContent = oppScore; bsOpp.classList.add('pop'); setTimeout(function () { bsOpp.classList.remove('pop'); }, 400); }
    }
  }
  function showGoalText(text, isGoal) {
    if (!goalText) return;
    goalText.textContent = text;
    goalText.className = 'pitch-goal-text' + (isGoal ? '' : ' miss');
    void goalText.offsetWidth;
    goalText.classList.add('show');
    setTimeout(function () { goalText.classList.remove('show'); }, 950);
  }
  function flashScreen(isGoal) {
    if (!flash) return;
    flash.className = 'pitch-flash' + (isGoal ? ' goal' : ' miss');
    setTimeout(function () { flash.className = 'pitch-flash'; }, 650);
  }
  function updateTimeline(text, isGoal) {
    if (!timeline) return;
    timeline.className = 'battle-timeline' + (isGoal === true ? ' goal' : (isGoal === false ? ' miss' : ''));
    timeline.innerHTML = text;
  }

  /* Атака-хайлайт: пасовая комбинация и удар */
  async function playAttack3d_(ev) {
    var attSide = ev.attacker === 'me' ? 'me' : 'opp';
    var defSide = attSide === 'me' ? 'opp' : 'me';
    var dir = attSide === 'me' ? 1 : -1;

    var chain = squads[attSide].slice().sort(function (a, b) {
      return dir > 0 ? b.userData.base.x - a.userData.base.x : a.userData.base.x - b.userData.base.x;
    }).slice(0, 3);
    var defs = squads[defSide].slice().sort(function (a, b) {
      return Math.abs(a.userData.base.z) - Math.abs(b.userData.base.z);
    }).slice(0, 3);
    chain.forEach(function (p) { p.userData.lock = 1; });
    defs.forEach(function (p) { p.userData.lock = 1; });

    // пасовая цепочка: от глубины к воротам
    for (var c = 0; c < chain.length; c++) {
      var carrier = chain[c];
      var tx = Math.min(99, Math.max(5, carrier.userData.base.x + dir * (4 + c * 2)));
      var tz = Math.max(-30, Math.min(30, carrier.userData.base.z + (c - 1) * 5));
      var runP = movePlayer(carrier, tx, tz, 0.72);
      await delay_(140);
      var passP = moveBallTo(tx, tz, 0.58, 1.3);
      defs.forEach(function (d, di) {
        movePlayer(d,
          Math.min(100, Math.max(4, tx - dir * (2 + di * 1.5))),
          Math.max(-30, Math.min(30, tz - 7 + di * 7)), 0.95);
      });
      await runP; await passP;
      if (BATTLE_SKIP) break;
    }

    // удар
    var shooter = chain[chain.length - 1];
    shooter.userData.sprint = 1;
    var goalX = dir > 0 ? 103.6 : 1.4;
    var shotZ = ((ev.minute * 13) % 7) - 3; // -3..3 — в створ
    if (!ev.isGoal && !ev.hitPost) shotZ = ((ev.minute % 2) ? 15 : -15); // мимо — по флангу
    await delay_(160);
    var shotP = moveBallTo(goalX, shotZ, 0.55, 2.1);
    await delay_(240);

    if (ev.isGoal) {
      flashScreen(true);
      showGoalText('ГОЛ!', true);
      updateScore(ev.attacker);
      updateTimeline('<span class="tl-minute">' + ev.minute + '\'</span> ⚽ ГОЛ! Забивает ' + (attSide === 'me' ? 'твоя команда' : 'соперник'), true);
      camFocus = { x: dir > 0 ? 95 : 10, z: 0 };
      haptic('medium');
      await shotP;
      setBallOpacity(0.35);
      await delay_(900);
      camFocus = null;
    } else {
      await shotP;
      flashScreen(false);
      showGoalText(ev.hitPost ? 'ШТАНГА!' : 'МИМО!', false);
      updateTimeline('<span class="tl-minute">' + ev.minute + '\'</span> ' + (ev.hitPost ? '🔩 Штанга! Не повезло' : '💨 Мимо ворот'), false);
      haptic('light');
      await delay_(800);
    }
    setBallOpacity(1);

    // все возвращаются на позиции
    chain.concat(defs).forEach(function (p) { p.userData.lock = 0; p.userData.sprint = 0; });
    var back = [];
    squads.me.concat(squads.opp).forEach(function (p) {
      back.push(movePlayer(p, p.userData.base.x, p.userData.base.z, 0.85));
    });
    back.push(moveBallTo(0, 0, 0.85, 0));
    await Promise.all(back);
  }

  // === Прогон хайлайтов ===
  (async function () {
    updateTimeline('<span class="tl-minute">0\'</span> Матч начался!');
    haptic('light');
    await delay_(900);

    for (var i = 0; i < events.length; i++) {
      if (BATTLE_SKIP || !B3D) break;
      var ev = events[i];
      updateTimeline('<span class="tl-minute">' + ev.minute + '\'</span> Атака ' + (ev.attacker === 'me' ? 'твоей команды' : 'соперника') + '...');
      haptic('light');
      await playAttack3d_(ev);
      if (BATTLE_SKIP || !B3D) break;
      await delay_(500);
    }

    if (!B3D) return; // модалку закрыли — выходим

    if (BATTLE_SKIP) {
      meScore = result.score ? result.score.me : 0;
      oppScore = result.score ? result.score.opp : 0;
      if (bsMe) bsMe.textContent = meScore;
      if (bsOpp) bsOpp.textContent = oppScore;
      updateTimeline('<span class="tl-minute">90\'</span> Матч завершён!');
    } else {
      updateTimeline('<span class="tl-minute">90\'</span> Финальный свисток!');
      await delay_(700);
    }

    battle3dDispose_();
    showBattleFinal_(result, xp);
    if (result.outcome === 'win') setTimeout(function () { showConfetti_(); }, 200);
    if (xp && xp.leveledUp) setTimeout(function () { showLevelUp(xp.level); }, 900);
  })();
}

/* Показать финальный блок с результатом */
function showBattleFinal_(result, xp) {
  var content = document.getElementById('battleContent');
  if (!content) return;

  var outcomeLabel = {
    win: '🏆 ПОБЕДА!',
    lose: '😔 Поражение',
    draw: '🤝 Ничья'
  };
  var finalScore = result.score
    ? (result.score.me + ' : ' + result.score.opp)
    : '';

  var html = '';
  html += '<div class="battle-final ' + result.outcome + '">';
  html += '<div class="battle-final-title">' + outcomeLabel[result.outcome] + '</div>';
  html += '<div style="font-size:32px;font-weight:900;color:var(--accent);margin-bottom:6px">' +
    finalScore + '</div>';
  if (result.xpReward > 0) {
    html += '<div class="battle-final-xp">+' + result.xpReward + ' XP</div>';
  }
  html += '</div>';

  html += '<button class="notify-save-btn" style="margin-top:12px" onclick="startBattle()">' +
    '⚔️ Ещё битва' +
  '</button>';
  html += '<button class="cp-remove-btn" onclick="closeBattleModal()" ' +
    'style="margin-top:8px;background:var(--bg2);color:var(--text);border-color:var(--line)">' +
    'Закрыть' +
  '</button>';

  // Заменяем таймлайн на кнопки
  var timeline = document.getElementById('battleTimeline');
  var skipBtn = document.getElementById('battleSkipBtn');
  if (timeline) timeline.remove();
  if (skipBtn) skipBtn.remove();

  var arena = document.querySelector('.battle-arena');
  if (arena) {
    arena.insertAdjacentHTML('beforeend', html);
  }
}

/* Конфетти */
function showConfetti_() {
  var colors = ['#e6c46c', '#f7e3a6', '#c69a34', '#fff6dd', '#d9a94e', '#ffffff'];
  for (var i = 0; i < 40; i++) {
    (function (idx) {
      setTimeout(function () {
        var c = document.createElement('div');
        c.className = 'confetti-piece';
        c.style.left = (Math.random() * 100) + 'vw';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.animationDuration = (2 + Math.random() * 2) + 's';
        c.style.animationDelay = (Math.random() * 0.5) + 's';
        document.body.appendChild(c);
        setTimeout(function () { c.remove(); }, 5000);
      }, idx * 30);
    })(i);
  }
}

function closeBattleModal() {
  var m = document.getElementById('battleModal');
  if (m) m.classList.remove('show');
}

bootstrap();
</script>
