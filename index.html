<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Прогнозы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<script src="config.js"></script>
<style>
/* ============================================================================
   PREMIUM DESIGN SYSTEM — «BLACK & CHAMPAGNE»
   Telegram Mini App · тёмная тема по умолчанию + светлая «warm ivory»
   ============================================================================ */

:root {
  /* Палитра · тёмная */
  --bg:        #0b0b10;
  --bg2:       #15151d;
  --bg3:       #1d1d28;
  --text:      #f3f0e8;
  --hint:      #97917f;
  --accent:    #e6c46c;                      /* шампань-золото */
  --accent-hi: #f7e3a6;                      /* светлое золото */
  --accent-lo: #c69a34;                      /* глубокое золото */
  --accent2:   rgba(230,196,108,.12);
  --accent3:   rgba(230,196,108,.22);
  --on-accent: #1a1405;                      /* текст на золотом */
  --line:      rgba(255,255,255,.08);
  --line-soft: rgba(255,255,255,.05);
  --win:       #e6c46c;
  --lose:      #e5605a;
  --draw:      #d9a94e;

  /* Золотой градиент и свечение */
  --gold-grad: linear-gradient(135deg, #f7e3a6 0%, #e6c46c 42%, #c69a34 100%);
  --gold-glow: 0 6px 22px rgba(230,196,108,.28);
  --gold-line: linear-gradient(90deg, transparent, rgba(230,196,108,.55), transparent);

  /* Поверхности */
  --surface:        linear-gradient(180deg, #191922 0%, #13131a 100%);
  --surface-raised: linear-gradient(180deg, #20202b 0%, #181822 100%);
  --shadow-card:    0 10px 28px rgba(0,0,0,.38);
  --shadow-pop:     0 18px 48px rgba(0,0,0,.55);
  --inset-top:      inset 0 1px 0 rgba(255,255,255,.06);

  /* Типографика */
  --font-display: "Unbounded", "Manrope", -apple-system, sans-serif;
  --font-body: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

  --fs-h1: 21px;
  --fs-h2: 18px;
  --fs-h3: 15px;
  --fs-label: 13px;
  --fs-num: 22px;
  --fs-num-sm: 17px;
  --fs-meta: 11px;

  --fw-reg: 500;
  --fw-med: 600;
  --fw-bold: 700;
  --fw-black: 800;

  --lh-tight: 1.2;
  --lh-base: 1.45;
  --ls-meta: .6px;
  --ls-tight: -.2px;

  --r-lg: 18px;
  --r-md: 14px;
  --r-sm: 10px;
}

/* Светлая тема · warm ivory */
body.light {
  --bg:        #f5f2ea;
  --bg2:       #fffdf8;
  --bg3:       #ffffff;
  --text:      #1d1a12;
  --hint:      #8b8574;
  --accent:    #a8842c;
  --accent-hi: #c9a544;
  --accent-lo: #8a6d22;
  --accent2:   rgba(168,132,44,.10);
  --accent3:   rgba(168,132,44,.20);
  --on-accent: #fffdf4;
  --line:      rgba(29,26,18,.10);
  --line-soft: rgba(29,26,18,.06);
  --win:       #a8842c;
  --lose:      #d24540;
  --draw:      #b98a2e;
  --gold-grad: linear-gradient(135deg, #e9cf8b 0%, #c9a544 45%, #a8842c 100%);
  --gold-glow: 0 6px 18px rgba(168,132,44,.22);
  --surface:        linear-gradient(180deg, #fffdf8 0%, #faf7ef 100%);
  --surface-raised: linear-gradient(180deg, #ffffff 0%, #f8f5ec 100%);
  --shadow-card:    0 8px 22px rgba(60,50,20,.10);
  --shadow-pop:     0 16px 40px rgba(60,50,20,.16);
  --inset-top:      inset 0 1px 0 rgba(255,255,255,.9);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: var(--lh-base);
  overflow-x: hidden;
}

/* Атмосферный фон — мягкие золотые ореолы */
body::before {
  content: "";
  position: fixed; inset: 0;
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(230,196,108,.09), transparent 60%),
    radial-gradient(80% 50% at 100% 100%, rgba(230,196,108,.05), transparent 60%);
  pointer-events: none;
  z-index: 0;
}
body.light::before {
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(168,132,44,.10), transparent 60%),
    radial-gradient(80% 50% at 100% 100%, rgba(168,132,44,.06), transparent 60%);
}

#app { position: relative; z-index: 1; }
body { padding-bottom: 96px; }

/* Скроллбары */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(230,196,108,.28); border-radius: 4px; }
body.light ::-webkit-scrollbar-thumb { background: rgba(168,132,44,.30); }

/* Фокус — доступность */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* ===== Заголовок ===== */
.header {
  position: sticky; top: 0; z-index: 10;
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter: blur(18px) saturate(1.3);
  backdrop-filter: blur(18px) saturate(1.3);
  padding: 18px 18px 14px;
  border-bottom: 1px solid transparent;
  border-image: linear-gradient(90deg, transparent, var(--line) 20%, var(--line) 80%, transparent) 1;
}
.header h1 {
  margin: 0;
  font-family: var(--font-display);
  font-size: var(--fs-h1);
  font-weight: 700;
  letter-spacing: .2px;
  line-height: var(--lh-tight);
}
.header .sub {
  color: var(--hint);
  font-size: var(--fs-meta);
  font-weight: var(--fw-med);
  margin-top: 5px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
}

.content { padding: 14px 14px 24px; }

/* ===== Универсальная поверхность ===== */
.card, .rating-row, .pred-row, .league-card, .priv-league-card,
.task-card, .pf-section, .um-section, .stat-cmp, .ls-item, .shop-box,
.shop-box-compact, .match-card, .tour-rating-row, .pl-rating-row,
.tb-field, .cp-item, .league-match-item, .notify-item, .notify-open-btn,
.tb-coach, .coll-stat, .tour-info-box, .ls-total-box, .ls-meta-box,
.tb-info-box, .pf-lg-item, .stat-box, .um-box, .pf-stat, .pf-lg-meta-box {
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-card), var(--inset-top);
}

.card {
  border-radius: var(--r-lg);
  padding: 16px;
  margin-bottom: 12px;
}
.card h3, .pf-section-title, .tasks-section-title, .um-section h4 {
  margin: 0 0 12px;
  font-size: var(--fs-meta);
  font-weight: var(--fw-bold);
  text-transform: uppercase;
  letter-spacing: 1.4px;
  color: var(--hint);
}

/* Золотые числа — градиентный текст */
.rating-row .points, .pf-stat-num, .um-box .num, .stat-box .num,
.tour-info-box .num, .coll-stat .num, .xp-total-num, .ls-points,
.plr-points, .tr-points, .pf-lg-pts, .battle-side-power {
  background: var(--gold-grad);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}

/* ============================================================================
   РЕЙТИНГ
   ============================================================================ */
.rating-row {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px; border-radius: var(--r-md); margin-bottom: 9px;
  transition: transform .15s, border-color .15s;
}
.rating-row .rank {
  font-family: var(--font-display);
  font-size: 15px; font-weight: 600;
  width: 34px; text-align: center;
  color: var(--hint);
  line-height: 1.1;
}
.rating-row .name { flex: 1; font-weight: var(--fw-med); font-size: 14px; min-width: 0; }
.rating-row .points {
  font-weight: var(--fw-black);
  font-size: var(--fs-h2);
  letter-spacing: var(--ls-tight);
}
.rating-row .leagues {
  font-size: var(--fs-meta);
  color: var(--hint);
  margin-top: 3px;
  letter-spacing: var(--ls-meta);
}

/* Подиум — фольга */
.rating-row.top1 {
  background: linear-gradient(135deg, rgba(230,196,108,.20), rgba(230,196,108,.05));
  border-color: rgba(230,196,108,.55);
  box-shadow: var(--gold-glow), var(--inset-top);
}
.rating-row.top1 .rank { color: var(--accent-hi); }
.rating-row.top2 {
  background: linear-gradient(135deg, rgba(200,205,215,.16), rgba(200,205,215,.04));
  border-color: rgba(200,205,215,.40);
}
.rating-row.top2 .rank { color: #cfd4dd; }
.rating-row.top3 {
  background: linear-gradient(135deg, rgba(205,140,80,.16), rgba(205,140,80,.04));
  border-color: rgba(205,140,80,.42);
}
.rating-row.top3 .rank { color: #d9a06a; }

body.light .rating-row.top2 .rank { color: #8a8f98; }
body.light .rating-row.top3 .rank { color: #b07c46; }

/* Переключатель режимов — сегмент */
.rating-toggle {
  display: flex;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 4px; margin: 0 14px 14px; gap: 4px;
  box-shadow: var(--shadow-card), var(--inset-top);
}
.rating-toggle-btn {
  flex: 1; padding: 10px 8px; text-align: center;
  font-size: 13px; font-weight: var(--fw-med);
  border-radius: 10px; cursor: pointer;
  color: var(--hint);
  transition: .18s;
}
.rating-toggle-btn.active {
  background: var(--gold-grad);
  color: var(--on-accent);
  font-weight: var(--fw-bold);
  box-shadow: 0 3px 12px rgba(230,196,108,.35);
}

.tour-selectors { display: flex; gap: 8px; padding: 0 14px 14px; }
.tour-select-wrap { flex: 1; position: relative; min-width: 0; }
.tour-select-wrap select {
  width: 100%; padding: 11px 40px 11px 13px;
  background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,.16)), var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px; color: var(--text);
  font-size: 13px; font-weight: var(--fw-med);
  appearance: none; -webkit-appearance: none;
  cursor: pointer; font-family: inherit;
  box-shadow: var(--inset-top);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: border-color .16s, box-shadow .16s;
}
.tour-select-wrap select:focus {
  outline: none;
  border-color: rgba(230,196,108,.6);
  box-shadow: 0 0 0 3px var(--accent2);
}
.tour-select-wrap select:disabled { opacity: .5; cursor: default; }
.tour-select-wrap::after {
  content: "▾"; position: absolute; right: 7px; top: 50%;
  transform: translateY(-50%);
  width: 24px; height: 24px; border-radius: 7px;
  background: rgba(230,196,108,.12); border: 1px solid rgba(230,196,108,.25);
  display: flex; align-items: center; justify-content: center;
  color: var(--accent); pointer-events: none; font-size: 11px; line-height: 1;
}
.tour-info { padding: 0 14px 14px; display: flex; gap: 8px; }
.tour-info-box { flex: 1; border-radius: var(--r-md); padding: 12px; text-align: center; }
.tour-info-box .num {
  font-size: var(--fs-h2); font-weight: var(--fw-black);
  letter-spacing: var(--ls-tight); line-height: 1.1;
}
.tour-info-box .lbl {
  font-size: var(--fs-meta); color: var(--hint); margin-top: 4px;
  text-transform: uppercase; letter-spacing: var(--ls-meta);
}
.tour-rating-row {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; border-radius: var(--r-md);
  margin: 0 0 8px; cursor: pointer;
  transition: border-color .15s, transform .15s;
}
.tour-rating-row:active { transform: scale(.99); }
.tour-rating-row.me { border-color: var(--accent); background: var(--accent2); box-shadow: var(--gold-glow); }
.tour-rating-row .tr-place {
  width: 36px; text-align: center;
  font-weight: var(--fw-black); font-size: var(--fs-h3);
  color: var(--hint); flex-shrink: 0;
  font-family: var(--font-display);
}
.tour-rating-row.top1 .tr-place { color: var(--accent-hi); font-size: var(--fs-num); text-shadow: 0 0 16px rgba(230,196,108,.5); }
.tour-rating-row.top2 .tr-place { color: #cfd4dd; font-size: var(--fs-num); }
.tour-rating-row.top3 .tr-place { color: #d9a06a; font-size: var(--fs-num); }
.tour-rating-row .tr-body { flex: 1; min-width: 0; }
.tour-rating-row .tr-name {
  font-weight: var(--fw-med); font-size: 14px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tour-rating-row .tr-sub {
  font-size: var(--fs-meta); color: var(--hint); margin-top: 2px;
  letter-spacing: var(--ls-meta);
}
.tour-rating-row .tr-points { font-weight: var(--fw-black); font-size: var(--fs-h3); flex-shrink: 0; }
.tour-empty { text-align: center; padding: 44px 20px; color: var(--hint); font-size: var(--fs-label); }

/* ============================================================================
   ФЛАГИ И ГЕРБЫ
   ============================================================================ */
.flag-icon {
  display: inline-block;
  width: 20px; height: 14px;
  border-radius: 3px;
  vertical-align: middle;
  margin-right: 6px;
  box-shadow: 0 1px 3px rgba(0,0,0,.35);
  position: relative; overflow: hidden;
  flex-shrink: 0;
}
.flag-eng { background: #fff; }
.flag-eng::before { content: ""; position: absolute; top: 0; left: 50%; width: 4px; height: 100%; background: #CE1124; transform: translateX(-50%); }
.flag-eng::after { content: ""; position: absolute; top: 50%; left: 0; width: 100%; height: 4px; background: #CE1124; transform: translateY(-50%); }
.flag-es { background: linear-gradient(to bottom, #AA151B 0%, #AA151B 25%, #F1BF00 25%, #F1BF00 75%, #AA151B 75%, #AA151B 100%); }
.flag-it { background: linear-gradient(to right, #009246 0 33.33%, #fff 33.33% 66.66%, #CE2B37 66.66% 100%); }
.flag-de { background: linear-gradient(to bottom, #000 0 33.33%, #DD0000 33.33% 66.66%, #FFCE00 66.66% 100%); }
.flag-fr { background: linear-gradient(to right, #002395 0 33.33%, #fff 33.33% 66.66%, #ED2939 66.66% 100%); }
.flag-br { background: #009C3B; }
.flag-br::before { content: ""; position: absolute; top: 50%; left: 50%; width: 9px; height: 9px; border-radius: 50%; background: #FFDF00; transform: translate(-50%, -50%); }
.flag-br::after { content: ""; position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; border-radius: 50%; background: #002776; transform: translate(-50%, -50%); }
.flag-pt { background: linear-gradient(to right, #046A38 0 40%, #DA291C 40% 100%); }
.flag-pt::before { content: ""; position: absolute; top: 50%; left: 34%; width: 5px; height: 5px; border-radius: 50%; background: #FFE900; border: 1px solid #000; transform: translate(-50%, -50%); box-sizing: border-box; }
.flag-circle {
  width: 18px; height: 18px; border-radius: 50%;
  display: inline-block; vertical-align: middle; margin-right: 6px;
  box-shadow: 0 0 0 1px rgba(0,0,0,.15);
  flex-shrink: 0; overflow: hidden; position: relative;
}

.team-crest {
  display: inline-block;
  width: 20px; height: 20px;
  border-radius: 50%;
  vertical-align: -4px;
  margin-right: 7px;
  object-fit: contain;
  background: #fff;
  flex-shrink: 0;
  box-shadow: 0 0 0 1px rgba(255,255,255,.10), 0 2px 6px rgba(0,0,0,.35);
}
body.light .team-crest { box-shadow: 0 0 0 1px rgba(0,0,0,.07), 0 2px 6px rgba(0,0,0,.12); }
.team-crest-fallback {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; border-radius: 50%;
  vertical-align: -4px; margin-right: 7px;
  font-size: 10px; font-weight: var(--fw-black);
  color: var(--on-accent);
  background: var(--gold-grad);
  flex-shrink: 0; text-transform: uppercase;
  letter-spacing: .2px; line-height: 1;
  user-select: none;
}
/* Название — эмблема — эмблема — название (эмблемы у дефиса по центру) */
.match-teams-row {
  display: flex; align-items: center; gap: 7px;
  flex: 1; min-width: 0;
  font-size: 13.5px; font-weight: var(--fw-med);
  line-height: 1.25;
}
.match-teams-row .team {
  flex: 1; min-width: 0; display: block;
}
.match-teams-row .team-name {
  display: block; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.match-teams-row .team-home .team-name { text-align: right; }
.match-teams-row .team-away .team-name { text-align: left; }
.match-teams-row .team-crest,
.match-teams-row .team-crest-fallback {
  margin-right: 0; vertical-align: 0;
  width: 20px; height: 20px; flex-shrink: 0;
}
.match-teams-row .vs { color: var(--hint); font-weight: var(--fw-reg); flex-shrink: 0; }
.pred-teams {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  margin-bottom: 5px; font-size: 14px; font-weight: var(--fw-med);
}
.pred-teams .team { display: inline-flex; align-items: center; }
.pred-teams .vs { color: var(--hint); font-weight: var(--fw-reg); }

/* ============================================================================
   КАРТОЧКА МАТЧА
   ============================================================================ */
.match-card {
  border-radius: 14px;
  padding: 9px 11px;
  margin-bottom: 7px;
  border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(0,0,0,.14));
  transition: border-color .18s, background .18s, box-shadow .18s;
  display: flex; align-items: center; gap: 10px;
  min-height: 44px;
}
.match-card.expanded {
  border-color: rgba(230,196,108,.6);
  background: var(--accent2);
  box-shadow: var(--gold-glow);
}
.match-card.done { background: rgba(230,196,108,.05); border-color: rgba(230,196,108,.25); }
.match-head { display: flex; flex-direction: row; align-items: center; gap: 8px; flex: 1; min-width: 0; flex-wrap: wrap; }
.match-head > .my-pick { flex-basis: 100%; }
.match-time {
  align-self: flex-start;
  font-size: 9.5px; font-weight: var(--fw-bold);
  color: var(--hint); letter-spacing: .4px;
  line-height: 1.2; white-space: nowrap;
  background: rgba(0,0,0,.28); border: 1px solid var(--line);
  border-radius: 7px; padding: 3px 7px;
  text-transform: uppercase;
}
.match-card.expanded .match-time { color: var(--accent); border-color: rgba(230,196,108,.45); }
/* Дата+время в одной строке с названием матча */
.match-teams-row .match-when {
  flex-shrink: 0; white-space: nowrap;
  font-size: 10px; font-weight: var(--fw-bold); line-height: 1.2;
  color: var(--hint); letter-spacing: .2px;
  padding-left: 7px; margin-left: 1px; border-left: 1px solid var(--line);
}
.match-card.expanded .match-when { color: var(--accent); border-left-color: rgba(230,196,108,.45); }
.match-teams-row { font-size: 13px; font-weight: var(--fw-med); line-height: 1.25; }

/* Кнопка видео голов в карточке матча */
.hl-btn {
  height: 30px; padding: 0 10px; flex-shrink: 0;
  font-size: 11px; font-weight: var(--fw-bold); font-family: var(--font);
  color: var(--accent); background: rgba(230,196,108,.08);
  border: 1px solid rgba(230,196,108,.4); border-radius: 8px;
  cursor: pointer; white-space: nowrap;
}
.hl-btn:active { transform: scale(.95); }
.match-final {
  font-size: 13px; font-weight: var(--fw-bold); color: var(--win);
  white-space: nowrap; text-align: center; line-height: 1.1;
}
.match-final small { display: block; font-size: 8.5px; font-weight: var(--fw-reg); color: var(--hint); letter-spacing: .4px; text-transform: uppercase; }

/* П1 / X / П2 */
.odds-row { display: flex; gap: 6px; flex-shrink: 0; }
.odds-btn {
  min-width: 0; height: 36px; padding: 0 8px;
  background: rgba(0,0,0,.28);
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: 11px; font-weight: var(--fw-bold);
  color: var(--text); cursor: pointer;
  transition: .14s; text-align: center; line-height: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
}
body.light .odds-btn { background: rgba(29,26,18,.04); }
.odds-btn .odds-label { display: block; font-size: 12px; font-weight: var(--fw-black); line-height: 1; }
.odds-btn .odds-sub {
  display: block; font-size: 8px; font-weight: var(--fw-med); color: var(--hint);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 64px; text-transform: uppercase; letter-spacing: .3px; line-height: 1;
}
.odds-btn:active { transform: scale(.95); }
.odds-btn.selected {
  background: var(--gold-grad);
  color: var(--on-accent);
  border-color: transparent;
  box-shadow: var(--gold-glow);
}
.odds-btn.selected .odds-sub { color: rgba(26,20,5,.7); }

/* Чип «мой прогноз» в списке матчей */
.my-pick {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(230,196,108,.1);
  border: 1px solid rgba(230,196,108,.45);
  border-radius: 10px;
  padding: 6px 10px;
  flex-shrink: 0;
}
.my-pick .mp-outcome { font-size: 12px; font-weight: var(--fw-black); color: var(--accent); }
.my-pick .mp-score {
  font-size: 12px; font-weight: var(--fw-black); color: var(--text);
  font-family: var(--font-display);
}
.my-pick .mp-check {
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--gold-grad); color: var(--on-accent);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: var(--fw-black);
}

/* Инлайн-ввод счёта */
.score-inline { display: flex; align-items: center; justify-content: center; gap: 6px; flex-shrink: 0; }
.score-inline input {
  width: 46px; height: 38px; padding: 0;
  border: 1px solid var(--line);
  background: rgba(0,0,0,.28);
  color: var(--text);
  border-radius: 10px; font-size: 16px; font-weight: var(--fw-black);
  text-align: center;
  -moz-appearance: textfield;
  font-family: var(--font-display);
}
body.light .score-inline input { background: rgba(29,26,18,.04); }
.score-inline input::-webkit-outer-spin-button,
.score-inline input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.score-inline input:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent2);
}
.score-inline .score-colon { font-weight: var(--fw-black); color: var(--hint); font-size: 15px; line-height: 1; }
.score-inline .score-save {
  width: 46px; height: 38px; padding: 0; margin-left: 4px;
  background: var(--gold-grad); color: var(--on-accent);
  border: none; border-radius: 10px; font-size: 16px; font-weight: var(--fw-black);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  box-shadow: var(--gold-glow);
}
/* 🃏 Джокер в строке счёта */
.joker-toggle {
  width: 38px; height: 38px; padding: 0; margin-left: 2px; flex-shrink: 0;
  background: rgba(168,85,247,.12); border: 1px dashed rgba(168,85,247,.55);
  border-radius: 10px; font-size: 17px; cursor: pointer; line-height: 1;
  opacity: .75; transition: all .2s;
}
.joker-toggle.active {
  opacity: 1; border-style: solid;
  background: linear-gradient(135deg, rgba(168,85,247,.35), rgba(255,110,199,.25));
  border-color: #a855f7;
  box-shadow: 0 0 12px rgba(168,85,247,.55);
  transform: scale(1.06);
}
.my-pick .mp-joker { font-size: 13px; margin-left: 2px; }
.score-inline .score-save:active { transform: scale(.92); }

.pred-done-mini {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--accent2);
  border: 1px solid var(--win);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: var(--win); flex-shrink: 0;
  box-shadow: 0 0 12px rgba(230,196,108,.25);
}
.match-locked {
  font-size: 10px; color: var(--hint);
  padding: 5px 9px;
  background: rgba(0,0,0,.22);
  border: 1px dashed var(--line);
  border-radius: 8px; text-align: center; flex-shrink: 0; font-weight: var(--fw-med);
}
body.light .match-locked { background: rgba(29,26,18,.03); }
.match-card .pred-done { display: none; }

.pred-done {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  background: rgba(0,0,0,.25);
  border: 1px solid var(--line);
  border-left: 3px solid var(--win);
  border-radius: 10px; padding: 8px 11px;
}
body.light .pred-done { background: rgba(29,26,18,.03); }
.pred-done-left { display: flex; flex-direction: column; min-width: 0; }
.pred-done-label {
  font-size: var(--fs-meta); text-transform: uppercase;
  letter-spacing: var(--ls-meta); color: var(--hint); font-weight: var(--fw-bold);
}
.pred-done-value {
  font-size: 13px; font-weight: var(--fw-bold);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pred-done-check { font-size: 16px; color: var(--win); flex-shrink: 0; }

/* ============================================================================
   МОИ ПРОГНОЗЫ
   ============================================================================ */
/* --- Карточки прогнозов v2 --- */
.pred-card {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px 10px;
  margin-bottom: 7px;
  background: rgba(0,0,0,.18);
}
body.light .pred-card { background: rgba(29,26,18,.03); }
.pred-card-latest {
  border-color: rgba(230,196,108,.6);
  background: var(--accent2);
  box-shadow: var(--gold-glow);
}
.pred-card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
.pred-card-league {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 9px; font-weight: var(--fw-bold); color: var(--hint);
  text-transform: uppercase; letter-spacing: .5px;
  min-width: 0; overflow: hidden; white-space: nowrap;
}
.pred-card-league .flag-icon { width: 13px; height: 9px; border-radius: 2px; flex-shrink: 0; }
.pred-card-date { font-size: 9px; color: var(--hint); flex-shrink: 0; font-weight: var(--fw-med); }
.pred-card-body { display: flex; align-items: center; gap: 8px; }
.pred-card-teams { flex: 1; min-width: 0; }
.pred-card-teams .match-teams-row { font-size: 12px; gap: 5px; }
.pred-card-teams .match-teams-row .team-crest,
.pred-card-teams .match-teams-row .team-crest-fallback { width: 16px; height: 16px; }
.pred-verdict {
  flex-shrink: 0; text-align: center;
  background: rgba(0,0,0,.30);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 4px 7px; min-width: 72px;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
}
body.light .pred-verdict { background: rgba(29,26,18,.04); }
.pred-verdict .pv-label {
  font-size: 7.5px; text-transform: uppercase;
  letter-spacing: .6px; color: var(--hint);
}
.pred-verdict .pv-pick { font-size: 12.5px; font-weight: var(--fw-black); line-height: 1.15; }
.pred-verdict .pv-real { font-size: 9px; color: var(--hint); }
.pred-verdict .pv-note { font-size: 8.5px; color: var(--hint); }
.pred-verdict .pv-pts {
  font-size: 10px; font-weight: var(--fw-black);
  padding: 0 7px; border-radius: 9px; line-height: 1.4;
}
.pred-verdict.win  .pv-pick { color: var(--win); }
.pred-verdict.win  .pv-pts  { background: rgba(110,220,140,.16); color: var(--win); border: 1px solid rgba(110,220,140,.4); }
.pred-verdict.mid  .pv-pts  { background: rgba(230,196,108,.14); color: var(--accent); border: 1px solid rgba(230,196,108,.4); }
.pred-verdict.lose .pv-pick { color: var(--lose); }
.pred-verdict.lose .pv-pts  { background: rgba(229,96,90,.12); color: var(--lose); border: 1px solid rgba(229,96,90,.35); }
.pred-card .pred-latest-badge {
  display: inline-block; font-size: 8.5px; font-weight: var(--fw-black);
  color: var(--on-accent);
  background: var(--gold-grad);
  padding: 3px 9px; border-radius: 20px; margin-bottom: 6px;
  text-transform: uppercase; letter-spacing: .7px;
}
.pred-card-actions { display: flex; gap: 6px; margin-top: 6px; justify-content: flex-end; }
.pca-btn {
  flex: none; padding: 4px 10px; border-radius: 7px;
  font-size: 9px; font-weight: var(--fw-bold);
  text-transform: uppercase; letter-spacing: .5px;
  cursor: pointer; transition: .16s;
  border: 1px solid rgba(230,196,108,.5);
  background: transparent; color: var(--accent);
  line-height: 1.5; white-space: nowrap;
}
.pca-btn:active { transform: scale(.97); background: var(--accent2); }
.pca-btn.primary {
  background: var(--gold-grad); color: var(--on-accent);
  border-color: transparent; box-shadow: var(--gold-glow);
}

/* --- Видеообзоры (ScoreBat) --- */
.video-wrap {
  position: relative; height: 0; padding-bottom: 56.25%;
  border-radius: 10px; overflow: hidden; background: #000;
  margin-bottom: 8px;
}
.video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video-title { font-size: 11px; color: var(--hint); text-align: center; margin: 0 0 12px; }

.pred-row { border-radius: var(--r-md); padding: 14px; margin-bottom: 9px; }
.pred-row .match { font-weight: var(--fw-med); margin-bottom: 5px; font-size: 14px; }
.pred-row .meta {
  font-size: var(--fs-meta); color: var(--hint); margin-bottom: 7px;
  letter-spacing: var(--ls-meta); text-transform: uppercase;
}
.pred-row .guess { font-size: 14px; margin-bottom: 5px; }
.pred-row .result { font-size: 13px; font-weight: var(--fw-med); }
.pred-row .result.pending { color: var(--hint); }
.pred-row .result b { font-weight: var(--fw-black); }
.pred-row.pred-row-latest {
  border-color: rgba(230,196,108,.6);
  background: var(--accent2);
  box-shadow: var(--gold-glow);
}
.pred-row .pred-latest-badge {
  display: inline-block; font-size: var(--fs-meta); font-weight: var(--fw-black);
  color: var(--on-accent);
  background: var(--gold-grad);
  padding: 4px 10px; border-radius: 20px; margin-bottom: 8px;
  text-transform: uppercase; letter-spacing: .8px;
}

/* ============================================================================
   НИЖНЯЯ НАВИГАЦИЯ — плавающая стеклянная панель
   ============================================================================ */
.nav {
  position: fixed; bottom: 12px; left: 12px; right: 12px;
  display: flex;
  background: var(--bg3);
  background: color-mix(in srgb, var(--bg3) 78%, transparent);
  -webkit-backdrop-filter: blur(22px) saturate(1.4);
  backdrop-filter: blur(22px) saturate(1.4);
  border: 1px solid var(--line);
  border-radius: 22px;
  z-index: 20;
  padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
  box-shadow: var(--shadow-pop), var(--inset-top);
}
.nav-item {
  flex: 1;
  padding: 6px 2px 8px;
  text-align: center;
  cursor: pointer;
  transition: color .18s;
  color: var(--hint);
  font-size: 10px;
  font-weight: var(--fw-med);
  position: relative;
  border-radius: 16px;
}
.nav-item .ico {
  display: flex;
  align-items: center; justify-content: center;
  width: 24px; height: 24px;
  margin: 0 auto 4px;
  line-height: 0;
}
.nav-item .nav-label { display: block; text-align: center; }
.tab-ico { display: block; width: 24px; height: 24px; background: currentColor;
  -webkit-mask: center / contain no-repeat; mask: center / contain no-repeat; }
.tab-ico-rating      { -webkit-mask-image: url("icons/tab-rating.png");      mask-image: url("icons/tab-rating.png"); }
.tab-ico-matches    { -webkit-mask-image: url("icons/tab-matches.png");     mask-image: url("icons/tab-matches.png"); }
.tab-ico-predictions{ -webkit-mask-image: url("icons/tab-predictions.png");mask-image: url("icons/tab-predictions.png"); }
.tab-ico-shop       { -webkit-mask-image: url("icons/tab-shop.png");       mask-image: url("icons/tab-shop.png"); }
.tab-ico-profile    { -webkit-mask-image: url("icons/tab-profile.png");    mask-image: url("icons/tab-profile.png"); }

.nav-item .ico svg {
  width: 100%; height: 100%; display: block;
  transition: transform .22s cubic-bezier(.34,1.4,.64,1), filter .22s;
}
.nav-item.active { color: var(--accent); font-weight: var(--fw-bold); }
.nav-item.active::after {
  content: "";
  position: absolute; left: 50%; bottom: 2px;
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--accent);
  transform: translateX(-50%);
  box-shadow: 0 0 8px var(--accent);
}
.nav-item.active .ico svg {
  transform: scale(1.12) translateY(-1px);
  filter: drop-shadow(0 0 7px rgba(230,196,108,.65));
}
.nav-item:active .ico svg { transform: scale(.92); transition-duration: .08s; }

/* ============================================================================
   ЗАГРУЗКА / СКЕЛЕТОНЫ / ТОСТЫ
   ============================================================================ */
.loader { text-align: center; padding: 48px 20px; color: var(--hint); font-size: var(--fs-label); }
.spinner {
  display: inline-block; width: 30px; height: 30px;
  border: 3px solid var(--line);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin-bottom: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.skel, .skel-rating-row, .skel-pred-row, .skel-stat-box, .skel-match-card {
  background: var(--bg2);
  border-radius: var(--r-md);
  position: relative; overflow: hidden;
}
.skel::after, .skel-rating-row::after, .skel-pred-row::after, .skel-stat-box::after, .skel-match-card::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(230,196,108,.07) 50%, transparent 100%);
  transform: translateX(-100%); animation: skelShimmer 1.4s infinite;
}
body.light .skel::after, body.light .skel-rating-row::after,
body.light .skel-pred-row::after, body.light .skel-stat-box::after,
body.light .skel-match-card::after {
  background: linear-gradient(90deg, transparent 0%, rgba(168,132,44,.10) 50%, transparent 100%);
}
@keyframes skelShimmer { 100% { transform: translateX(100%); } }

.skel-rating-row {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 16px; margin-bottom: 9px;
}
.skel-rating-row .skel-rank { width: 34px; height: 20px; border-radius: 6px; background: var(--line); flex-shrink: 0; }
.skel-rating-row .skel-body { flex: 1; min-width: 0; }
.skel-rating-row .skel-name { height: 14px; width: 60%; border-radius: 6px; background: var(--line); margin-bottom: 7px; }
.skel-rating-row .skel-leagues { height: 10px; width: 40%; border-radius: 6px; background: var(--line); }
.skel-rating-row .skel-points { width: 42px; height: 20px; border-radius: 6px; background: var(--line); flex-shrink: 0; }

.skel-match-card { padding: 12px 14px; margin-bottom: 8px; }
.skel-match-card .skel-time { height: 10px; width: 25%; border-radius: 6px; background: var(--line); margin-bottom: 9px; }
.skel-match-card .skel-teams { height: 14px; width: 70%; border-radius: 6px; background: var(--line); margin-bottom: 12px; }
.skel-match-card .skel-odds { display: flex; gap: 5px; }
.skel-match-card .skel-odds > div { flex: 1; height: 34px; border-radius: 9px; background: var(--line); }

.skel-pred-row { padding: 14px; margin-bottom: 9px; }
.skel-pred-row .skel-line-1 { height: 14px; width: 70%; border-radius: 6px; background: var(--line); margin-bottom: 7px; }
.skel-pred-row .skel-line-2 { height: 10px; width: 45%; border-radius: 6px; background: var(--line); margin-bottom: 9px; }
.skel-pred-row .skel-line-3 { height: 12px; width: 55%; border-radius: 6px; background: var(--line); }

.skel-profile-header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.skel-profile-header .skel-avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--line); flex-shrink: 0; }
.skel-profile-header .skel-lines { flex: 1; }
.skel-profile-header .skel-lines > div { height: 14px; border-radius: 6px; background: var(--line); margin-bottom: 8px; }
.skel-profile-header .skel-lines > div:first-child { width: 50%; }
.skel-profile-header .skel-lines > div:last-child { width: 35%; height: 10px; }

.skel-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 12px; }
.skel-stat-box { height: 70px; }

.toast {
  position: fixed; bottom: 104px; left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: var(--bg3);
  background: color-mix(in srgb, var(--bg3) 92%, transparent);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 12px 20px; border-radius: 16px;
  font-size: 14px; font-weight: var(--fw-med);
  z-index: 100; opacity: 0; pointer-events: none;
  transition: .25s; max-width: 90vw; text-align: center;
  box-shadow: var(--shadow-pop);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { background: #3a1512;
  background: color-mix(in srgb, #3a1512 92%, transparent); border-color: var(--lose); }
.toast.success {
  background: var(--gold-grad);
  color: var(--on-accent);
  font-weight: var(--fw-bold);
  border-color: transparent;
  box-shadow: var(--gold-glow);
}

.empty { text-align: center; padding: 36px 20px; color: var(--hint); font-size: var(--fs-label); }

.error-box {
  background: var(--bg2); border: 1px solid rgba(229,96,90,.5);
  border-radius: var(--r-lg);
  padding: 26px; margin: 20px; text-align: center;
  box-shadow: var(--shadow-pop);
}
.error-box .icon { font-size: 52px; margin-bottom: 14px; }
.error-box h2 {
  color: var(--lose); margin: 0 0 12px;
  font-size: var(--fs-h1); font-weight: var(--fw-bold);
  font-family: var(--font-display);
}
.error-box p { color: var(--hint); font-size: 14px; line-height: 1.6; margin: 8px 0; }
.error-box code {
  background: rgba(0,0,0,.3); padding: 3px 8px; border-radius: 6px;
  font-size: 12px; font-family: ui-monospace, monospace;
  color: var(--accent);
}
body.light .error-box code { background: rgba(29,26,18,.06); }
.error-box .step {
  background: rgba(0,0,0,.2); padding: 12px; border-radius: 12px;
  margin: 10px 0; text-align: left;
  border-left: 3px solid var(--accent);
  color: var(--text);
}
body.light .error-box .step { background: rgba(29,26,18,.03); }

/* ============================================================================
   МОДАЛЬНЫЕ ОКНА
   ============================================================================ */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(5,5,9,.72);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  z-index: 200; display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .22s;
}
.modal-backdrop.show { opacity: 1; pointer-events: auto; }
.modal {
  background: var(--bg);
  width: 100%; max-width: 560px;
  border-radius: 26px 26px 0 0;
  padding: 12px 18px calc(20px + env(safe-area-inset-bottom));
  max-height: 84vh; overflow-y: auto;
  transform: translateY(28px);
  transition: transform .26s cubic-bezier(.32,.72,.35,1);
  border-top: 1px solid var(--line);
  box-shadow: 0 -20px 60px rgba(0,0,0,.5);
  position: relative;
}
.modal::before {
  content: "";
  position: absolute; top: 8px; left: 50%;
  width: 40px; height: 4px; border-radius: 3px;
  background: var(--line);
  transform: translateX(-50%);
}
.modal-backdrop.show .modal { transform: translateY(0); }
.modal .modal-head {
  display: flex; align-items: center; justify-content: space-between;
  margin: 14px 0 8px;
}
.modal .modal-head h3 {
  margin: 0; font-size: var(--fs-h2); font-weight: var(--fw-bold);
  font-family: var(--font-display);
  letter-spacing: .2px;
}
.modal .modal-close {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--hint);
  width: 34px; height: 34px; border-radius: 50%;
  font-size: 17px; cursor: pointer;
  box-shadow: var(--inset-top);
}
.modal .modal-close:active { transform: scale(.92); color: var(--accent); }
.modal .modal-sub { color: var(--hint); font-size: var(--fs-label); margin-bottom: 14px; }

/* Сравнение прогнозов */
.cmp-row {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 13px; border-radius: var(--r-sm);
  margin-bottom: 7px;
  background: var(--surface);
  border: 1px solid var(--line);
}
.cmp-row.me {
  background: var(--accent2);
  border-color: rgba(230,196,108,.6);
  box-shadow: var(--gold-glow);
}
.cmp-row .cmp-name { flex: 1; font-weight: var(--fw-med); font-size: 14px; }
.cmp-row .cmp-outcome { font-size: var(--fs-label); color: var(--hint); margin-top: 2px; }
.cmp-row .cmp-score {
  font-weight: var(--fw-black); font-size: var(--fs-h3); padding: 5px 11px;
  background: rgba(0,0,0,.3); border-radius: 9px; border: 1px solid var(--line);
  font-family: var(--font-display);
}
body.light .cmp-row .cmp-score { background: rgba(29,26,18,.05); }

.stat-cmp { border-radius: var(--r-md); padding: 13px; margin-bottom: 12px; }
.stat-cmp-title {
  font-size: var(--fs-meta); color: var(--hint); margin-bottom: 9px;
  text-align: center; text-transform: uppercase; letter-spacing: 1.2px;
}
.stat-cmp-row { display: flex; gap: 8px; margin-bottom: 11px; }
.stat-cmp-item {
  flex: 1;
  background: rgba(0,0,0,.22);
  border: 1px solid var(--line);
  border-top: 2px solid transparent;
  border-radius: var(--r-sm); padding: 8px 4px; text-align: center;
}
.stat-cmp-item.it-p1 { border-top-color: #e6c46c; }
.stat-cmp-item.it-x  { border-top-color: #8a8f98; }
.stat-cmp-item.it-p2 { border-top-color: #e5605a; }
body.light .stat-cmp-item { background: rgba(29,26,18,.03); }
.stat-cmp-item .stat-cmp-label {
  font-size: var(--fs-meta); color: var(--hint);
  text-transform: uppercase; letter-spacing: var(--ls-meta);
}
.stat-cmp-item .stat-cmp-val {
  font-size: var(--fs-num); font-weight: var(--fw-black);
  margin: 3px 0; letter-spacing: var(--ls-tight);
}
.stat-cmp-item .stat-cmp-cnt { font-size: var(--fs-meta); color: var(--hint); }
.stat-cmp-bar {
  display: flex; gap: 2px; height: 9px; border-radius: 7px;
  overflow: hidden; background: rgba(0,0,0,.3);
  border: 1px solid var(--line-soft);
}
.stat-cmp-bar .bar-seg { height: 100%; border-radius: 4px; min-width: 4px; }
.stat-cmp-bar .bar-p1   { background: linear-gradient(90deg, #efd28a, #c69a34); }
.stat-cmp-bar .bar-draw { background: linear-gradient(90deg, #9aa1ab, #6c737d); }
.stat-cmp-bar .bar-p2   { background: linear-gradient(90deg, #ef7b74, #c2443f); }
.cmp-empty { text-align: center; padding: 22px; color: var(--hint); font-size: var(--fs-label); }

/* --- Строки прогнозов в модалке «Сравнить» --- */
.cmp-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--accent2); border: 1px solid rgba(230,196,108,.4);
  display: flex; align-items: center; justify-content: center;
  font-weight: var(--fw-black); font-size: 13px; color: var(--accent);
  flex-shrink: 0; text-transform: uppercase;
}
.cmp-info { flex: 1; min-width: 0; }
.cmp-me-tag {
  font-size: 9px; font-weight: var(--fw-black); color: var(--on-accent);
  background: var(--gold-grad); border-radius: 6px; padding: 1px 5px;
  text-transform: uppercase; letter-spacing: .4px; vertical-align: 1px;
}
.cmp-chip {
  font-size: 10px; font-weight: var(--fw-black);
  padding: 3px 8px; border-radius: 8px; flex-shrink: 0; line-height: 1.2;
}
.cmp-chip.chip-p1 { background: rgba(230,196,108,.15); color: var(--accent); border: 1px solid rgba(230,196,108,.4); }
.cmp-chip.chip-x  { background: rgba(255,255,255,.06); color: var(--hint); border: 1px solid var(--line); }
.cmp-chip.chip-p2 { background: rgba(229,96,90,.13); color: #e5605a; border: 1px solid rgba(229,96,90,.35); }

/* .compare-btn — стили задаёт .pca-btn (кнопка в карточке прогноза);
   старое полноростовое правило удалено, оно растягивало кнопку на всю ширину */

/* ============================================================================
   СТАТИСТИКА ПРОГНОЗОВ
   ============================================================================ */
.ls-total {
  background: rgba(0,0,0,.22);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 12px; margin-bottom: 12px;
}
body.light .ls-total { background: rgba(29,26,18,.03); }
.ls-total-row { display: flex; gap: 8px; margin-bottom: 11px; }
.ls-total-box { flex: 1; text-align: center; border-radius: var(--r-sm); padding: 9px 4px; }
.ls-total-box .num {
  font-size: var(--fs-num-sm); font-weight: var(--fw-black);
  letter-spacing: var(--ls-tight);
  background: var(--gold-grad);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.ls-total-box .lbl {
  font-size: var(--fs-meta); color: var(--hint); margin-top: 3px;
  text-transform: uppercase; letter-spacing: var(--ls-meta);
}
.ls-bars { display: flex; flex-direction: column; gap: 9px; }
.ls-bar .ls-bar-top {
  display: flex; justify-content: space-between;
  font-size: var(--fs-meta); color: var(--hint); margin-bottom: 4px;
  letter-spacing: var(--ls-meta);
}
.ls-bar .ls-bar-val { font-weight: var(--fw-med); color: var(--text); }
.ls-bar .ls-bar-cnt { color: var(--hint); font-weight: var(--fw-reg); }
.ls-bar .ls-bar-track {
  height: 7px; background: rgba(0,0,0,.3);
  border-radius: 6px; overflow: hidden;
}
body.light .ls-bar .ls-bar-track { background: rgba(29,26,18,.06); }
.ls-bar .ls-bar-fill { height: 100%; border-radius: 6px; transition: width .35s; }
.ls-bar-oc .ls-bar-fill { background: linear-gradient(90deg, #e6c46c, #c69a34); }
.ls-bar-df .ls-bar-fill { background: linear-gradient(90deg, #d9a94e, #a87c28); }
.ls-bar-sc .ls-bar-fill { background: linear-gradient(90deg, #f0d896, #d4ab48); }

.ls-acc { display: flex; flex-direction: column; gap: 7px; }
.ls-item { border-radius: var(--r-md); overflow: hidden; }
.ls-item .ls-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; cursor: pointer;
}
.ls-item .ls-head-title {
  display: flex; align-items: center; gap: 9px;
  font-weight: var(--fw-med); font-size: 14px; min-width: 0;
}
.ls-item .ls-emoji { font-size: 19px; }
.ls-item .ls-name {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 60vw;
}
.ls-item .ls-head-right {
  display: flex; align-items: center; gap: 9px;
  color: var(--hint); font-size: var(--fs-meta);
}
.ls-item .ls-points {
  font-weight: var(--fw-black);
  background: var(--gold-grad);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.ls-item .ls-chev { display: inline-block; transition: transform .2s; font-size: 12px; }
.ls-item.open .ls-chev { transform: rotate(180deg); }
.ls-item .ls-body { display: none; padding: 0 14px 14px; }
.ls-item.open .ls-body { display: block; }
.ls-meta { display: flex; gap: 7px; margin-bottom: 11px; }
.ls-meta-box { flex: 1; text-align: center; border-radius: var(--r-sm); padding: 9px 4px; }
.ls-meta-box .num { font-size: var(--fs-num-sm); font-weight: var(--fw-bold); }
.ls-meta-box .lbl {
  font-size: var(--fs-meta); color: var(--hint); margin-top: 3px;
  text-transform: uppercase; letter-spacing: var(--ls-meta);
}
.ls-pending { margin-top: 11px; font-size: var(--fs-meta); color: var(--hint); text-align: center; }

/* ============================================================================
   УВЕДОМЛЕНИЯ
   ============================================================================ */
.notify-open-btn {
  display: block; width: 100%; margin: 0 0 12px;
  padding: 13px 15px; border-radius: var(--r-md); color: var(--text);
  font-size: 14px; font-weight: var(--fw-med);
  text-align: left; cursor: pointer;
}
.notify-open-btn:active { transform: scale(.99); border-color: rgba(230,196,108,.5); }
.notify-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 15px; }
.notify-item {
  display: flex; align-items: center; gap: 11px;
  padding: 11px 13px; border-radius: var(--r-sm); cursor: pointer;
}
.notify-item input[type="checkbox"] {
  width: 21px; height: 21px;
  accent-color: var(--accent);
  flex-shrink: 0;
}
.notify-item .notify-emoji { font-size: 19px; }
.notify-item .notify-name { font-weight: var(--fw-med); font-size: 14px; }
.notify-save-btn {
  width: 100%; padding: 14px;
  background: var(--gold-grad); color: var(--on-accent);
  border: none; border-radius: 13px;
  font-size: var(--fs-h3); font-weight: var(--fw-black);
  cursor: pointer;
  box-shadow: var(--gold-glow);
  text-transform: uppercase; letter-spacing: .6px;
}
.notify-save-btn:active { transform: scale(.98); }
.notify-save-btn[disabled] { opacity: .55; box-shadow: none; }

/* ============================================================================
   МОДАЛКА ПОЛЬЗОВАТЕЛЯ
   ============================================================================ */
.user-modal .um-head { display: flex; align-items: center; gap: 15px; margin: 14px 0 18px; }
.user-modal .um-avatar {
  width: 58px; height: 58px; border-radius: 50%;
  background: var(--gold-grad); color: var(--on-accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: var(--fw-black); flex-shrink: 0;
  box-shadow: var(--gold-glow);
  font-family: var(--font-display);
}
.user-modal .um-name {
  font-size: var(--fs-h2); font-weight: var(--fw-bold);
  margin: 0 0 3px; word-break: break-word;
}
.user-modal .um-sub { color: var(--hint); font-size: var(--fs-label); }
.um-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 15px; }
.um-box { border-radius: var(--r-md); padding: 13px; text-align: center; }
.um-box .num {
  font-size: var(--fs-num); font-weight: var(--fw-black);
  letter-spacing: var(--ls-tight); line-height: 1.1;
}
.um-box .lbl {
  font-size: var(--fs-meta); color: var(--hint); margin-top: 4px;
  text-transform: uppercase; letter-spacing: var(--ls-meta);
}
.um-section { border-radius: var(--r-md); padding: 13px 15px; margin-bottom: 11px; }
.um-league-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 0; border-bottom: 1px solid var(--line-soft);
  font-size: 14px;
}
.um-league-row:last-child { border-bottom: none; }
.um-league-left { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1; }
.um-league-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.um-league-right { display: flex; gap: 11px; font-size: var(--fs-meta); color: var(--hint); flex-shrink: 0; }
.um-league-right b {
  color: var(--accent); font-weight: var(--fw-black);
  background: var(--gold-grad);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.um-ach-list { display: flex; flex-wrap: wrap; gap: 6px; }
.um-ach-badge {
  padding: 6px 11px;
  background: rgba(0,0,0,.25);
  border: 1px solid var(--line);
  border-radius: 20px; font-size: 12px;
}
body.light .um-ach-badge { background: rgba(29,26,18,.04); }
.um-empty { text-align: center; padding: 15px; color: var(--hint); font-size: var(--fs-label); }
.um-bars { display: flex; flex-direction: column; gap: 9px; margin-top: 9px; }

.theme-icon-btn {
  width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text); font-size: 21px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  transition: transform .16s, border-color .16s;
  box-shadow: var(--inset-top);
}
.theme-icon-btn:active { transform: scale(.9); border-color: rgba(230,196,108,.6); }

/* ============================================================================
   СПИСОК ЛИГ
   ============================================================================ */
.leagues-list { display: flex; flex-direction: column; gap: 11px; padding: 0 14px 14px; }
.league-card {
  display: flex; align-items: center; gap: 15px;
  padding: 17px 19px;
  border-radius: var(--r-lg); cursor: pointer;
  transition: transform .16s, border-color .16s, box-shadow .16s;
}
.league-card:active {
  transform: scale(.98);
  border-color: rgba(230,196,108,.6);
  box-shadow: var(--gold-glow);
}
.league-card .lc-emoji {
  font-size: 30px; line-height: 1; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  width: 34px; height: 26px;
}
.league-card .lc-body { flex: 1; min-width: 0; }
.league-card .lc-name {
  font-size: var(--fs-h3); font-weight: var(--fw-bold);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.league-card .lc-sub {
  font-size: var(--fs-meta); color: var(--hint); margin-top: 3px;
  text-transform: uppercase; letter-spacing: 1px;
}
.league-card .lc-arrow { font-size: 18px; color: var(--accent); flex-shrink: 0; }

.matches-back { display: flex; align-items: center; gap: 9px; padding: 10px 14px 14px; }
.matches-back-btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 16px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 22px; color: var(--text);
  font-size: 13px; font-weight: var(--fw-med);
  cursor: pointer;
  box-shadow: var(--inset-top);
}
.matches-back-btn:active { transform: scale(.96); border-color: rgba(230,196,108,.6); color: var(--accent); }
.matches-league-title {
  font-size: var(--fs-h3); font-weight: var(--fw-bold);
  margin-left: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1; min-width: 0;
}

/* ============================================================================
   ПРОФИЛЬ
   ============================================================================ */
.profile-header { display: flex; align-items: center; gap: 15px; margin-bottom: 17px; }
.profile-header .avatar {
  width: 66px; height: 66px; border-radius: 50%;
  background: var(--gold-grad); color: var(--on-accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; font-weight: var(--fw-black); flex-shrink: 0;
  box-shadow: var(--gold-glow);
  font-family: var(--font-display);
}
.profile-header .info h2 { margin: 0 0 3px; font-size: var(--fs-h2); font-weight: var(--fw-bold); }
.profile-header .info .uname { color: var(--hint); font-size: var(--fs-label); }

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 13px; }
.stat-box { border-radius: var(--r-md); padding: 13px; text-align: center; }
.stat-box .num {
  font-size: var(--fs-num); font-weight: var(--fw-black);
  line-height: 1.1; letter-spacing: var(--ls-tight);
}
.stat-box .lbl {
  font-size: var(--fs-meta); color: var(--hint); margin-top: 4px;
  text-transform: uppercase; letter-spacing: var(--ls-meta);
}

.ach-list { display: flex; flex-wrap: wrap; gap: 7px; }
.ach-badge {
  padding: 7px 12px;
  background: rgba(0,0,0,.25);
  border: 1px solid var(--line);
  border-radius: 20px; font-size: 12px; font-weight: var(--fw-med);
}
body.light .ach-badge { background: rgba(29,26,18,.04); }

.pf-hero { display: flex; align-items: center; gap: 14px; margin-bottom: 15px; }
.pf-avatar {
  width: 54px; height: 54px; border-radius: 50%;
  background: var(--gold-grad); color: var(--on-accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: var(--fw-black); flex-shrink: 0;
  box-shadow: var(--gold-glow);
  font-family: var(--font-display);
}
.pf-hero-info { flex: 1; min-width: 0; }
.pf-name {
  font-size: var(--fs-h2); font-weight: var(--fw-bold);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pf-sub {
  font-size: var(--fs-label); color: var(--hint); margin-top: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pf-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-bottom: 15px; }
.pf-stat { border-radius: var(--r-md); padding: 11px 6px; text-align: center; }
.pf-stat-num {
  font-size: var(--fs-num); font-weight: var(--fw-black);
  line-height: 1.1; letter-spacing: var(--ls-tight);
}
.pf-stat-lbl {
  font-size: var(--fs-meta); color: var(--hint);
  text-transform: uppercase; letter-spacing: var(--ls-meta); margin-top: 4px;
}
/* Игровой блок: Коллекция / Моя команда / Битва */
.pf-game-block {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  margin-bottom: 12px;
}
.pf-game-card {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px; padding: 14px 6px 12px;
  border-radius: 14px; border: 1px solid rgba(230,196,108,.35);
  background: linear-gradient(165deg, rgba(230,196,108,.10), rgba(0,0,0,.22));
  color: var(--text); cursor: pointer; transition: .16s;
  position: relative; overflow: hidden;
}
.pf-game-card::before {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(90deg, rgba(46,125,60,.09) 0 14px, transparent 14px 28px);
  pointer-events: none;
}
.pf-game-card:active { transform: scale(.96); border-color: rgba(230,196,108,.6); box-shadow: var(--gold-glow); }
.pf-game-ico {
  font-size: 30px; line-height: 1;
  filter: drop-shadow(0 3px 6px rgba(0,0,0,.4));
  animation: sbox-float 3.2s ease-in-out infinite;
  position: relative; z-index: 1;
}
.pf-game-card:nth-child(2) .pf-game-ico { animation-delay: .5s; }
.pf-game-card:nth-child(3) .pf-game-ico { animation-delay: 1s; }
.pf-game-name { font-size: 11.5px; font-weight: var(--fw-black); position: relative; z-index: 1; }
.pf-game-sub { font-size: 8.5px; color: var(--hint); position: relative; z-index: 1; }

.pf-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-bottom: 15px; }
.pf-action {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 14px;
  border-radius: var(--r-md); color: var(--text);
  font-size: var(--fs-label); font-weight: var(--fw-med);
  cursor: pointer; text-align: left;
  transition: .16s;
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-card), var(--inset-top);
  font-family: inherit;
}
button { font-family: inherit; }
.pf-action:active {
  transform: scale(.97);
  background: var(--accent2);
  border-color: rgba(230,196,108,.6);
  box-shadow: var(--gold-glow);
}
.pf-action-ico { font-size: 19px; line-height: 1; }
.pf-section { border-radius: var(--r-lg); padding: 14px; margin-bottom: 11px; }
.pf-empty { text-align: center; padding: 15px; color: var(--hint); font-size: var(--fs-label); }
.pf-leagues { display: flex; flex-direction: column; gap: 7px; }
.pf-lg-item {
  background: rgba(0,0,0,.22);
  border: 1px solid var(--line);
  border-radius: var(--r-sm); overflow: hidden;
  transition: border-color .16s;
}
body.light .pf-lg-item { background: rgba(29,26,18,.03); }
.pf-lg-item.open { border-color: rgba(230,196,108,.55); }
.pf-lg-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 13px; cursor: pointer;
}
.pf-lg-head:active { background: var(--accent2); }
.pf-lg-head-left { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1; }
.pf-lg-emoji { font-size: 17px; line-height: 1; }
.pf-lg-name {
  font-size: 14px; font-weight: var(--fw-med);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pf-lg-head-right {
  display: flex; align-items: center; gap: 9px;
  flex-shrink: 0; font-size: var(--fs-meta); color: var(--hint);
}
.pf-lg-pts {
  font-size: 14px; font-weight: var(--fw-black);
  background: var(--gold-grad);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.pf-lg-cnt::before { content: "· "; color: var(--hint); }
.pf-lg-chev { display: inline-block; transition: transform .2s; font-size: 11px; color: var(--hint); }
.pf-lg-item.open .pf-lg-chev { transform: rotate(180deg); color: var(--accent); }
.pf-lg-body { display: none; padding: 0 13px 13px; }
.pf-lg-item.open .pf-lg-body { display: block; }
.pf-lg-meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 11px; }
.pf-lg-meta-box {
  background: rgba(0,0,0,.25);
  border-radius: 9px; padding: 7px 4px; text-align: center;
}
body.light .pf-lg-meta-box { background: rgba(29,26,18,.04); }
.pf-lg-meta-box .num { font-size: var(--fs-h3); font-weight: var(--fw-bold); }
.pf-lg-meta-box .lbl {
  font-size: var(--fs-meta); color: var(--hint); margin-top: 3px;
  text-transform: uppercase; letter-spacing: var(--ls-meta);
}
.pf-lg-pending { margin-top: 9px; font-size: var(--fs-meta); color: var(--hint); text-align: center; }
.pf-section .ach-list { gap: 6px; }
.pf-section .ach-badge { font-size: var(--fs-meta); padding: 6px 10px; }

/* ============================================================================
   XP-КАРТОЧКА — «чёрная карта» с золотой фольгой
   ============================================================================ */
.xp-card {
  background: linear-gradient(140deg, #1c1a12 0%, #12100a 55%, #171408 100%);
  border: 1px solid rgba(230,196,108,.38);
  border-radius: 22px;
  padding: 18px;
  color: var(--text);
  margin-bottom: 15px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-pop), var(--inset-top);
}
.xp-card::before {
  content: "";
  position: absolute;
  top: -45%; right: -18%;
  width: 230px; height: 230px;
  background: radial-gradient(circle, rgba(230,196,108,.22), transparent 68%);
  border-radius: 50%;
  pointer-events: none;
}
.xp-card::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(115deg, transparent 30%, rgba(247,227,166,.06) 45%, rgba(247,227,166,.12) 50%, rgba(247,227,166,.06) 55%, transparent 70%);
  transform: translateX(-120%);
  animation: foilSweep 5.5s ease-in-out infinite;
  pointer-events: none;
}
@keyframes foilSweep {
  0%, 55% { transform: translateX(-120%); }
  85%, 100% { transform: translateX(120%); }
}
.xp-head { display: flex; align-items: center; gap: 13px; margin-bottom: 14px; position: relative; z-index: 1; }
.xp-level-badge {
  width: 58px; height: 58px; border-radius: 50%;
  background: rgba(230,196,108,.10);
  border: 2px solid rgba(230,196,108,.5);
  display: flex; align-items: center; justify-content: center;
  font-size: 25px; flex-shrink: 0;
  position: relative;
  box-shadow: inset 0 0 18px rgba(230,196,108,.18), 0 0 18px rgba(230,196,108,.2);
}
.xp-level-badge .xp-lvl-num {
  position: absolute; bottom: -8px; left: 50%;
  transform: translateX(-50%);
  background: var(--gold-grad); color: var(--on-accent);
  font-size: 9px; font-weight: var(--fw-black);
  padding: 2px 7px; border-radius: 7px;
  white-space: nowrap; letter-spacing: .5px;
  box-shadow: 0 3px 10px rgba(230,196,108,.45);
  font-family: var(--font-display);
}
.xp-info { flex: 1; min-width: 0; }
.xp-title {
  font-size: var(--fs-h2); font-weight: var(--fw-black);
  margin-bottom: 4px; letter-spacing: .2px;
  font-family: var(--font-display);
  background: linear-gradient(120deg, #f7e3a6, #e6c46c 60%, #c69a34);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.xp-sub {
  font-size: var(--fs-meta); color: var(--hint);
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  text-transform: uppercase; letter-spacing: .8px;
}
.xp-streak {
  background: rgba(230,196,108,.16);
  color: var(--accent);
  padding: 3px 9px; border-radius: 12px;
  font-weight: var(--fw-bold);
  border: 1px solid rgba(230,196,108,.3);
}
.xp-total { text-align: right; flex-shrink: 0; }
.xp-total-num {
  font-size: var(--fs-h3); font-weight: var(--fw-black);
  line-height: 1.1; letter-spacing: var(--ls-tight);
}
.xp-total-lbl {
  font-size: 10px; color: var(--hint);
  text-transform: uppercase; letter-spacing: .8px;
}
.xp-bar-track {
  height: 11px;
  background: rgba(0,0,0,.4);
  border-radius: 8px; overflow: hidden;
  margin-bottom: 7px;
  position: relative; z-index: 1;
  box-shadow: inset 0 1px 4px rgba(0,0,0,.6);
  border: 1px solid rgba(255,255,255,.05);
}
.xp-bar-fill {
  height: 100%;
  background: var(--gold-grad);
  border-radius: 8px;
  transition: width .7s cubic-bezier(.4,0,.2,1);
  display: flex; align-items: center; justify-content: flex-end;
  padding-right: 7px;
  position: relative;
  box-shadow: 0 0 14px rgba(230,196,108,.55);
  min-width: 26px;
}
.xp-bar-pct {
  font-size: 9px; font-weight: var(--fw-black);
  color: var(--on-accent); letter-spacing: .4px;
}
.xp-bar-label {
  display: flex; justify-content: space-between;
  font-size: var(--fs-meta); color: var(--hint);
  margin-bottom: 14px;
  position: relative; z-index: 1; gap: 9px;
  letter-spacing: .6px;
}
.xp-bar-label span { white-space: nowrap; }
.xp-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; position: relative; z-index: 1; }
.xp-stat-box {
  background: rgba(255,255,255,.045);
  border: 1px solid rgba(230,196,108,.16);
  border-radius: 12px; padding: 9px 4px; text-align: center;
}
.xp-stat-box .num {
  font-size: var(--fs-num-sm); font-weight: var(--fw-black);
  line-height: 1.1; letter-spacing: var(--ls-tight);
  background: linear-gradient(120deg, #f7e3a6, #e6c46c);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.xp-stat-box .lbl {
  font-size: 10px; color: var(--hint); margin-top: 3px;
  text-transform: uppercase; letter-spacing: .6px;
}

/* ============================================================================
   ЗАДАНИЯ
   ============================================================================ */
.tasks-section { margin-bottom: 17px; }
.tasks-section-title {
  font-size: var(--fs-meta); font-weight: var(--fw-bold);
  text-transform: uppercase; letter-spacing: 1.4px;
  color: var(--hint); margin: 0 4px 9px;
}
.task-card {
  display: flex; align-items: center; gap: 13px;
  border-radius: var(--r-md);
  padding: 13px 15px; margin-bottom: 9px;
  transition: .18s;
  position: relative; overflow: hidden;
}
.task-card.done { border-color: rgba(230,196,108,.55); background: var(--accent2); }
.task-card.claimed { opacity: .62; }
.task-icon {
  width: 46px; height: 46px;
  border-radius: 13px;
  background: rgba(0,0,0,.28);
  border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: 23px; flex-shrink: 0;
}
body.light .task-icon { background: rgba(29,26,18,.04); }
.task-card.done .task-icon {
  background: var(--gold-grad);
  border-color: transparent;
  box-shadow: var(--gold-glow);
}
.task-body { flex: 1; min-width: 0; }
.task-title { font-size: 14px; font-weight: var(--fw-bold); margin-bottom: 4px; }
.task-desc { font-size: var(--fs-meta); color: var(--hint); margin-bottom: 7px; }
.task-progress {
  height: 6px;
  background: rgba(0,0,0,.3);
  border-radius: 5px; overflow: hidden; margin-bottom: 5px;
}
body.light .task-progress { background: rgba(29,26,18,.07); }
.task-progress-fill {
  height: 100%;
  background: var(--gold-grad);
  border-radius: 5px; transition: width .45s;
}
.task-card.done .task-progress-fill { background: var(--gold-grad); }
.task-progress-text {
  font-size: 10px; color: var(--hint);
  display: flex; justify-content: space-between;
  letter-spacing: .4px;
}
.task-reward { display: flex; flex-direction: column; align-items: center; gap: 5px; flex-shrink: 0; }
.task-xp {
  font-size: 13px; font-weight: var(--fw-black);
  background: var(--gold-grad);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* Кнопка «Забрать» — золотая пульсация */
.task-claim-btn {
  padding: 7px 12px;
  background: var(--gold-grad); color: var(--on-accent);
  border: none; border-radius: 10px;
  font-size: var(--fs-meta); font-weight: var(--fw-black);
  text-transform: uppercase; letter-spacing: .6px;
  cursor: pointer; position: relative;
  box-shadow: 0 0 0 0 rgba(230,196,108,.55);
  animation: pulseClaim 1.8s cubic-bezier(.4,0,.6,1) infinite;
  will-change: box-shadow, transform;
}
.task-claim-btn:active { transform: scale(.93); animation-play-state: paused; }
@keyframes pulseClaim {
  0%   { box-shadow: 0 0 0 0 rgba(230,196,108,.65), 0 0 14px 3px rgba(230,196,108,.45); transform: scale(1); }
  45%  { box-shadow: 0 0 0 7px rgba(230,196,108,0),  0 0 24px 7px rgba(230,196,108,.85); transform: scale(1.04); }
  70%  { box-shadow: 0 0 0 0 rgba(230,196,108,0),   0 0 14px 4px rgba(230,196,108,.55); transform: scale(1); }
  100% { box-shadow: 0 0 0 0 rgba(230,196,108,.65), 0 0 14px 3px rgba(230,196,108,.45); transform: scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  .task-claim-btn { animation: none; box-shadow: 0 0 0 4px rgba(230,196,108,.25); }
  .xp-card::after { animation: none; }
}
.task-claimed-mark {
  font-size: var(--fs-meta); color: var(--win); font-weight: var(--fw-black);
  letter-spacing: .6px; text-transform: uppercase;
}

/* XP-тост */
.xp-toast {
  position: fixed;
  top: 84px; left: 50%;
  transform: translateX(-50%) translateY(-22px);
  background: var(--gold-grad);
  color: var(--on-accent);
  padding: 13px 24px;
  border-radius: 16px;
  font-size: var(--fs-h3); font-weight: var(--fw-black);
  z-index: 150;
  opacity: 0; pointer-events: none;
  box-shadow: 0 10px 32px rgba(230,196,108,.45);
  font-family: var(--font-display);
  letter-spacing: .3px;
}
.xp-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); transition: all .3s cubic-bezier(.34,1.4,.64,1); }

/* Модалка level up */
.levelup-backdrop {
  position: fixed; inset: 0;
  background: rgba(5,5,9,.82);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  z-index: 300;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity .3s;
}
.levelup-backdrop.show { opacity: 1; pointer-events: auto; }
.levelup-modal {
  background: linear-gradient(140deg, #f7e3a6 0%, #e6c46c 45%, #c69a34 100%);
  color: var(--on-accent);
  border-radius: 26px;
  padding: 34px 30px;
  text-align: center;
  max-width: 330px;
  transform: scale(.7);
  transition: transform .42s cubic-bezier(.34,1.56,.64,1);
  box-shadow: 0 24px 70px rgba(230,196,108,.45);
}
.levelup-backdrop.show .levelup-modal { transform: scale(1); }
.levelup-icon { font-size: 72px; margin-bottom: 12px; animation: bounceIcon .6s infinite alternate; }
@keyframes bounceIcon { to { transform: translateY(-10px) scale(1.05); } }
.levelup-title {
  font-size: 24px; font-weight: var(--fw-black); margin-bottom: 7px;
  color: var(--on-accent); font-family: var(--font-display);
}
.levelup-sub { font-size: 14px; opacity: .78; margin-bottom: 22px; color: var(--on-accent); }
.levelup-btn {
  padding: 13px 30px;
  background: #16120a; color: var(--accent-hi);
  border: none; border-radius: 14px;
  font-size: var(--fs-h3); font-weight: var(--fw-black);
  cursor: pointer;
  text-transform: uppercase; letter-spacing: .8px;
}

/* ============================================================================
   ПРИВАТНЫЕ ЛИГИ
   ============================================================================ */
.priv-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 15px; }
.priv-btn-create, .priv-btn-join {
  padding: 13px 15px;
  border-radius: var(--r-md);
  font-size: 14px; font-weight: var(--fw-bold);
  cursor: pointer; border: 1px solid var(--line);
  transition: .16s;
}
.priv-btn-create {
  background: var(--gold-grad); color: var(--on-accent);
  border-color: transparent;
  box-shadow: var(--gold-glow);
}
.priv-btn-join { background: var(--surface); color: var(--text); }
.priv-btn-create:active, .priv-btn-join:active { transform: scale(.96); }

.priv-leagues-list { display: flex; flex-direction: column; gap: 9px; }
.priv-league-card {
  display: flex; align-items: center; gap: 13px;
  padding: 15px;
  border-radius: var(--r-md); cursor: pointer;
  transition: .16s;
}
.priv-league-card:active {
  transform: scale(.98);
  border-color: rgba(230,196,108,.6);
  box-shadow: var(--gold-glow);
}
.plc-emoji { font-size: 29px; line-height: 1; flex-shrink: 0; }
.plc-body { flex: 1; min-width: 0; }
.plc-name {
  font-weight: var(--fw-bold); font-size: 15px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.plc-meta {
  font-size: 11px; color: var(--hint); margin-top: 4px;
  text-transform: uppercase; letter-spacing: .8px;
}
.plc-arrow { font-weight: var(--fw-bold); font-size: 18px; color: var(--accent); flex-shrink: 0; }

.league-match-pred { margin-top: 9px; border-top: 1px dashed var(--line); padding-top: 11px; }
.league-odds-row { display: flex; gap: 5px; margin-bottom: 7px; }
.league-odds-btn {
  flex: 1; padding: 8px;
  background: rgba(0,0,0,.25);
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 12px; font-weight: var(--fw-bold);
  text-align: center; cursor: pointer;
  transition: .14s;
}
body.light .league-odds-btn { background: rgba(29,26,18,.04); }
.league-odds-btn.selected {
  background: var(--gold-grad); color: var(--on-accent);
  border-color: transparent;
  box-shadow: var(--gold-glow);
}
.league-score-row { display: none; gap: 7px; align-items: center; }
.league-score-row.visible { display: flex; }
.league-score-row input {
  width: 38px; padding: 8px;
  border: 1px solid var(--line);
  background: rgba(0,0,0,.25);
  color: var(--text);
  border-radius: 8px; text-align: center;
  font-size: 14px; font-weight: var(--fw-black);
  font-family: var(--font-display);
}
body.light .league-score-row input { background: rgba(29,26,18,.04); }
.league-score-row button {
  flex: 1; padding: 8px;
  background: var(--gold-grad); color: var(--on-accent);
  border: none; border-radius: 8px;
  font-size: 12px; font-weight: var(--fw-black);
  cursor: pointer;
  box-shadow: var(--gold-glow);
}

.league-match-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px;
  border-radius: var(--r-sm); margin-bottom: 7px;
}
.league-match-item .info { flex: 1; min-width: 0; }
.league-match-item .name {
  font-size: 14px; font-weight: var(--fw-med);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.league-match-item .time { font-size: 11px; color: var(--hint); margin-top: 3px; }
.league-match-item input[type="checkbox"] {
  width: 22px; height: 22px;
  accent-color: var(--accent);
  cursor: pointer; flex-shrink: 0;
}

.pl-detail-header { display: flex; align-items: center; gap: 11px; margin-bottom: 15px; }
.pl-back-btn {
  padding: 9px 16px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 22px; color: var(--text);
  font-size: 13px; font-weight: var(--fw-med);
  cursor: pointer;
}
.pl-back-btn:active { background: var(--accent2); color: var(--accent); }
.pl-title {
  font-size: 16px; font-weight: var(--fw-bold);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1; min-width: 0;
}

.pl-invite-box {
  background: var(--accent2);
  border: 1px solid rgba(230,196,108,.5);
  border-radius: var(--r-md);
  padding: 15px; margin-bottom: 15px;
  text-align: center;
  box-shadow: var(--gold-glow);
}
.pl-invite-label {
  font-size: 10px; text-transform: uppercase;
  letter-spacing: 1.2px; color: var(--hint); margin-bottom: 7px;
}
.pl-invite-code {
  font-size: 30px; font-weight: var(--fw-black);
  letter-spacing: 6px;
  background: var(--gold-grad);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  font-family: ui-monospace, monospace;
  margin-bottom: 13px;
}
.pl-copy-btn, .pl-share-btn {
  width: 100%; padding: 11px;
  border-radius: var(--r-sm);
  font-size: 13px; font-weight: var(--fw-bold);
  cursor: pointer; border: 1px solid var(--line);
  background: rgba(0,0,0,.25); color: var(--text);
  margin-bottom: 7px;
  transition: .14s;
}
body.light .pl-copy-btn { background: rgba(29,26,18,.04); }
.pl-share-btn {
  background: var(--gold-grad); color: var(--on-accent);
  border-color: transparent;
  box-shadow: var(--gold-glow);
  margin-bottom: 0;
}
.pl-copy-btn:active, .pl-share-btn:active { transform: scale(.97); }

.pl-rating { display: flex; flex-direction: column; gap: 7px; margin-bottom: 17px; }
.pl-rating-row {
  display: flex; align-items: center; gap: 11px;
  padding: 13px 15px;
  border-radius: var(--r-md);
  border: 1px solid transparent;
}
.pl-rating-row.me {
  background: var(--accent2);
  border-color: rgba(230,196,108,.6);
  box-shadow: var(--gold-glow);
}
.plr-place {
  width: 34px; text-align: center;
  font-weight: var(--fw-black); font-size: 14px;
  color: var(--hint); flex-shrink: 0;
  font-family: var(--font-display);
}
.pl-rating-row:nth-child(1) .plr-place { color: var(--accent-hi); font-size: 20px; text-shadow: 0 0 14px rgba(230,196,108,.5); }
.pl-rating-row:nth-child(2) .plr-place { color: #cfd4dd; font-size: 20px; }
.pl-rating-row:nth-child(3) .plr-place { color: #d9a06a; font-size: 20px; }
.plr-body { flex: 1; min-width: 0; }
.plr-name {
  font-weight: var(--fw-med); font-size: 14px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.plr-sub { font-size: 11px; color: var(--hint); margin-top: 3px; letter-spacing: .5px; }
.plr-points { font-weight: var(--fw-black); font-size: 15px; flex-shrink: 0; }

.pl-actions { display: flex; flex-direction: column; gap: 8px; }
.pl-actions button {
  padding: 13px;
  border-radius: var(--r-sm);
  font-size: 14px; font-weight: var(--fw-bold);
  cursor: pointer; border: 1px solid var(--line);
  background: var(--surface); color: var(--text);
  transition: .14s;
}
.pl-actions .btn-danger {
  background: rgba(229,96,90,.12);
  color: var(--lose);
  border-color: rgba(229,96,90,.45);
}
.pl-actions button:active { transform: scale(.98); }

.emoji-row { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 13px; }
.emoji-pick {
  width: 46px; height: 46px;
  border-radius: 12px;
  border: 2px solid var(--line);
  background: var(--surface);
  font-size: 23px; cursor: pointer;
  transition: .14s;
}
.emoji-pick.selected {
  border-color: var(--accent);
  background: var(--accent2);
  box-shadow: var(--gold-glow);
}

/* ============================================================================
   МАГАЗИН
   ============================================================================ */
.shop-banner-compact {
  display: flex; align-items: center; gap: 13px;
  background: linear-gradient(135deg, rgba(230,196,108,.16), rgba(230,196,108,.04));
  border: 1px solid rgba(230,196,108,.4);
  border-radius: var(--r-md);
  padding: 12px 15px; margin-bottom: 17px;
  cursor: pointer; transition: .16s;
  box-shadow: var(--inset-top);
}
.shop-banner-compact:active { transform: scale(.98); box-shadow: var(--gold-glow); }
.sbc-left { display: flex; align-items: center; gap: 11px; flex-shrink: 0; }
.sbc-icon { font-size: 25px; line-height: 1; }
.sbc-title { font-size: 14px; font-weight: var(--fw-bold); }
.sbc-sub { font-size: 11px; color: var(--hint); margin-top: 2px; }
.sbc-progress {
  flex: 1; height: 6px;
  background: rgba(0,0,0,.3);
  border-radius: 5px; overflow: hidden; min-width: 40px;
}
body.light .sbc-progress { background: rgba(29,26,18,.07); }
.sbc-progress-fill {
  height: 100%;
  background: var(--gold-grad);
  border-radius: 5px; transition: width .45s;
  box-shadow: 0 0 8px rgba(230,196,108,.5);
}
.sbc-arrow { font-size: 20px; color: var(--accent); flex-shrink: 0; }

.shop-section-title {
  font-size: 11px; text-transform: uppercase; letter-spacing: 1.4px;
  color: var(--hint); font-weight: var(--fw-bold); margin: 0 4px 9px;
}

.shop-special {
  display: flex; align-items: center; gap: 11px;
  background: linear-gradient(135deg, rgba(168,85,247,.14), rgba(168,85,247,.04));
  border: 1.5px solid rgba(168,85,247,.55);
  border-radius: 12px;
  padding: 9px 11px; margin-bottom: 13px;
  position: relative; overflow: hidden;
  box-shadow: var(--inset-top);
}
.shop-special-icon {
  font-size: 23px; flex-shrink: 0;
  filter: drop-shadow(0 0 7px rgba(168,85,247,.7));
  position: relative; z-index: 1;
}
.shop-special-body { flex: 1; min-width: 0; }
.shop-special-name { font-size: 12px; font-weight: var(--fw-black); color: #d8b4fe; margin-bottom: 2px; }
.shop-special-desc {
  font-size: 9px; color: #a78bfa; margin-bottom: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.shop-special-price { font-size: 11px; font-weight: var(--fw-black); color: #fff; }
.shop-special-btn {
  padding: 7px 11px;
  background: linear-gradient(135deg, #b96df5, #8b3fd9);
  color: #fff; border: none; border-radius: 8px;
  font-size: 11px; font-weight: var(--fw-black);
  cursor: pointer; flex-shrink: 0;
  position: relative; z-index: 1;
  transition: .15s; line-height: 1.2; min-width: 0;
  box-shadow: 0 4px 14px rgba(168,85,247,.4);
}
.shop-special-btn:active:not(:disabled) { transform: scale(.94); }
.shop-special-btn:disabled {
  background: rgba(168,85,247,.3); color: rgba(255,255,255,.5);
  cursor: not-allowed; box-shadow: none;
}

.shop-boxes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 15px; }
.shop-box-compact {
  display: flex; align-items: center; gap: 9px;
  border-radius: 12px;
  padding: 9px 11px;
  min-height: 60px;
  transition: .16s; cursor: pointer;
}
.shop-box-compact:active:not(.locked) {
  transform: scale(.97);
  border-color: rgba(230,196,108,.6);
  box-shadow: var(--gold-glow);
}
.shop-box-compact.locked { opacity: .5; }
.sbox-emoji { font-size: 29px; line-height: 1; flex-shrink: 0; width: 38px; text-align: center; }
.sbox-body { flex: 1; min-width: 0; }
.sbox-name {
